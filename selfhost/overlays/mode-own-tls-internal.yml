# Deployment mode: this stack terminates TLS with YOUR certificate, and the dashboard is
# served only on a private interface. Phones still upload from the internet.
#
# The public listener needs selfhost/tls/cert.pem and selfhost/tls/key.pem. The internal
# listener gets its own certificate from cert-init -- a separate one, because it is reached
# by IP on a private address that your public certificate does not name.
services:
  config-guard:
    environment:
      TLS_MODE: own-tls
      DASHBOARD_EXPOSURE: internal

  cert-init:
    environment:
      TLS_MODE: own-tls
      DASHBOARD_EXPOSURE: internal

  web:
    # No route off the host in this mode either (docker-compose.yml): web holds your certificate's
    # private key and sees decrypted traffic, so Caddy staples no OCSP response (Caddyfile.split.tls).
    volumes:
      - ./Caddyfile.split.tls:/etc/caddy/Caddyfile:ro,z
      - "${CHRONICLE_STATE_DIR:-.}/tls:/etc/caddy/certs:ro,z"

  # web-forward holds the ports (docker-compose.yml); Caddy's own ports are 443 and 80.
  web-forward:
    ports:
      - "${HTTPS_PORT:-443}:8443"
      - "${TLS_HTTP_PORT:-80}:8880"
      - target: 8081
        published: "${INTERNAL_PORT:-8081}"
        host_ip: "${INTERNAL_BIND:-127.0.0.1}"
        protocol: tcp
