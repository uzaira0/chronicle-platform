# Optional, private observability for a single-host Chronicle deployment.
# The stack is deliberately independent of config-guard/backend health: when Chronicle is
# broken, Grafana and retained evidence must remain available to explain why.

# Anchors do not cross YAML documents, so the base file's x-logging cap is restated here.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

x-fluent-logging: &fluent-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:${FLUENT_BIT_FORWARD_PORT:-24224}"
    fluentd-async: "true"
    # 4096 events per container; worst case 3 x 4096 x 32 KiB = 384 MiB fits the host headroom.
    # A longer collector outage drops log lines past this; the app keeps running.
    fluentd-buffer-limit: "4096"
    fluentd-sub-second-precision: "true"
    labels: com.docker.compose.service
    tag: chronicle.{{index .ContainerLabels "com.docker.compose.service"}}

# CPU ceilings and GOMAXPROCS: see the note in docker-compose.yml.

# Anchors do not cross YAML documents: the base file's blackhole resolver, restated (docker-compose.yml).
x-no-external-dns: &no-external-dns ["192.0.2.53"]

services:
  health-probe:
    extends:
      file: config/health-probe.yml
      service: health-probe

  monitoring-cert-init:
    network_mode: none
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to the digest-pinned release image}
    restart: "no"
    logging: *default-logging
    user: "0:0"
    entrypoint: ["/bin/bash", "/selfhost/cert-init.sh"]
    environment:
      # Monitoring never prepares or validates the application's public listener.
      TLS_MODE: behind-proxy
      DASHBOARD_EXPOSURE: public
      BACKEND_TLS_DIR: /backend-tls
      MONITORING_ENABLED: "true"
      MONITORING_TLS_DIR: /monitoring-tls
      SERVICE_CERTIFICATE_DIGEST_FILE: /tls/monitoring-certificates.sha256
      GRAFANA_BIND: ${GRAFANA_BIND:-127.0.0.1}
    volumes:
      - ./cert-init.sh:/selfhost/cert-init.sh:ro,z
      - "${CHRONICLE_STATE_DIR:-.}/tls:/tls:z"
      - backend_tls:/backend-tls
      - monitoring_tls:/monitoring-tls
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 128m
    pids_limit: 64
    cpu_period: 100000
    cpu_quota: 100000

  # Copies Grafana's and the metrics password from .env into their files (like secrets-init),
  # so it is one of the two services whose environment holds a credential. It opens no connection.
  monitoring-config:
    network_mode: none
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to the digest-pinned release image}
    restart: "no"
    logging: *default-logging
    user: "0:0"
    entrypoint: ["/bin/bash", "/monitoring/render-config.sh"]
    environment:
      CHRONICLE_HOST_UID: ${CHRONICLE_HOST_UID:?run ./chronicle to select the operator UID}
      CHRONICLE_HOST_GID: ${CHRONICLE_HOST_GID:?run ./chronicle to select the operator GID}
      GRAFANA_BIND: ${GRAFANA_BIND:-127.0.0.1}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      METRICS_USERNAME: ${METRICS_USERNAME:-chronicle-metrics}
      METRICS_PASSWORD: ${METRICS_PASSWORD:?set METRICS_PASSWORD in .env}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-chronicle-selfhost}
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
      POSTGRES_IMAGE: ${POSTGRES_IMAGE:-}
      CADDY_IMAGE: ${CADDY_IMAGE:-}
      GRAFANA_IMAGE: ${GRAFANA_IMAGE:-}
      FLUENT_BIT_IMAGE: ${FLUENT_BIT_IMAGE:-}
      # The egress proxy's allowlist (monitoring/egress-allowlist.sh): the public URLs public-probe
      # checks and, when it is off this host, the alert webhook's host. Only host:port is written.
      PUBLIC_TLS_URL: "${CHRONICLE_PUBLIC_BASE_URL:-https://${DOMAIN}}"
      PUBLIC_HEALTH_URL: ${MONITORING_PUBLIC_HEALTH_URL:-}
      CHRONICLE_ALERT_WEBHOOK_URL: ${CHRONICLE_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/render-config.sh:/monitoring/render-config.sh:ro,z
      - ./monitoring/egress-allowlist.sh:/monitoring/egress-allowlist.sh:ro,z
      - egress_allowlist:/egress
      - ./network-policy.sh:/network-policy.sh:ro,z
      - monitoring_secrets:/monitoring-secrets
      - grafana_secrets:/grafana-secrets
      - backend_tls:/backend-tls:ro
      - monitoring_config:/monitoring-config
      - monitoring_textfiles:/metrics
      - vm_data:/vmdata
      - vl_data:/vldata
      - fluentbit_state:/fluent-bit/state
      - public_probe:/public-probe
      - public_probe_trust:/public-trust
    depends_on:
      monitoring-cert-init: {condition: service_completed_successfully}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 128m
    pids_limit: 64
    cpu_period: 100000
    cpu_quota: 100000

  # Read-only Docker API for cadvisor. A :ro bind of /var/run does not stop connect() on the
  # socket, so cadvisor with that mount held the full, writable Docker API (host root). Only
  # this service touches the socket; it answers GET container/info/version and refuses every
  # POST, and it sits on an internal network that only cadvisor joins.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    logging: *default-logging
    # The host socket is root-owned; only this isolated proxy holds it.
    user: "0:0"
    entrypoint: ["haproxy"]
    # The image's own entrypoint, which reads CONTAINERS/INFO/POST variables, is replaced: this
    # HAProxy reads only docker-api.cfg, whose allowlist is the whole policy.
    command: ["-W", "-db", "-f", "/etc/haproxy/chronicle.cfg"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/docker-api.cfg:/etc/haproxy/chronicle.cfg:ro,z
      - ./monitoring/docker-api-strip-env.lua:/etc/haproxy/strip-env.lua:ro,z
    networks: [docker-api]
    dns: *no-external-dns
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/run:size=4m,mode=0755", "/tmp:size=4m,mode=1777"]
    mem_limit: 64m
    pids_limit: 64
    cpu_period: 100000
    cpu_quota: 100000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    logging: *default-logging
    # Unprivileged, and it mounts only what its metrics read: cgroups (/sys), host /proc for each
    # container's network counters, the layer-id files that map a container to its storage, and the
    # backups directory as a mount point for the free-space alerts (statfs only: it is 0700 for the
    # operator). Not Docker's containers/ or volumes/ (container configurations, credential volumes,
    # database files) and not the host root: none of that is readable here. Per-container disk
    # usage needs those, so it is not collected (the host and backups filesystems are). cAdvisor
    # warns about that for every container on every pass, so warnings go to /dev/null and only
    # errors reach the log (its per-container storage error retries with a backoff up to 20 min).
    user: "65532:65532"
    command:
      - "--logtostderr=false"
      - "--log_file=/dev/null"
      - "--stderrthreshold=ERROR"
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--docker=tcp://docker-socket-proxy:2375"
    environment:
      GOMAXPROCS: "1"
    volumes:
      - /sys:/sys:ro
      - /proc:/rootfs/proc:ro
      - /var/lib/docker/image/overlay2/layerdb/mounts:/rootfs/var/lib/docker/image/overlay2/layerdb/mounts:ro
      - "${CHRONICLE_STATE_DIR:-.}/backups:/rootfs/chronicle-backups:ro,z"
    networks: [monitoring, docker-api]
    dns: *no-external-dns
    depends_on:
      docker-socket-proxy: {condition: service_healthy}
      monitoring-config: {condition: service_completed_successfully}
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    mem_limit: ${CADVISOR_MEM_LIMIT:-256m}
    pids_limit: 256
    cpu_period: 100000
    cpu_quota: 100000
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  operational-probe:
    networks: [monitoring, database-probe]
    dns: *no-external-dns
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to the digest-pinned release image}
    restart: unless-stopped
    logging: *default-logging
    user: "${CHRONICLE_HOST_UID}:${CHRONICLE_HOST_GID}"
    entrypoint: ["/bin/bash", "/monitoring/probe.sh"]
    environment:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /etc/postgres-tls/postgres.crt
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-chronicle}
      POSTGRES_USER: ${POSTGRES_USER:-chronicle}
      # probe.sh reads it at start; secrets-init writes it.
      POSTGRES_PASSWORD_FILE: /run/secrets/chronicle/postgres-password
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # For a private public-origin CA, place the certificate in state tls/ and use /tls/<file>.
      # This probe copies only that certificate to public-probe, which has no /tls mount.
      PUBLIC_CA_FILE: ${MONITORING_PUBLIC_CA_FILE:-}
      # Validate the management certificate's identity while connecting inside Compose.
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-}
      INTERNAL_BIND: ${INTERNAL_BIND:-127.0.0.1}
      INTERNAL_PORT: ${INTERNAL_PORT:-8081}
      PROBE_INTERVAL_SECONDS: ${MONITORING_PROBE_INTERVAL_SECONDS:-30}
      COMPOSE_FILE_SELECTION: ${COMPOSE_FILE:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-}
      ENABLE_ENCRYPTION: ${ENABLE_ENCRYPTION:-true}
      METRICS_DISK_BUDGET_BYTES: ${METRICS_DISK_BUDGET_BYTES:-5368709120}
      LOGS_DISK_BUDGET_BYTES: ${LOGS_MAX_DISK_BYTES:-5368709120}
    volumes:
      - postgres_tls:/etc/postgres-tls:ro
      - ./monitoring/probe.sh:/monitoring/probe.sh:ro,z
      - ./chronicle_ops:/chronicle_ops:ro,z
      - ./monitoring/record-operation.sh:/monitoring/record-operation.sh:ro,z
      - monitoring_textfiles:/metrics
      - vm_data:/observability-data/metrics:ro
      - vl_data:/observability-data/logs:ro
      - "${CHRONICLE_STATE_DIR:-.}/backups:/backups:ro,z"
      - "${CHRONICLE_STATE_DIR:-.}/tls:/tls:ro,z"
      - public_probe_trust:/public-trust
      - operator_secrets:/run/secrets/chronicle:ro
    depends_on:
      monitoring-config: {condition: service_completed_successfully}
      secrets-init: {condition: service_completed_successfully, restart: true}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: ${OPERATIONAL_PROBE_MEM_LIMIT:-192m}
    pids_limit: 128
    cpu_period: 100000
    cpu_quota: 100000
    # Healthy while the probe loop keeps rewriting its textfile (interval is at most 300 s).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /metrics/operational.prom -mmin -11 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Fetches the public health URL and reads the served certificate, as a participant's phone would,
  # through egress-proxy, which tunnels only to the hosts in its allowlist. It holds no password,
  # mounts no database, backup or TLS key, and writes two metrics into its own volume.
  public-probe:
    networks: [egress-clients]
    dns: *no-external-dns
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to the digest-pinned release image}
    restart: unless-stopped
    logging: *default-logging
    user: "${CHRONICLE_HOST_UID}:${CHRONICLE_HOST_GID}"
    entrypoint: ["/bin/bash", "/monitoring/probe.sh"]
    environment:
      PROBE_SCOPE: public
      # curl uses HTTPS_PROXY; openssl s_client gets -proxy from PUBLIC_TLS_PROXY (probe.sh).
      HTTPS_PROXY: http://egress-proxy:3128
      PUBLIC_TLS_PROXY: egress-proxy:3128
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PUBLIC_HEALTH_URL: ${MONITORING_PUBLIC_HEALTH_URL:-}
      PUBLIC_TLS_URL: "${CHRONICLE_PUBLIC_BASE_URL:-https://${DOMAIN}}"
      PROBE_INTERVAL_SECONDS: ${MONITORING_PROBE_INTERVAL_SECONDS:-30}
    volumes:
      - ./monitoring/probe.sh:/monitoring/probe.sh:ro,z
      - public_probe:/metrics
      - public_probe_trust:/public-trust:ro
    depends_on:
      monitoring-config: {condition: service_completed_successfully}
      egress-proxy: {condition: service_started}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: ${PUBLIC_PROBE_MEM_LIMIT:-64m}
    pids_limit: 64
    cpu_period: 100000
    cpu_quota: 100000
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /metrics/public.prom -mmin -11 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # The only container with a route off the host: an HTTP CONNECT proxy (chronicle-forward -connect,
  # selfhost/caddy/forward) that opens a tunnel only to a host:port in the allowlist monitoring-config
  # derives from .env, and refuses everything else, including any name it would have to resolve.
  # Its clients (public-probe, and Grafana while the alert webhook is off this host) sit on the
  # internal egress-clients network with the blackhole resolver. It holds no credential, no data and
  # no volume but its allowlist (docs/NETWORK-EGRESS.md).
  egress-proxy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE to the digest-pinned release image}
    restart: unless-stopped
    user: "10001:0"
    logging: *default-logging
    entrypoint: ["/usr/bin/chronicle-forward"]
    command: ["-connect", "3128", "-allow", "/egress/allow", "-max-connections", "64"]
    networks: [egress, egress-clients]
    environment:
      GOMAXPROCS: "1"
    volumes:
      - egress_allowlist:/egress:ro
    depends_on:
      monitoring-config: {condition: service_completed_successfully, restart: true}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # 64m like the forwarders: the same binary under amd64 emulation (an arm64 workstation) holds
    # about 29 MiB with its healthcheck running, and 32m was OOM-killed there.
    mem_limit: 64m
    pids_limit: 32
    cpu_period: 100000
    cpu_quota: 100000
    healthcheck:
      test: ["CMD", "/usr/bin/chronicle-forward", "-check", "-connect", "3128"]
      interval: 30s
      timeout: 10s
      retries: 3

  metrics-exporter:
    networks: [monitoring]
    dns: *no-external-dns
    image: ${CADDY_IMAGE:?set CADDY_IMAGE to the digest-pinned release image}
    restart: unless-stopped
    user: "10001:0"
    logging: *default-logging
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    # Go starts about one thread per host CPU: 34 of the 64-pid limit on a 32-CPU host. It serves
    # one small text file to VictoriaMetrics.
    environment:
      GOMAXPROCS: "1"
    volumes:
      - ./monitoring/metrics.Caddyfile:/etc/caddy/Caddyfile:ro,z
      - monitoring_textfiles:/metrics:ro
      - public_probe:/public:ro
    expose: ["9090"]
    depends_on:
      monitoring-config: {condition: service_completed_successfully}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Binds only :9090, but the caddy binary carries file capability cap_net_bind_service; a
    # non-root exec fails with EPERM unless that capability stays in the bounding set.
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    tmpfs: ["/config:size=8m,mode=0700,uid=10001,gid=0", "/data:size=8m,mode=0700,uid=10001,gid=0"]
    mem_limit: ${METRICS_EXPORTER_MEM_LIMIT:-64m}
    pids_limit: 64
    cpu_period: 100000
    cpu_quota: 100000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/operational.prom"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  victoriametrics:
    networks: [monitoring]
    dns: *no-external-dns
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    restart: unless-stopped
    logging: *default-logging
    user: "65534:65534"
    environment:
      GOMAXPROCS: "2"
    command:
      - "--storageDataPath=/vmdata"
      - "--retentionPeriod=${METRICS_RETENTION:-30d}"
      - "--storage.minFreeDiskSpaceBytes=${METRICS_MIN_FREE_DISK_BYTES:-8589934592}"
      - "--promscrape.config=/etc/vm/scrape.yml"
      - "--promscrape.maxScrapeSize=64MiB"
    volumes:
      - health_probe:/probe:ro
      - vm_data:/vmdata
      - monitoring_config:/etc/vm:ro
      - monitoring_secrets:/run/secrets/chronicle-metrics:ro
    expose: ["8428"]
    depends_on:
      health-probe: {condition: service_completed_successfully}
      monitoring-config: {condition: service_completed_successfully}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: ${VICTORIAMETRICS_MEM_LIMIT:-512m}
    pids_limit: 256
    cpu_period: 100000
    cpu_quota: 200000

  victorialogs:
    networks: [monitoring]
    dns: *no-external-dns
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    restart: unless-stopped
    logging: *default-logging
    user: "65534:65534"
    environment:
      GOMAXPROCS: "2"
    command:
      - "-storageDataPath=/vldata"
      - "-retentionPeriod=${LOGS_RETENTION:-14d}"
      - "-retention.maxDiskSpaceUsageBytes=${LOGS_MAX_DISK_BYTES:-5368709120}"
      - "-httpListenAddr=:9428"
    volumes:
      - health_probe:/probe:ro
      - vl_data:/vldata
    expose: ["9428"]
    depends_on:
      health-probe: {condition: service_completed_successfully}
      monitoring-config: {condition: service_completed_successfully}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: ${VICTORIALOGS_MEM_LIMIT:-512m}
    pids_limit: 256
    cpu_period: 100000
    cpu_quota: 200000

    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:9428/health"]
  fluent-bit:
    # Internal only; monitoring-forward holds the loopback log port Docker's fluentd driver uses.
    networks: [monitoring, monitoring-ingress]
    dns: *no-external-dns
    image: ${FLUENT_BIT_IMAGE:?set FLUENT_BIT_IMAGE in .env}
    restart: unless-stopped
    logging: *default-logging
    user: "100:101"
    volumes:
      - health_probe:/probe:ro
      - ./monitoring/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro,z
      - ./monitoring/parsers.conf:/fluent-bit/etc/parsers.conf:ro,z
      - ./monitoring/sanitize.lua:/fluent-bit/etc/sanitize.lua:ro,z
      - audit_logs:/var/log/chronicle:ro
      - monitoring_textfiles:/monitoring-events:ro
      - fluentbit_state:/fluent-bit/state
    depends_on:
      health-probe: {condition: service_completed_successfully}
      monitoring-config: {condition: service_completed_successfully}
      victorialogs: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777", "/run:size=4m,mode=0755"]
    mem_limit: ${FLUENT_BIT_MEM_LIMIT:-128m}
    pids_limit: 128
    cpu_period: 100000
    cpu_quota: 100000

    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:2020/api/v1/health"]
  grafana:
    # networks (and, while the alert webhook is off this host, the egress proxy settings):
    # monitoring/docker-compose.grafana-alerts-closed.yml or -open.yml. ./chronicle derives
    # CHRONICLE_ALERT_EGRESS from .env (chronicle_ops/egress.py).
    extends:
      file: monitoring/docker-compose.grafana-alerts-${CHRONICLE_ALERT_EGRESS:-closed}.yml
      service: grafana
    dns: *no-external-dns
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE in .env}
    restart: unless-stopped
    logging: *default-logging
    user: "472:0"
    environment:
      # Grafana and its backend plugin processes, which inherit this environment.
      GOMAXPROCS: "2"
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/tls/monitoring.crt
      GF_SERVER_CERT_KEY: /etc/grafana/tls/monitoring.key
      # Written by monitoring-config (render-config.sh) from GRAFANA_ADMIN_PASSWORD.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/chronicle-grafana/admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PATHS_PLUGINS: /opt/chronicle-plugins
      # Grafana 13.2 otherwise replaces its bundled datasources (prometheus among them) from
      # the plugin catalog at every start. The read-only root refuses, the plugins end up
      # unregistered, and every metrics alert rule fails. The pinned image is the version.
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#preinstall_auto_update
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # No catalog downloads and no news feed: Grafana has no route out unless an external alert
      # webhook is configured, and then only for that webhook.
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#preinstall_disabled
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Every bundled backend datasource runs as its own process with about one thread per host CPU.
      # On a 32-CPU host the twelve that Chronicle never uses took 482 of the 512 pids below and
      # most of the 512 MiB: health-check execs failed and Grafana stayed unhealthy. Only
      # prometheus (VictoriaMetrics) and the VictoriaLogs plugin are provisioned; keep the rest off.
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#disable_plugins
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
      # Alert delivery target, read by grafana-alerting/contactpoints.yml. The default is the
      # closed discard port on loopback: alerts stay visible in Grafana only. See
      # docs/MONITORING-RUNBOOK.md "Attach a notification channel".
      CHRONICLE_ALERT_WEBHOOK_URL: ${CHRONICLE_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/dashboard-only}
    volumes:
      - monitoring_tls:/etc/grafana/tls:ro
      - grafana_data:/var/lib/grafana
      - grafana_secrets:/run/secrets/chronicle-grafana:ro
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/chronicle.yml:ro,z
      - ./monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/chronicle.yml:ro,z
      - ./monitoring/grafana-dashboards:/etc/grafana/dashboards:ro,z
      - ./monitoring/grafana-alerting:/etc/grafana/provisioning/alerting:ro,z
      - ./monitoring/runbooks.html:/usr/share/grafana/public/runbooks/index.html:ro,z
    depends_on:
      monitoring-cert-init: {condition: service_completed_successfully}
      monitoring-config: {condition: service_completed_successfully, restart: true}
      victoriametrics: {condition: service_healthy}
      victorialogs: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    pids_limit: 512
    cpu_period: 100000
    cpu_quota: 200000
    healthcheck:
      # Grafana's own health only. VictoriaMetrics and VictoriaLogs have their own healthchecks, and
      # scrape targets are a pipeline property that ./chronicle doctor checks; coupling them here
      # reported Grafana unhealthy whenever another service was.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/etc/grafana/tls/monitoring.crt", "https://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 120s

  # Holds Grafana's dashboard port and Fluent Bit's loopback log port, which Docker publishes
  # only on a network it connects to the host. Like web-forward (docker-compose.yml): no data,
  # credentials or volumes, chronicle-forward from CADDY_IMAGE, TCP copied over the internal
  # monitoring-ingress network. Grafana's traffic is TLS end to end.
  monitoring-forward:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE to the digest-pinned release image}
    restart: unless-stopped
    user: "10001:0"
    logging: *default-logging
    entrypoint: ["/usr/bin/chronicle-forward"]
    command: ["3000=grafana:3000", "24224=fluent-bit:24224"]
    networks: [monitoring-ports, monitoring-ingress]
    dns: *no-external-dns
    environment:
      GOMAXPROCS: "2"
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${FLUENT_BIT_FORWARD_PORT:-24224}:24224"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    mem_limit: 64m
    pids_limit: 64
    cpu_period: 100000
    cpu_quota: 200000
    healthcheck:
      test: ["CMD", "/usr/bin/chronicle-forward", "-check", "3000=grafana:3000", "24224=fluent-bit:24224"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    logging: *fluent-logging
  postgres:
    logging: *fluent-logging
  web:
    group_add: ["101"] # Read the backend TLS key used by the private scrape listener.
    networks: [monitoring]
    volumes:
      - ./monitoring/backend-metrics.caddy:/etc/caddy/monitoring/backend-metrics.caddy:ro,z
    logging: *fluent-logging
  config-guard:
    user: "0:0"
    environment:
      GRAFANA_IMAGE: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE in .env}
      FLUENT_BIT_IMAGE: ${FLUENT_BIT_IMAGE:?set FLUENT_BIT_IMAGE in .env}
      MONITORING_ENABLED: "true"
      GRAFANA_BIND: ${GRAFANA_BIND:-127.0.0.1}
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
    volumes:
      - monitoring_textfiles:/monitoring-metrics

networks:
  # Scrapes, logs and the dashboard's data sources. Internal: nothing on it can leave the host.
  monitoring:
    internal: true
  # Published ports need a bridge Docker connects to the host: monitoring-forward alone joins
  # this one. Docker does not masquerade it, and it resolves no external name.
  monitoring-ports:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # monitoring-forward to Grafana and Fluent Bit. Internal.
  monitoring-ingress:
    internal: true
  # The ordinary outbound bridge. egress-proxy alone joins it.
  egress: {}
  # egress-proxy's clients: public-probe, and Grafana while the alert webhook is off this host.
  # Internal: they reach nothing but the proxy, which tunnels only to its allowlist.
  egress-clients:
    internal: true
  docker-api:
    internal: true

volumes:
  public_probe:
  public_probe_trust:
  egress_allowlist:
  health_probe:
  vm_data:
  vl_data:
  grafana_data:
  monitoring_tls:
  fluentbit_state:
  monitoring_secrets:
  grafana_secrets:
  monitoring_config:
  monitoring_textfiles:
