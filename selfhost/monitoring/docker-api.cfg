global
    maxconn 128
    # A container inspect response is buffered whole so its Env can be blanked (below).
    tune.bufsize 262144
    lua-load /etc/haproxy/strip-env.lua
    # HAProxy otherwise starts one thread per host CPU: 33 of the 64-pid limit on a 32-CPU host.
    nbthread 2

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker_api
    bind :2375
    acl read_method method GET
    acl allowed_path path_reg ^(/v[0-9.]+)?/(version|info|containers/json|containers/[a-f0-9]+/(json|stats))$
    http-request deny deny_status 403 unless read_method allowed_path
    # Container inspect carries every container's environment, including the one-shot jobs
    # that hold credentials. cAdvisor reads none of it; blank it and fail closed.
    # The path is gone by response time, so the request marks the transaction.
    http-request set-var(txn.inspect) bool(true) if { path_reg ^(/v[0-9.]+)?/containers/[a-f0-9]+/json$ }
    http-request del-header Accept-Encoding
    http-response wait-for-body time 5s if { var(txn.inspect) -m bool }
    # The Lua action answers with the blanked body and ends the rules; reaching the next line
    # means it could not (error, truncated body), so the original response never leaves.
    http-response lua.chronicle_strip_env if { var(txn.inspect) -m bool }
    http-response return status 502 content-type text/plain string "container environment could not be removed" if { var(txn.inspect) -m bool }
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
