# OSV-Scanner waivers. Each names one package version, so a bump stops matching on its own.
# Every entry expires; re-triage before effectiveUntil. osv-scanner refuses unknown keys, so each reason
# names its owner ("Owner: NAME.") and its last recheck ("Rechecked YYYY-MM-DD"). Expiries are staggered
# (at most a quarter of the entries share a date) and every waived version must still be resolved:
# tests/security/check-osv-waivers.py fails otherwise.

[[PackageOverrides]]
name = "io.netty:netty-codec"
version = "4.1.93.Final"
ecosystem = "Maven"
vulnerability.ignore = true
effectiveUntil = 2026-11-27
reason = "Build-time only, not in the APK (absent from chronicle/app/gradle.lockfile release runtime classpaths). Resolved only into AGP 9.0.1's _internal-unified-test-platform-* configurations, which run solely for connected or managed-device instrumented tests; no gate, release or Play build runs them, and their network peer is a local emulator or device. AGP pins these versions; drop when an AGP upgrade carries the fixed release (handoff to the android lane, triage 2026-10-22). Owner: uzaira0 (Android build). Rechecked 2026-11-06: the build still pins AGP 9.0.1 (chronicle/build.gradle); AGP 9.5.1 is the newest stable release, so dropping this waiver means that upgrade."

