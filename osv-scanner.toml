[[PackageOverrides]]
name = "org.jetbrains.kotlin:kotlin-gradle-plugin"
version = "2.4.10"
ecosystem = "Maven"
vulnerability.ignore = true
effectiveUntil = 2026-11-20
reason = "GHSA-r937-wjx7-w2jp needs an attacker-writable Kotlin build cache. Chronicle configures no remote or shared build cache (chronicle/settings.gradle, settings.gradle.kts); builds use the invoking user's own Gradle home. The only fix is 2.4.20-Beta1; move to 2.4.20 when it is stable (triage 2026-10-22). Owner: uzaira0 (backend and Android builds). Rechecked 2026-11-06: Kotlin 2.4.20 (2026-09-07) and 2.4.21 are stable and fix it; the build still pins 2.4.10 (gradles/chronicle.gradle, settings.gradle.kts), so the Kotlin upgrade is due."

[[PackageOverrides]]
name = "golang.org/x/crypto"
version = "0.58.0"
ecosystem = "Go"
vulnerability.ignore = true
effectiveUntil = 2026-12-31
reason = "GO-2026-5932 covers only golang.org/x/crypto/openpgp (unmaintained; fixed only by a pseudo-version that removes it). The caddy build (selfhost/caddy/module) links no openpgp package: `go list -deps -tags nobadger,nomysql,nopgx .` lists 0 golang.org/x/crypto/openpgp packages (triage 2026-11-06, dependency-intake lane). Drop when x/crypto ships a release without openpgp. Owner: uzaira0 (selfhost images). Rechecked 2026-11-06."
