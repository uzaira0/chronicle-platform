# lefthook.yml — Chronicle monorepo git hooks
# Docs: https://github.com/evilmartians/lefthook
#
# Install:  ./scripts/setup-hooks.sh
# Run manually:  lefthook run pre-commit
# Skip (emergency):  git commit --no-verify
#
# To make typecheck run on pre-commit:
#   lefthook run pre-commit --force  (runs all, including optional)
#   Or remove the skip_tags line below.

skip_tags:
  - optional

pre-commit:
  parallel: true
  commands:
    kotlin-daemon-state:
      # The Kotlin daemon rewrites .kotlin/sessions/*.salive on every build; .gitignore keeps it
      # out of `git add -A`, and this refuses a force-added path.
      glob: ".kotlin/**"
      run: "printf 'Kotlin daemon state must not be committed: %s\\n' {staged_files} >&2; exit 1"
    biome-check:
      root: "chronicle-web/"
      glob: "src/**/*.{ts,tsx,js,jsx}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    gitleaks:
      run: gitleaks protect --staged --verbose --redact
      fail_text: |
        Secrets detected! Remove them before committing.
        If this is a false positive, add an inline '# gitleaks:allow' comment
        or update tests/security/gitleaks.toml.

    hadolint:
      glob: "docker/Dockerfile*"
      run: hadolint --failure-threshold error {staged_files}

    typecheck:
      root: "chronicle-web/"
      glob: "src/**/*.{ts,tsx}"
      run: bun run typecheck
      tags: optional

    detekt:
      glob: "**/*.kt"
      # Security guardrail fixtures are deliberately malformed (they exist to TRIGGER
      # rules) and are not production source — never code-quality-lint them. Excluding
      # them also sidesteps the {staged_files} space-vs-comma `--input` issue when
      # several fixture .kt files are staged together.
      exclude:
        - "tests/security/fixtures/**"
        - "tests/security/semgrep-tests/**"
        - "tests/security/rules/**"
      # detekt-cli takes one comma-separated --input; lefthook substitutes space-separated paths.
      run: sh -c 'IFS=,; detekt-cli --input "$*" --config detekt.yml --baseline detekt-baseline.xml --build-upon-default-config' detekt {staged_files}

pre-push:
  parallel: true
  commands:
    python-shell-and-paths:
      run: python3 scripts/check-python-shell.py && python3 scripts/check-machine-paths.py
    i18n-lint:
      glob: "**/*.{ts,tsx,kt,swift}"
      run: scripts/i18n-lint.sh
      fail_text: |
        Hardcoded English found where a translation must be able to override it.
        See <repo>/lint/i18n/*.yml for the rule and its allowed suppression comment.

    chronicle-web-check:
      root: "chronicle-web/"
      glob: "**/*.{ts,tsx,js,jsx}"
      run: bun run check

    domain-contract-guardrails:
      glob: "{chronicle-api,chronicle-api/chronicle.yaml,chronicle-models,chronicle-models/**,chronicle-web,chronicle-web/src/modern/generated/**,chronicle-web/src/modern/types/**,generated/domain-contracts/**,tests/security/ast-grep/**,tests/security/contract-drift-diff.py}"
      run: tests/security/domain-contract-guardrails.sh

    selfhost-verify-config:
      root: "selfhost/"
      glob: "**/*"
      run: ./verify-config.sh

    kotlin-compile:
      glob: "**/*.kt"
      run: ./gradlew :chronicle-server:compileKotlin --no-daemon -q
      tags: optional
