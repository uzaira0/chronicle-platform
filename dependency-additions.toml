# Reviewed new dependency names (docs/SUPPLY-CHAIN.md). scripts/check-dependency-age.py fails any package
# name that a change adds to a lockfile or pin file unless it is listed here, by name or, for a newly
# committed lockfile, by that file at the revision that was reviewed (only the names the file held at
# `revision` are admitted; a name added later needs its own row). Entries stay: this is the record of
# who let each name in and why.
# Fields: ecosystem (npm, npm-source, maven, go, pypi, oci, github-release, gradle-dist, apk, deb, deb-source, rpm), name OR lockfile
# (with revision = the reviewed commit), reviewer, reason. An npm package from anywhere but the npm
# registry (git, github, a tarball URL, another registry, link:, a path outside the repository) is
# ecosystem "npm-source" with source = the exact bun.lock source, after someone has read that source.

[policy]
# Pins present at this revision were accepted under the review that preceded this policy
# (the 2026.11 image/CVE lane) and are not aged again. Later changes are.
adopted_at = "5702037df8f3a1621628c80e80b43ed41f01e9c4"

