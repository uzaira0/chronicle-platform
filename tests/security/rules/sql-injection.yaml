rules:
  - id: chronicle-sql-concat
    patterns:
      - pattern-either:
          - pattern: |
              $X + "SELECT " + $Y
          - pattern: |
              $X + "INSERT " + $Y
          - pattern: |
              $X + "UPDATE " + $Y
          - pattern: |
              $X + "DELETE " + $Y
          - pattern: |
              $X + "WHERE " + $Y
          - pattern: |
              $X + "FROM " + $Y
          - pattern: |
              "SELECT " + $Y
          - pattern: |
              "INSERT " + $Y
          - pattern: |
              "UPDATE " + $Y
          - pattern: |
              "DELETE " + $Y
          - pattern: |
              "WHERE " + $Y
          - pattern: |
              "FROM " + $Y
    message: >
      String concatenation detected in SQL query construction. This is
      vulnerable to SQL injection. Use parameterized queries or
      PreparedStatement with bind parameters instead.
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: CWE-89
      owasp: "A03:2021"
      category: security
      confidence: HIGH

  - id: chronicle-sql-format
    patterns:
      - pattern: |
          String.format($FMT, ...)
      - metavariable-regex:
          metavariable: $FMT
          regex: ".*(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\\s.*"
    message: >
      String.format() used to construct SQL query. This is vulnerable to SQL
      injection if any format arguments come from user input. Use
      parameterized queries or PreparedStatement with bind parameters instead.
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: CWE-89
      owasp: "A03:2021"
      category: security
      confidence: HIGH

  - id: chronicle-raw-statement
    patterns:
      - pattern-either:
          - pattern: |
              $CONN.createStatement().execute($SQL)
          - pattern: |
              $CONN.createStatement().executeQuery($SQL)
          - pattern: |
              $CONN.createStatement().executeUpdate($SQL)
      - metavariable-regex:
          metavariable: $SQL
          regex: "^[a-zA-Z_].*"
    message: >
      Raw Statement execution with a dynamic SQL variable detected. Prefer
      PreparedStatement with parameterized queries unless the SQL is a vetted
      constant with no user-controlled input.
    languages: [java, kotlin]
    severity: WARNING
    metadata:
      cwe: CWE-89
      owasp: "A03:2021"
      category: security
      confidence: MEDIUM

  - id: chronicle-statement-execute
    # SQL text built from values at the call: concatenation, String.format or a Kotlin
    # template, inline or through a local. Constant SQL, SQL a caller passes in, and
    # DDL from code-defined table definitions are not built here.
    patterns:
      - pattern: (java.sql.Statement $S).$M($ARG)
      - metavariable-regex:
          metavariable: $M
          regex: ^(execute|executeQuery|executeUpdate)$
      - pattern-either:
          - pattern: $S.$M($A + $B)
          - pattern: $S.$M(String.format(...))
          - patterns:
              - pattern: $S.$M($ARG)
              - metavariable-regex:
                  metavariable: $ARG
                  regex: '^"(?:[^"\\]|\\.)*\$[{A-Za-z_]'
          - patterns:
              - pattern-inside: |
                  $Q = $A + $B;
                  ...
              - pattern: $S.$M($Q)
          - patterns:
              - pattern-inside: |
                  $Q = String.format(...);
                  ...
              - pattern: $S.$M($Q)
          - patterns:
              - pattern-inside: |
                  $Q = $T;
                  ...
              - metavariable-regex:
                  metavariable: $T
                  regex: '^"(?:[^"\\]|\\.)*\$[{A-Za-z_]'
              - pattern: $S.$M($Q)
    message: >
      Statement.execute() runs SQL text built from values. This is vulnerable
      to SQL injection if any value is user-controlled. Use PreparedStatement
      with bind parameters instead.
    languages: [java, kotlin]
    severity: WARNING
    metadata:
      cwe: CWE-89
      owasp: "A03:2021"
      category: security
      confidence: MEDIUM
