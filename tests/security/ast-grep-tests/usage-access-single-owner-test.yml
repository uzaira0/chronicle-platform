id: usage-access-single-owner
valid:
- "fun f() {\n  val events = UsageAccess.queryEvents(context, start, end)\n}\n"
- "fun f() {\n  val stats = UsageAccess.queryUsageStats(context, interval, start, end)\n}\n"
invalid:
- "fun f() {\n  val mode = appOps.checkOpNoThrow(op, uid, packageName)\n}\n"
- "fun f() {\n  val events = usageStats.queryEvents(start, end)\n}\n"
- "fun f() {\n  val stats = usageStats.queryUsageStats(interval, start, end)\n}\n"
