id: selfhost-http-ignores-proxy-environment
valid:
- "opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), urllib.request.HTTPSHandler(context=context))\n"
- "opener = build_opener(ProxyHandler({}), HTTPSHandler(context=context))\nopener.open(request, timeout=10)\n"
- "opener = request.build_opener(request.HTTPSHandler(context=context), request.ProxyHandler({}),)\n"
- "subprocess.run(['curl', '--noproxy', '*', url], check=True)\n"
invalid:
- "from urllib.request import urlopen as fetch\nfetch(request)\n"
- "from urllib.request import build_opener as opener\nopener()\n"
- "subprocess.run(['curl', url], check=True)\n"
- "subprocess.check_output(['curl', '--max-time', '10', url])\n"
- "run(['curl', url], check=True)\n"
- "subprocess.run(['curl', '--noproxy', 'localhost', url], check=True)\n"
- "urllib.request.urlopen(request, timeout=10, context=context)\n"
- "from urllib.request import urlopen\nurlopen(request)\n"
- "opener = urllib.request.build_opener(urllib.request.HTTPSHandler(context=context))\n"
- "opener = build_opener(ProxyHandler({'https': proxy}))\n"
- "opener = build_opener()\n"
- "opener = request.build_opener(HTTPSHandler(context=context),)\n"
- "urlopen(request, context=context,)\n"
- "request.urlopen(request)\n"
- "opener = build_opener(ProxyHandler())\n"
- "opener = build_opener(Wrapped(ProxyHandler({})))\n"
- "opener = build_opener(HTTPSHandler(context=make_context(ProxyHandler({}))))\n"
