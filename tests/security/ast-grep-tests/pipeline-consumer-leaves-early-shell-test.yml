id: pipeline-consumer-leaves-early-shell
valid:
- "host_has_addr() {\n  host_addrs | grep -x \"$1\" >/dev/null\n}\n"
- "if docker inspect \"$container\" --format '{{.State.Running}}' 2>/dev/null | grep true >/dev/null; then :; fi\n"
- "holder=$(host_listening | grep -E \"$pattern\" | sed -n 1p)\n"
- "unreadable=$(find . -print | sort | sed -n 1,5p | tr '\\n' ' ')\n"
- "serial=$(adb devices | awk 'NR > 1 && $2 == \"device\" && !found {print $1; found = 1}')\n"
- "kubectl get pods | awk '$3 != \"Running\" { bad = 1 } END { exit bad }'\n"
- "find src -name '*.kt' | while read -r file; do wc -l \"$file\"; done\n"
- "printf '%s\\n' \"$secret\" | { IFS= read -r first; cat >/dev/null; printf '%s\\n' \"$first\"; }\n"
- "docker logs -f \"$container\" 2>&1 | grep -m1 ready || [[ \"${PIPESTATUS[*]}\" == \"141 0\" ]]\n"
- "grep -q pattern file && head -1 file\n"
- "echo \"$value\" | sed 's/x/q/'\n"
invalid:
- "host_has_addr() {\n  host_addrs | grep -qx \"$1\"\n}\n"
- "if docker inspect \"$container\" --format '{{.State.Running}}' 2>/dev/null | grep -q true; then :; fi\n"
- "printf '%s\\n' \"$headers\" | grep -Eiq \"$pattern\"\n"
- "find \"$dir\" -name '*.partial' -print -quit | /usr/bin/grep -q .\n"
- "printf '%s\\n' \"$value\" | LC_ALL=C grep -q '[[:cntrl:]]'\n"
- "rg -i \"$terms\" \"$file\" | rg -qv \"$allowed\"\n"
- "docker logs \"$container\" 2>&1 | grep -m1 ready\n"
- "holder=$(host_listening | grep -E \"$pattern\" | head -1)\n"
- "echo \"$shares\" | head -n \"$threshold\" | ssss-combine -t \"$threshold\"\n"
- "first=$(sort \"$file\" | sed 1q)\n"
- "first=$(sort \"$file\" | sed -n '/x/{p;q}')\n"
- "serial=$(adb devices | awk 'NR > 1 && $2 == \"device\" {print $1; exit}')\n"
- "sort \"$file\" | read -r first\n"
- "sort \"$file\" | { read -r first; printf '%s\\n' \"$first\"; }\n"
- "sort \"$file\" | while read -r line; do [[ $line == stop ]] && break; done\n"
