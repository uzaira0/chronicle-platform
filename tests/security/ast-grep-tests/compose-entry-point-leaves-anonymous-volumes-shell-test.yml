id: compose-entry-point-leaves-anonymous-volumes-shell
valid:
- "dc() {\n  local anonymous\n  anonymous=\"$(python3 -c 'import sys; from chronicle_ops.common import before_compose; print(*before_compose(sys.argv[1], sys.argv[2:]))' \"$PROJECT\" \"$@\")\"\n  if [[ -z \"$anonymous\" ]]; then\n    docker compose -p \"$PROJECT\" \"$@\"\n    return\n  fi\n  (\n    trap : HUP INT TERM\n    status=0\n    docker compose -p \"$PROJECT\" \"$@\" || status=$?\n    trap - HUP INT TERM\n    after=0\n    python3 -c 'import sys; from chronicle_ops.common import after_compose_status; sys.exit(after_compose_status(sys.argv[1], sys.argv[2:]))' \"$PROJECT\" $anonymous || after=$?\n    if (( after > 128 )); then exit \"$after\"; fi\n    exit \"$status\"\n  )\n}\n"
- "compose_cmd() {\n  local listed project anonymous\n  local -a compose_options=(--env-file \"$ENV_FILE\" -f \"$COMPOSE_FILE\")\n  listed=\"$(python3 -c 'import sys; from chronicle_ops.common import project_volumes_before; count = int(sys.argv[1]); print(*project_volumes_before(sys.argv[2:2 + count], sys.argv[2 + count:]))' \"${#compose_options[@]}\" \"${compose_options[@]}\" \"$@\")\" || listed=\"\"\n  if [[ -z \"$listed\" ]]; then\n    docker compose \"${compose_options[@]}\" \"$@\"\n    return\n  fi\n  project=\"${listed%% *}\"\n  anonymous=\"${listed#* }\"\n  (\n    trap : HUP INT TERM\n    status=0\n    docker compose \"${compose_options[@]}\" \"$@\" || status=$?\n    trap - HUP INT TERM\n    after=0\n    python3 -c 'import sys; from chronicle_ops.common import after_compose_status; sys.exit(after_compose_status(sys.argv[1], sys.argv[2:]))' \"$project\" $anonymous || after=$?\n    if (( after > 128 )); then exit \"$after\"; fi\n    exit \"$status\"\n  )\n}\n"
- "service_roles() {\n  python3 -m chronicle_ops \"$@\"\n}\n"
- "show() {\n  docker compose -p \"$PROJECT\" ps --format json\n}\n"
invalid:
- "dc() {\n  python3 -c 'import sys; from chronicle_ops.common import before_compose; before_compose(sys.argv[1], sys.argv[2:])' \"$PROJECT\" \"$@\"\n  docker compose -p \"$PROJECT\" \"$@\"\n}\n"
- "compose_cmd() {\n  local env_file\n  env_file=\"$(env_file_path)\"\n\n  docker compose \\\n    --env-file \"${env_file}\" \\\n    -f \"${COMPOSE_BASE}\" \\\n    -f \"${COMPOSE_PROD}\" \\\n    \"$@\"\n}\n"
- "dc() {\n  local anonymous\n  anonymous=\"$(python3 -c 'import sys; from chronicle_ops.common import before_compose; print(*before_compose(sys.argv[1], sys.argv[2:]))' \"$PROJECT\" \"$@\")\"\n  if [[ -z \"$anonymous\" ]]; then\n    docker compose -p \"$PROJECT\" \"$@\"\n    return\n  fi\n  (\n    trap : HUP INT TERM\n    status=0\n    docker compose -p \"$PROJECT\" \"$@\" || status=$?\n    trap '' HUP INT TERM\n    python3 -c 'import sys; from chronicle_ops.common import after_compose_status; sys.exit(after_compose_status(sys.argv[1], sys.argv[2:]))' \"$PROJECT\" $anonymous\n    exit \"$status\"\n  )\n}\n"
- "dc() {\n  local anonymous\n  anonymous=\"$(python3 -c 'import sys; from chronicle_ops.common import before_compose; print(*before_compose(sys.argv[1], sys.argv[2:]))' \"$PROJECT\" \"$@\")\"\n  if [[ -z \"$anonymous\" ]]; then\n    docker compose -p \"$PROJECT\" \"$@\"\n    return\n  fi\n  (\n    trap : HUP INT TERM\n    status=0\n    docker compose -p \"$PROJECT\" \"$@\" || status=$?\n    trap - HUP INT TERM\n    python3 -c 'import sys; from chronicle_ops.common import after_compose; after_compose(sys.argv[1], sys.argv[2:])' \"$PROJECT\" $anonymous\n    exit \"$status\"\n  )\n}\n"
