# Chronicle data collection modularization guardrails.
#
# The Semgrep half of the static collection guardrails that applies to the Android
# `collection/` package: privacy invariant, no sensitive default,
# no Firebase / dangerous permission. The diagnostics/settings DTO rule is
# in the sibling file collection-dto.yaml because it scans a different directory
# (chronicle-models).
#
# SCOPING: this file lives OUTSIDE tests/security/rules/ on purpose — the `sast`
# layer auto-loads everything in rules/ and scans backend/web code, where the
# Firebase rule would false-positive on legacy server code. The `collection` layer
# of tests/security/run-all-security.sh invokes this file with the explicit target
# `chronicle/app/src/main/java/com/openlattice/chronicle/collection`, so the rules
# carry no directory `paths.include` block.
#
# These rules guard against NEW violations; legacy app code (services/, receivers/)
# is outside the scanned scope. Positive fixtures: tests/security/fixtures/collection/.
rules:
  # --- Every DataCollectionModule impl asserts the id/privacyClass invariant.
  # The abstract `val id` / `val privacyClass` overrides are compiler-enforced; what the
  # compiler does NOT enforce is the invariant that a module asserts
  # `require(privacyClass == id.privacyClass)` in its `init` block. This rule flags a
  # module impl missing that guard.
  #
  # EXCEPTION: DisabledCollectionModule is excluded by `pattern-not` below. It is the
  # universal no-op wrapper — it takes `id` as a constructor arg and derives
  # `privacyClass = id.privacyClass` directly, so the invariant holds by construction
  # and it intentionally carries no `init` block.
  - id: chronicle-collection-module-must-assert-privacy-invariant
    languages: [kotlin]
    severity: ERROR
    message: >
      A DataCollectionModule implementation must assert its identity invariant in an
      `init` block: `require(privacyClass == id.privacyClass) { ... }`. The compiler enforces the `id`/`privacyClass` overrides but not
      that they agree. Add the init-block require().
    patterns:
      - pattern: |
          class $MODULE(...) : $SUP {
            ...
          }
      - metavariable-regex:
          metavariable: $SUP
          regex: "DataCollectionModule"
      - pattern-not: |
          class $MODULE(...) : $SUP {
            ...
            init {
              ...
              require(privacyClass == $ID.privacyClass) { ... }
              ...
            }
            ...
          }
      # DisabledCollectionModule derives privacyClass = id.privacyClass by construction.
      - pattern-not: |
          class $MODULE(...) : $SUP {
            ...
            final override val privacyClass = $ID.privacyClass
            ...
          }
      - pattern-not: |
          class $MODULE(...) : $SUP {
            ...
            final override val privacyClass get() = $ID.privacyClass
            ...
          }
      - pattern-not: |
          class $MODULE(...) : $SUP {
            ...
            override val privacyClass: CollectionPrivacyClass = $ID.privacyClass
            ...
          }
      - pattern-not: |
          class $MODULE(...) : $SUP {
            ...
            override val privacyClass = $ID.privacyClass
            ...
          }
    metadata:
      cwe: CWE-1059
      category: security
      confidence: HIGH

  # --- Resolver defaults never implicitly enable a privacy-sensitive module.
  # PHYSICAL_TELEMETRY and LOCAL_PARTICIPANT_LABEL
  # (per-sensor modules / USER_IDENTIFICATION) are never enabled implicitly. A
  # `CollectionDefaults.moduleSetting(..., enabled = true)` or `CollectionModuleSetting(
  # enabled = true, ...)` literal in default/safe-default code is a violation — only an
  # explicit server setting or user preference may flip them, never a coded default.
  - id: chronicle-collection-no-sensitive-default-enabled
    languages: [kotlin]
    severity: ERROR
    message: >
      A coded default must not enable a privacy-sensitive module. Resolver/defaults
      code must derive `enabled` from the privacy class (false for PHYSICAL_TELEMETRY
      / LOCAL_PARTICIPANT_LABEL) — only an explicit server setting / preference flips
      it.
    patterns:
      - pattern-either:
          - pattern: CollectionDefaults.moduleSetting($ANY, enabled = true)
          - pattern: CollectionDefaults.moduleSetting($ANY, true)
          - pattern: CollectionModuleSetting(enabled = true, ...)
    metadata:
      cwe: CWE-1188
      category: security
      confidence: MEDIUM

  # --- Collection modules add no Firebase events.
  # Firebase is archived/disconnected for this deployment.
  # A collection-module file must not call FirebaseAnalytics / logEvent / recordException.
  - id: chronicle-collection-no-new-firebase-events
    languages: [kotlin]
    severity: ERROR
    message: >
      Collection modules must not introduce Firebase analytics / Crashlytics calls.
      Firebase is archived/disconnected.
      Use the local CollectionLog / module diagnostics instead.
    patterns:
      - pattern-either:
          - pattern: $ANALYTICS.logEvent($EVENT, $ARGS)
          - pattern: FirebaseAnalytics.getInstance($CTX)
          - pattern: $X.recordException($E)
    metadata:
      cwe: CWE-359
      category: security
      confidence: HIGH

  # --- Collection modules add no dangerous permission references:
  # no location, microphone, contacts, SMS, call-log or camera source. The `collection`
  # layer scans only the `collection/` package.
  - id: chronicle-collection-no-dangerous-permission-request
    languages: [generic]
    severity: ERROR
    message: >
      Collection modules must not reference location, microphone, contacts, SMS,
      call-log or camera permissions.
    patterns:
      - pattern-regex: '(ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|RECORD_AUDIO|READ_CONTACTS|READ_SMS|RECEIVE_SMS|READ_CALL_LOG|android\.permission\.CAMERA)'
    paths:
      include:
        - "*.kt"
    metadata:
      cwe: CWE-250
      category: security
      confidence: HIGH

  # --- Settings resolution funnels through the coordinator.
  # CollectionSettingsResolver is constructed in exactly one place —
  # CollectionLoopCoordinator.resolveCollectableSettings() — which (a) applies the per-device
  # HARDWARE GATE (drops sensor modules whose hardware is absent: the "Samsung sensor on a
  # Pixel" bug) and (b) lets the resolver enforce PER-SENSOR AUTHORITY (a sensor a per-sensor
  # study omits stays off, never re-enabled by the legacy AndroidSensor bridge: the "sensor
  # removal silently no-ops on enrolled devices" bug). A resolver constructed anywhere else
  # bypasses both. This is the Semgrep mirror of the ast-grep
  # collection-settings-resolver-only-via-coordinator rule (defence-in-depth across engines).
  # The coordinator's sanctioned construction is excluded via pattern-not-inside its helper.
  - id: chronicle-collection-resolver-construction-only-in-coordinator
    languages: [kotlin]
    severity: ERROR
    message: >
      CollectionSettingsResolver may only be constructed in CollectionLoopCoordinator
      (resolveCollectableSettings) — the single point applying the per-device hardware gate
      and per-sensor authority. A resolver built elsewhere bypasses the hardware gate
      (device-absent sensors) and the legacy-bridge suppression. Resolve via the coordinator.
    patterns:
      - pattern: CollectionSettingsResolver(...)
      - pattern-not-inside: |
          fun resolveCollectableSettings(...) {
            ...
          }
    metadata:
      cwe: CWE-1188
      category: security
      confidence: HIGH
