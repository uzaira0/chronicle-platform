id: notification-listener-access-single-owner
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: Use hasNotificationListenerAccess to check the actual listener component grant.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/src/research/**/collection/DistributionSpecialAccess.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  any:
    - pattern: $X.isNotificationListenerAccessGranted($$$ARGS)
    - pattern: NotificationManagerCompat.getEnabledListenerPackages($$$ARGS)
