id: no-rls-context-manager-call
language: Kotlin
note: |
  Blind spots: Only one-argument setCurrentUserContext calls match; aliases and context mutation behind helpers are not resolved.
severity: error
message: >
  Do not call setCurrentUserContext directly from request or service code.
  RLS context must be published by RLSContextFilter and applied by the
  request-scoped datasource wrapper on the actual query connection.
rule:
  pattern: $MANAGER.setCurrentUserContext($CONNECTION)
