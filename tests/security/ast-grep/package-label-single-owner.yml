id: package-label-single-owner
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: Use PackageLabels for package metadata; visibility filtering must fall back to the package name.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/utils/PackageLabels.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  any:
    - pattern: $X.getApplicationInfo($$$ARGS)
    - pattern: $X.getApplicationLabel($$$ARGS)
