id: health-connect-client-single-owner
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: Create Health Connect clients through the availability guard in HealthConnectPermissions.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/collection/device/HealthConnectPermissions.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  any:
    - pattern: HealthConnectClient.getSdkStatus($$$ARGS)
    - pattern: HealthConnectClient.getOrCreate($$$ARGS)
