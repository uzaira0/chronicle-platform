# HardwareSensorService.startService/stopService only via the collection module manager
# (HardwareSensorsCollectionModule).
#
# Direct foreground-service starts are forbidden outside the module
# manager. HardwareSensorsCollectionModule.start()/stop() is the single sanctioned
# caller; every other callsite is legacy and must be exception-listed until it is
# routed through the manager.
#
# LEGACY EXCEPTIONS (migration switch OFF, these still run):
#   - PowerSaveModeReceiver.kt      : legacy power-save start/stop.
#   - StartOnBoot.kt                : legacy boot-time start.
#   - SensorSettingsRefreshWorker.kt: legacy settings-driven start/stop (gated by
#                                     SensorSettingsMigration).
#   - Enrollment.kt                 : legacy enrollment-time start.
#   - MainActivity.kt               : legacy UI-driven start.
# Sanctioned caller (the boundary itself): the
# :collection-sensors module talks to the HardwareSensorServiceController interface;
# HardwareSensorServiceControllerImpl.kt is the :app-side adapter that owns the real
# HardwareSensorService start/stop, so it is the sanctioned boundary and is exempt.
#
# Sanctioned lifecycle owner: the grouped
# HardwareSensorsCollectionModule is retired; CollectionLoopCoordinator.updateSensorService()
# is THE place that starts/stops the one shared sensor foreground service, driven by the
# freshly-reconciled per-sensor gate state (anySensorCollects). It is the sensor
# service-lifecycle owner and is therefore exempt — the rule still catches any OTHER (e.g. a
# new worker/receiver) direct start/stop that bypasses the coordinator.
id: collection-hardware-service-only-via-manager
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: >
  HardwareSensorService.startService/stopService must be called only through
  HardwareSensorsCollectionModule. A new direct
  service start/stop bypasses module lifecycle ownership.
ignores:
  - "**/collection/sensors/HardwareSensorsCollectionModule.kt"
  - "**/services/sensors/HardwareSensorServiceControllerImpl.kt"
  # Distribution split: restricted service calls now cross this app-side adapter.
  - "**/src/googleServices/java/com/openlattice/chronicle/collection/DistributionRestrictedRuntime.kt"
  # Per-sensor redesign sensor service-lifecycle owner (replaces the retired grouped module).
  - "**/collection/state/CollectionLoopCoordinator.kt"
  - "**/receivers/lifecycle/PowerSaveModeReceiver.kt"
  - "**/receivers/lifecycle/StartOnBoot.kt"
  - "**/services/sensors/SensorSettingsRefreshWorker.kt"
  - "**/Enrollment.kt"
  - "**/MainActivity.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  any:
    - pattern: HardwareSensorService.startService($$$ARGS)
    - pattern: HardwareSensorService.stopService($$$ARGS)
