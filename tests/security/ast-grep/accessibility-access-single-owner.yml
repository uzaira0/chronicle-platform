id: accessibility-access-single-owner
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: Check Chronicle accessibility access through InteractionAccessibilityOnboarding.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/collection/interaction/InteractionAccessibilityOnboarding.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  any:
    - pattern: $X.getEnabledAccessibilityServiceList($$$ARGS)
