id: usage-access-single-owner
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: Use UsageAccess so a denied or locked poll cannot advance a usage cursor.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/utils/UsageAccess.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  all:
    - any:
        - pattern: $X.checkOpNoThrow($$$ARGS)
        - pattern: $X.queryEvents($$$ARGS)
        - pattern: $X.queryUsageStats($$$ARGS)
    - not:
        any:
          - pattern: UsageAccess.queryEvents($$$ARGS)
          - pattern: UsageAccess.queryUsageStats($$$ARGS)
