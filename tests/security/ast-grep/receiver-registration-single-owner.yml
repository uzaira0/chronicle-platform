id: receiver-registration-single-owner
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: Use registerSystemBroadcastReceiver for system broadcasts or registerPrivateReceiver for app actions.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/utils/BroadcastReceivers.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  any:
    - pattern: $X.registerReceiver($$$ARGS)
    - pattern: registerReceiver($$$ARGS)
