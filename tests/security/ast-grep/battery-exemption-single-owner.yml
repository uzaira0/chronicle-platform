id: battery-exemption-single-owner
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: Direct battery exemption requests belong to the distribution and permission guarded dialog.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/BatteryOptimizationExemptionDialog.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  any:
    - pattern: Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS
