id: trusted-proxy-cidr-single-owner
language: Kotlin
note: |
  Blind spots: Only literal IP/CIDR strings under named trusted-proxy declarations or deployment calls match; computed values and alternate names are not resolved.
severity: error
message: >
  Trusted proxy ranges come from CHRONICLE_TRUSTED_PROXY_CIDRS, else ClientIpResolver.LOOPBACK_PROXY_CIDRS.
  A literal address here becomes a second, silent fallback that believes X-Forwarded-For from that range
  when the deployment sets nothing. Reference ClientIpResolver.LOOPBACK_PROXY_CIDRS.
files:
  - "**/chronicle-server/src/main/**/*.kt"
ignores:
  - "**/chronicle-server/src/main/kotlin/com/openlattice/chronicle/util/ClientIpResolver.kt"
rule:
  all:
    - kind: string_literal
    - regex: '^"([0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?|[0-9a-fA-F]*:[0-9a-fA-F:.]*(/[0-9]{1,3})?)"$'
    - any:
        - inside:
            kind: call_expression
            regex: 'deploymentTrustedProxyCidrs\s*\('
            stopBy: end
        - inside:
            kind: class_parameter
            regex: '(?i)trusted.?prox'
            stopBy: end
        - inside:
            kind: property_declaration
            regex: '(?i)trusted.?prox'
            stopBy: end
        - inside:
            kind: function_value_parameters
            regex: '(?i)trusted.?prox'
            stopBy: end
