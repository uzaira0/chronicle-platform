id: network-usage-single-owner
language: Kotlin
note: |
  Blind spots: Only the listed API spellings and configured paths match; type aliases, reflection and calls hidden behind wrappers are not resolved.
severity: error
message: NetworkStats reads belong to AppNetworkUsageSource and its current Usage Access check.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/collection/device/AppNetworkUsageSource.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  pattern: $X.querySummary($$$ARGS)
