schemaVersion: "2.0.0"
fileExistenceTests:
  - name: dashboard bundle
    path: /dist/index.html
    shouldExist: true
  - name: release identity
    path: /dist/version.json
    shouldExist: true
  - name: source attribution
    path: /usr/share/doc/chronicle/SOURCE-CODE
    shouldExist: true
fileContentTests:
  - name: publisher replaces assets and retries a failed copy
    path: /dist/version.json
    expectedContents: [version, buildTime]
commandTests:
  - name: no public source maps
    command: sh
    args: [-ec, 'test -z "$(find /dist -name *.map)"']
    exitCode: 0
  - name: the bundle copies whole (Dockerfile.caddy copies /dist), read as the image's non-root user
    command: sh
    args: [-ec, 'test "$(id -u)" = 65534; mkdir /tmp/out; cp -a /dist/. /tmp/out/; cmp /dist/version.json /tmp/out/version.json; test -s /tmp/out/index.html']
    exitCode: 0
