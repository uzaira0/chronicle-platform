schemaVersion: "2.0.0"
fileExistenceTests:
  - name: PostgreSQL 18 server
    path: /usr/pgsql-18/bin/postgres
    shouldExist: true
  # The one file of qt5-srpm-macros (CVE-2026-16762, CVE-2026-103653): the package is removed, not waived.
  # rpm cannot run in the finished image (its sqlite-libs are removed), so the file stands for the package.
  - name: Qt 5 RPM build macros are absent
    path: /usr/lib/rpm/macros.d/macros.qt5-srpm
    shouldExist: false
commandTests:
  - name: PostgreSQL 18 server version
    command: /usr/pgsql-18/bin/postgres
    args: [--version]
    expectedOutput: ['PostgreSQL\) 18\.']
    exitCode: 0
