# Container structure tests for chronicle-server (Dockerfile.backend)
# Run: container-structure-test test --image chronicle-backend --config tests/container/backend.yaml

schemaVersion: "2.0.0"

metadataTest:
  exposedPorts: ["40320"]
  cmd: ["./bin/chronicle-server", "local", "postgres", "medialocal"]
  workdir: "/server"
  labels:
    - key: "org.opencontainers.image.source"
      value: "https://github.com/uzaira0/methodic"
    - key: "org.opencontainers.image.vendor"
      value: "Chronicle Project"
  envVars:
    - key: "CHRONICLE_SERVER_XMS"
      value: "-Xms512m"
    - key: "CHRONICLE_SERVER_XMX"
      value: "-Xmx2g"
    - key: "CHRONICLE_SERVER_ARGS"
      value: "local postgres medialocal"
    - key: "JAVA_HOME"
      value: "/opt/java/openjdk"

fileExistenceTests:
  - name: "chronicle-server launch script exists"
    path: "/server/bin/chronicle-server"
    shouldExist: true
    permissions: "-rwxr-xr-x"
    isExecutableBy: "owner"

  - name: "server lib directory exists"
    path: "/server/lib"
    shouldExist: true

  - name: "config directory exists"
    path: "/server/config"
    shouldExist: true
    uid: 100    # chronicle user
    gid: 101    # chronicle group

  - name: "custom JRE java binary exists"
    path: "/opt/java/openjdk/bin/java"
    shouldExist: true
    isExecutableBy: "owner"

  - name: "log directory exists"
    path: "/var/log/chronicle"
    shouldExist: true
    uid: 100    # chronicle user
    gid: 101    # chronicle group

  - name: "no test JARs in lib"
    path: "/server/lib/test-fixtures.jar"
    shouldExist: false

fileContentTests:
  - name: "server GPL license is shipped"
    path: "/usr/share/doc/chronicle/chronicle-server-LICENSE"
    expectedContents: ["GNU GENERAL PUBLIC LICENSE"]

  - name: "corresponding source is referenced"
    path: "/usr/share/doc/chronicle/SOURCE-CODE"
    expectedContents: ["https://github.com/uzaira0/methodic/tree/"]

  - name: "launch script references chronicle-server main class"
    path: "/server/bin/chronicle-server"
    expectedContents: ["chronicle"]

  - name: "JRE distrusts the compromised eMudhra intermediates (CVE-2026-91403)"
    path: "/opt/java/openjdk/lib/security/blocked.certs"
    expectedContents:
      - "42C4ACCD12C4F59597925E1A08A7A90102608543809308D50EC427E118BA1493"
      - "45A883F349AEDFD5F3A649B5498FFB121712BA8B448F3F2A91DBC5A766FCDDBE"
      - "98B896625C0C230ADEEC3EB2CF6AAD5001ECF9156A68644E82374CE5833BC25B"
      - "5F1DED4DD590AF74631290CF073B122A2AAC6A1FA479778A0BD43579BD832699"
      - "E7568FE6E12331F4FD7DE61DA4C7559D0F8EB192A218D4741A3BA75184333838"
      - "579480AEA166290BD3C643589E795FC0D0E54E86505D180F1DFF99EFD3199512"
      - "0164D7CEAE5BB909C272AF151FF44B1177AE9B47D9424B94F1D9558C30934D19"
      - "62B7F9868263F72F6911FC78CEAF72C1979158B7368BF648683BB2AA39B02E72"
      - "CB6E15165AC802E9B3F993F16C25D41F4E81C21EBDE71AE1B012AC00BF9C7C3F"
      - "7485B51C0ED192878FA1D2F948FB529AE1842CC5086C4B67F7BE5B2039DE9489"
      - "432EC25F0D28DE9006D97BF752F17BBB2CD41F669933FCB072D9A1148D0261F3"
      - "FD9D5C2DBBD4995AB69B8D50C439D9527B00529199C2FD01B2174EB58F07021F"
