schemaVersion: "2.0.0"
metadataTest:
  cmd: [/init.sh]
  workdir: /
fileExistenceTests:
  - name: backup scheduler entrypoint
    path: /init.sh
    shouldExist: true
    isExecutableBy: owner
  - name: recovery validator
    path: /chronicle_ops/dump.py
    shouldExist: true
  - name: TDE backup guard
    path: /init-tde.sh
    shouldExist: true
commandTests:
  - name: PostgreSQL 18 dump tool
    command: pg_dump
    args: [--version]
    expectedOutput: ['18\.']
    exitCode: 0
  - name: health and dump validation imports
    command: python3
    args: [-c, 'import chronicle_ops.dump; import selfcheck; assert selfcheck.main(["health"]) == 1']
    exitCode: 0
  - name: scheduler and lock tools
    command: bash
    args: [-ec, 'command -v go-cron; command -v flock; run-parts --version']
    exitCode: 0
  - name: compromised eMudhra intermediates are distrusted (CVE-2026-114406)
    command: bash
    args: [-ec, 'trust list --filter=blocklist | grep -c "label: EM "']
    expectedOutput: ['^16\n?$']
    exitCode: 0
  # rpm cannot run here (its sqlite-libs are removed), so check files each package owned in the pinned base:
  # ls prints any that still exist on stdout, which must stay empty.
  - name: unused BIND, kernel-header and compiler packages are absent
    command: ls
    args: [-d, /usr/bin/dig, /usr/bin/nslookup, /usr/bin/host, /usr/lib64/libdns-9.16.23-RH.so,
           /usr/lib64/libisc-9.16.23-RH.so, /usr/include/linux, /usr/share/emacs, /usr/bin/gcc, /usr/bin/cc]
    excludedOutput: ['.']
    expectedError: ['/usr/bin/dig', '/usr/lib64/libdns-9.16.23-RH.so', '/usr/include/linux', '/usr/bin/gcc']
    exitCode: 2
