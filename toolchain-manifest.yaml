# Chronicle toolchain manifest — the single source of truth for version pins.
#
# scripts/verify-toolchain.sh enforces this file against the repo (wrappers,
# workflows, Dockerfiles, package pins — root AND submodules). Change a version
# HERE first, then update the pinned artifacts; the checker fails CI/local-ci on
# any drift. docker/ and k8s/ are frozen and outside this
# check until they are ported as selfhost overlays; their pins may lag this file.
# Rationale for each choice: the "Deliberately not upgraded" section
# and docs/db/MIGRATION-LEDGER-AUDIT.md (migrations).
#
# JDK model (two dials):
#   - build/runtime JDK: 25 (prod container already runs Temurin 25)
#   - bytecode target: 21 (analyzer/Mockito ecosystem; no Gradle toolchains —
#     they break the --add-exports flags Hazelcast needs)
#   - Android: JDK 21 launcher / bytecode 17 (AGP certification boundary)

jdk:
  build_runtime: "25"
  bytecode_target: "21"
  android_launcher: "21"
  android_bytecode: "17"

gradle:
  wrapper: "9.7.1"          # root, chronicle-server, chronicle-api, rhizome, rhizome-client
  android_wrapper: "9.3.0"  # chronicle/ (AGP pairing; do not unify)

kotlin: "2.4.10"

bun: "1.3.12"               # sole JS runtime — Node is not a dependency of this repo

python: "3.12"              # floor for scripts/ tests/ selfhost/ helpers; python3 on PATH must be >= this, with requirements-dev.txt installed
                            # (RHEL 9 ships 3.9 as /usr/bin/python3: `uv python install 3.14 --default`; then `uv pip install --system --break-system-packages --python "$(command -v python3)" --require-hashes -r requirements-dev.txt`)
                            # requirements-dev.txt pins PyYAML and openpyxl with hashes; scripts/check-python-dev-pins.py fails on any other installed version

postgres:
  image: "percona/percona-distribution-postgresql:18.6.1-4"  # pg_tde pins prod; same image in dev/CI/testcontainers
  index_digest: "sha256:27a1dba816fcc4cec88f216d54e3ec86db4c1d4b16799f49800055c41606e11e"
  # Percona, not stock Postgres, because pg_tde is a Percona extension and it IS the
  # encryption-at-rest model (init-db-encryption.sh, migrate-tde.sh, selfhost/init-tde.sh,
  # rotate-tde-principal-key.sh). Percona tracks upstream:
  # 18.6.1-4 carries PostgreSQL 18.6, the current stable release — 19 is still beta.
  #
  # 17.5-3 -> 18.4-5 is a MAJOR jump. Two consequences that are not image-swap-shaped:
  #   - The data directory is not forward-compatible. An existing cluster needs a
  #     dump/restore; see selfhost/docs/POSTGRES-18-UPGRADE.md.
  #   - pg_tde goes 1.0 -> 2.2. Nothing we call was removed (the 1.0->2.0 step only ADDS
  #     vault_v2 provider functions), but a cluster restored from a 17 dump carries
  #     extension version 1.0 and needs ALTER EXTENSION pg_tde UPDATE. The TDE scripts
  #     do that themselves.

keycloak_postgres:
  image: "postgres:18.6-alpine"  # SSO tier only — stock Postgres, no pg_tde, no participant data
  index_digest: "sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"

selfhost_images:
  backup: "ghcr.io/uzaira0/chronicle-selfhost-backup:2026.10.5@sha256:1bdf966c4c3327d99c3ae13d2cf46f3ffa1834b5dc63b745c1a0949de8ab95c3"
  # GET-only Docker API for cadvisor (monitoring overlay). Not in the stale-image sweep:
  # the dogfood compose still references it by tag.
  docker_socket_proxy: "tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459"
  cadvisor: "ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a"
  victoria_metrics: "victoriametrics/victoria-metrics:v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd"
  victoria_logs: "victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d"
  fluent_bit: "fluent/fluent-bit:5.1.3@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845"
  grafana: "grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
  keycloak: "quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc"

semgrep: "1.182.0"

flyway:
  version: "11.20.3"        # gradles/chronicle.gradle ext.flyway_version + scripts/flyway-migrate.sh image

# scripts/deps-freshness.sh compares every pin above with upstream and FAILS on a
# major-version lag unless the component is listed here. Minor/patch lag is reported.
freshness:
  accepted_behind:
    - flyway             # 12/13 changed licensing terms; review before moving
  # A direct chronicle-web dependency whose newest registry release is older than this is treated
  # as unmaintained and fails deps-freshness (scripts/web_dependency_age.py), unless it is listed in
  # web_stale_accepted as {name, reason, expires: YYYY-MM-DD}. Expired or stale entries also fail.
  web_max_release_age_days: 1095
  web_stale_accepted: []

# Gate tools scripts/local-ci.sh downloads into .local/bin. The sha256 committed here for each
# release asset (keyed by os-arch as machine_os/machine_arch print it, or "any" when one file serves
# every platform) is the trust root: local-ci refuses a download whose bytes differ, and refuses a
# release checksums file that disagrees, so a replaced asset plus a replaced checksums file cannot
# pass. The version must equal the one local-ci.sh downloads. Each value was checked against both
# the release's own checksums file and GitHub's recorded asset digest (detekt-cli
# predates GitHub asset digests; its value is the one local-ci.sh committed earlier).
