/**
 * Shared build conventions for the repo build scripts (chronicle-models,
 * chronicle-api, chronicle-server, rhizome, rhizome-client). It is applied here behind plugins.withId guards so
 * repos that do not use a given plugin are untouched. Repo-specific divergences
 * (allWarningsAsErrors, explicitApi, spotbugs report/failure handling, the
 * server-only odata/chronicle_api_version overrides) stay in the repos.
 *
 * These blocks sit AFTER the ext version declarations above because
 * plugins.withId fires immediately for already-applied plugins and the closures
 * interpolate ext versions eagerly.
 */

// JVM target. Source/target compatibility is used instead of toolchains
// deliberately: toolchains force the --release flag, which blocks the
// --add-exports of internal JDK APIs these projects rely on (see the
// JavaCompile/Test module-args lists below).
plugins.withId('java') {
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

plugins.withId('org.jetbrains.kotlin.jvm') { kotlinPlugin ->
    // Applied scripts cannot reference plugins-DSL classes as literals (they are
    // not on the script classloader), so resolve KotlinCompile through the
    // Kotlin plugin's own classloader.
    def kotlinCompileClass = Class.forName(
            'org.jetbrains.kotlin.gradle.tasks.KotlinCompile',
            false,
            kotlinPlugin.class.classLoader
    )
    tasks.withType(kotlinCompileClass).configureEach {
        kotlinOptions {
            jvmTarget = "21"
            freeCompilerArgs += '-jvm-default=no-compatibility'
            // Hibernate Validator reads element constraints such as List<@Size String> from JVM
            // type annotations, which Kotlin emits only with this flag.
            freeCompilerArgs += '-Xemit-jvm-type-annotations'
        }
    }
}

plugins.withId('checkstyle') {
    checkstyle {
        toolVersion = "${checkstyle_version}"
        showViolations = false
        // Always the repo-local copy (gradles/checkstyle.xml). chronicle-api used
        // to fetch the byte-identical file from raw.githubusercontent.com on every
        // build; local-only keeps the build reproducible and offline-safe.
        config project.resources.text.fromFile(new File(buildscript.sourceFile.parentFile, 'checkstyle.xml'))
    }
    // Checkstyle 10.26.1 pulls guava 33.4.8-jre; no Checkstyle release carries 33.7.2 yet
    // (14.3.0 has 33.7.1).
    configurations.named('checkstyle') {
        resolutionStrategy.eachDependency(guavaPinResolveRule)
    }
    tasks.withType(Checkstyle) {
        reports {
            xml.required = false
            html.required = true
        }
    }
}

plugins.withId('jacoco') {
    jacoco {
        toolVersion = "${jacoco_tool_version}"
    }
    // scripts/diff-coverage.py reads the XML; Gradle writes only HTML by default.
    jacocoTestReport { reports { xml.required = true } }
}

plugins.withId('com.github.spotbugs') {
    spotbugs {
        reportLevel = 'high'
        toolVersion = "${spotbugs_annotations_version}"
    }
}

// JDK internal-API module args shared by chronicle-server and rhizome
// (JavaCompile) and their test JVMs. Kept as ext lists rather than applied
// globally so repos that never needed them (models, api, rhizome-client) keep
// unchanged compiler/test invocations.
ext.chronicle_jvm_compile_module_args = [
        "--add-modules", "java.base",
        "--add-modules", "java.se",
        "--add-exports", "java.base/jdk.internal.ref=ALL-UNNAMED",
]
ext.chronicle_jvm_test_module_args = [
        "--add-modules", "java.base",
        "--add-modules", "java.se",
        "--add-exports", "java.base/jdk.internal.ref=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang=ALL-UNNAMED",
        "--add-opens", "java.base/java.nio=ALL-UNNAMED",
        "--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED",
        "--add-opens", "java.management/sun.management=ALL-UNNAMED",
        "--add-opens", "jdk.management/com.ibm.lang.management.internal=ALL-UNNAMED",
        "--add-opens", "jdk.management/com.sun.management.internal=ALL-UNNAMED",
]
