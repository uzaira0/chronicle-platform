                maven {
                    url githubPackageUrl
                    credentials {
                        username = System.getenv("GITHUB_ACTOR")
                        password = System.getenv("GITHUB_TOKEN")
                    }
                }
            }
            publications {
                mavenJava(MavenPublication) {
                    pom.withXml {
                        asNode().children().last() + {
                            resolveStrategy = Closure.DELEGATE_FIRST
                            name jarname

                            scm {
                                url scmUrl
                                connection connectionUrl
                                developerConnection developerConnectionUrl
                            }

                            licenses {
                                license {
                                    name mavenLicense.name
                                    url mavenLicense.url
                                    distribution 'repo'
                                }
                            }

                            developers {
                                developer {
                                    id 'chronicle'
                                    name 'Chronicle Team'
                                }
                            }
                        }
                    }
                    from components.java
                    // artifact ('README.md') {
                    //    classifier = 'README'
                    //    extension  = 'md'
                    // }

                    artifact javadocJar
                    artifact sourcesJar
                    artifact testJar
                }
            }
            signing {
                sign publishing.publications.mavenJava
            }
        }
    } else if ((branch.startsWith("release/") || branch == "main" || branch == "master") && !version.contains('-SNAPSHOT')) {
        publishing {
            repositories {
                // maven {
                //     url sonatypeMasterUrl
                //     credentials {
                //        username = System.getenv(SONATYPE_USERNAME)
                //        password = System.getenv(SONATYPE_PASSWORD)
                //     }
                // }
                maven {
                    url githubPackageUrl
                    credentials {
                        username = System.getenv("GITHUB_ACTOR")
                        password = System.getenv("GITHUB_TOKEN")
                    }
                }
            }
            publications {
                mavenJava(MavenPublication) {
                    pom.withXml {
                        asNode().children().last() + {
                            resolveStrategy = Closure.DELEGATE_FIRST
                            name jarname

                            scm {
                                url scmUrl
                                connection connectionUrl
                                developerConnection developerConnectionUrl
                            }

                            licenses {
                                license {
                                    name mavenLicense.name
                                    url mavenLicense.url
                                    distribution 'repo'
                                }
                            }

                            developers {
                                developer {
                                    id 'chronicle'
                                    name 'Chronicle Team'
                                }
                            }
                        }
                    }
                    from components.java
                    //artifact ('README.md') {
                    //classifier = 'README'
                    //extension  = 'md'
                    //}

                    artifact javadocJar
                    artifact sourcesJar
                    artifact testJar

                }
            }
        }
        signing {
            sign publishing.publications.mavenJava
        }
    }

}
