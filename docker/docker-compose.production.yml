# Chronicle Production Docker Compose
#
# This compose file overrides docker-compose.traefik.yml for production deployments.
# It replaces local builds with pre-built ghcr.io images and adds production tuning.
#
# Usage:
#   docker compose -f docker-compose.traefik.yml -f docker-compose.production.yml up -d
#
# The deploy.sh script handles this automatically.

# Fragments for services whose image comes from docker-compose.traefik.yml inherit its
# security_opt; restating it here would append a duplicate entry, which compose rejects.
services:

  # Override backend to use pre-built ghcr.io image instead of local build
  chronicle-backend:
    # This overlay names the image, so the policy checks it as a complete service. The values
    # match docker-compose.traefik.yml; !override keeps compose from appending a duplicate
    # security_opt entry (cap_drop entries are deduplicated by compose).
    security_opt: !override ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    build: !reset null
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the backend registry path}@sha256:${BACKEND_DIGEST:?deploy.sh resolves the pulled tag to its immutable digest}
    # Production JVM tuning
    environment:
      CHRONICLE_SERVER_XMS: ${BACKEND_XMS:-"-Xms1g"}
      CHRONICLE_SERVER_XMX: ${BACKEND_XMX:-"-Xmx3g"}
      # Disable development mode
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/var/log/chronicle/heapdump.hprof
        -Djava.security.egd=file:/dev/./urandom
        -Dfile.encoding=UTF-8
    # Stricter health check for production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:40320/chronicle/internal/health/ready > /dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 512
        reservations:
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
        tag: "chronicle-backend"

  # Override frontend to use pre-built ghcr.io image instead of local build
  chronicle-frontend:
    # This overlay names the image, so the policy checks it as a complete service. The values
    # match docker-compose.traefik.yml; !override keeps compose from appending a duplicate
    # security_opt entry (cap_drop entries are deduplicated by compose).
    security_opt: !override ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    build: !reset null
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the frontend registry path}@sha256:${FRONTEND_DIGEST:?deploy.sh resolves the pulled tag to its immutable digest}
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 256
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "chronicle-frontend"

  # Production PostgreSQL tuning
  postgres:
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 512
        reservations:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
        tag: "chronicle-postgres"

  # Production Traefik tuning
  traefik:
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 512
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
        tag: "chronicle-traefik"

  # Production monitoring tuning
  victoria-metrics:
    healthcheck:
      disable: false
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "chronicle-victoria-metrics"

  grafana:
    # Same key as the base file: a mem_limit beside its deploy limit is a compose error.
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "chronicle-grafana"

  victoria-logs:
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "chronicle-victoria-logs"
