
services:
  # Self-signed server certificate (SAN DNS:postgres) so migrate and the backend connect with
  # sslmode=verify-full. Same as docker-compose.dev.yml and the selfhost cert-init service;
  # root only to hand the key to uid 26.
  postgres-cert-init:
    image: percona/percona-distribution-postgresql:18.6.1-4@sha256:27a1dba816fcc4cec88f216d54e3ec86db4c1d4b16799f49800055c41606e11e
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/bash", "/selfhost/cert-init.sh"]
    environment:
      POSTGRES_TLS_DIR: /postgres-tls
      TLS_DIR: /tmp
    volumes:
      - ../selfhost:/selfhost:ro
      - postgres_tls:/postgres-tls
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 128m
    pids_limit: 64

  postgres:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    # Runs as the image's postgres user (26); only the volumes and tmpfs mounts are writable.
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - "/tmp:size=64m,mode=1777"
      - "/var/run/postgresql:size=8m,mode=3775,uid=26,gid=26"
    pids_limit: 512
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres-tls/postgres.crt
      - -c
      - ssl_key_file=/etc/postgres-tls/postgres.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
    image: percona/percona-distribution-postgresql:18.6.1-4@sha256:27a1dba816fcc4cec88f216d54e3ec86db4c1d4b16799f49800055c41606e11e
    container_name: chronicle-postgres
    environment:
      POSTGRES_USER: oltest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      POSTGRES_DB: chronicle
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # A postgres_data volume initialized by the old postgres:16 image will NOT
      # start under 17.x (PG major upgrades need pg_upgrade/dump-restore) — wipe
      # the volume or migrate it before re-upping an old checkout's data.
      # /data/db, NOT /var/lib/postgresql/data: this image sets PGDATA=/data/db and declares
      # it as a VOLUME, so the conventional path stored nothing -- the named volume stayed
      # empty and the real cluster went into an anonymous volume, which does not survive the
      # container being recreated. docker-compose.traefik.yml already mounts /data/db.
      #
      # MIGRATING AN EXISTING DEPLOYMENT: the current data is in that anonymous volume, not
      # in postgres_data. Take a pg_dump BEFORE changing this, or the stack comes up on an
      # empty database. `docker inspect <container> --format '{{range .Mounts}}{{.Name}} {{.Destination}}{{"\n"}}{{end}}'`
      # names the anonymous volume holding it.
      - postgres_data:/data/db
      - ./init-db-roles.sql:/docker-entrypoint-initdb.d/10-init-db-roles.sql:ro
      - ./hetzner/postgres/set-app-role-password.sh:/docker-entrypoint-initdb.d/15-set-app-role-password.sh:ro
      - ../selfhost/database-app-role.sql:/etc/chronicle/database-app-role.sql:ro
      - postgres_tls:/etc/postgres-tls:ro
    depends_on:
      postgres-cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oltest -d chronicle"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    entrypoint: ["/bin/sh", "/server/backend-entrypoint.sh", "--migrate"]
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_USER: oltest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # sslmode defaults to verify-full in backend-entrypoint.sh.
      POSTGRES_SSL_ROOT_CERT: /etc/postgres-tls/postgres.crt
      CHRONICLE_EXPORT_DIR: /var/lib/chronicle/exports
    volumes:
      - export_artifacts:/var/lib/chronicle/exports
      - audit_logs:/var/log/chronicle
      - postgres_tls:/etc/postgres-tls:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # The entrypoint stages the migration password here (selfhost migrate uses the same).
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=100,gid=101
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    # Same as the selfhost backend: image user, no capabilities, writes only to the tmpfs
    # mounts below (rendered config, JVM tmpdir) and the audit/export volumes.
    cap_drop: ["ALL"]
    read_only: true
    pids_limit: 1024
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: chronicle-backend
    environment:
      CHRONICLE_SERVER_XMS: "-Xms512m"
      CHRONICLE_SERVER_XMX: "-Xmx2g"
      CHRONICLE_SERVER_ARGS: "local postgres medialocal"
      # Database connection (uses docker network hostname)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chronicle
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CHRONICLE_INTERNAL_WEB_SECRET: ${CHRONICLE_INTERNAL_WEB_SECRET:?set CHRONICLE_INTERNAL_WEB_SECRET}
      CHRONICLE_SECURITY_METRICS_PASSWORD: ${METRICS_PASSWORD:?set METRICS_PASSWORD}
      CHRONICLE_EXPORT_DIR: /var/lib/chronicle/exports
      CHRONICLE_EXPORT_MAX_ROWS: "1000000"
      CHRONICLE_EXPORT_MAX_BYTES: "536870912"
      CHRONICLE_EXPORT_MAX_RUNTIME_SECONDS: "1800"
      CHRONICLE_EXPORT_MAX_TOTAL_BYTES: "8589934592"
      CHRONICLE_EXPORT_MIN_FREE_BYTES: "1073741824"
    tmpfs:
      - /server/scratch:size=256m,mode=0700,uid=100,gid=101
      - /server/rendered-config:size=1m,mode=0700,uid=100,gid=101
    entrypoint: ["/bin/sh", "/server/backend-entrypoint.sh"]
    command: []
    volumes:
      - export_artifacts:/var/lib/chronicle/exports
      - audit_logs:/var/log/chronicle
      # The selfhost rhizome template connects with sslmode=verify-full against the
      # certificate below.
      - ../selfhost/config:/server/config:ro
      - ./jetty-http.yaml.template:/server/config/jetty.yaml.template:ro
      - postgres_tls:/etc/postgres-tls:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "40320"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:40320/chronicle/internal/health/ready > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    # Runs as the image's nginx user (100:101); the same writable paths as chronicle-frontend
    # in docker-compose.traefik.yml.
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /var/lib/nginx/tmp:noexec,nosuid,uid=100,gid=101
      - /var/lib/nginx/logs:noexec,nosuid,uid=100,gid=101
      - /run/nginx:noexec,nosuid,uid=100,gid=101
      - /tmp:noexec,nosuid
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.prod
      args:
        AUTH_ENABLED: "false"
        API_BASE_URL: ""
    container_name: chronicle-frontend
    volumes:
      - frontend_build:/app/build

  nginx:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    container_name: chronicle-nginx
    # The image's nginx user, as chronicle-apk-download in docker-compose.traefik.yml: it
    # listens on 8080 (nginx.conf) and the host keeps port 80, so no capability is needed.
    # Logs go to the image's /dev/stdout and /dev/stderr links; pid and temp files to tmpfs.
    user: "101:101"
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,uid=101,gid=101
      - /var/run:noexec,nosuid,uid=101,gid=101
      - /tmp:noexec,nosuid
    pids_limit: 128
    ports:
      - "80:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  audit_logs:
  postgres_data:
  postgres_tls:
  frontend_build:
  export_artifacts:
