# This config requires envsubst preprocessing before use:
#   envsubst '$CHRONICLE_DOMAIN $CHRONICLE_EXT_DOMAIN' < nginx.prod.conf > /etc/nginx/nginx.conf
# Do NOT use bare envsubst (without var list) — it would also substitute nginx variables like $http_origin.

worker_processes auto;
# Request-level errors can contain raw URIs and client addresses; keep only critical process
# failures here. Operational request outcomes are emitted by the allowlisted access log below.
error_log /var/log/nginx/error.log crit;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never persist raw IPs, URIs/query capabilities, referrers, headers, or user agents.
    log_format main escape=json '{"timestamp":"$time_iso8601",'
                    '"method":"$request_method","status":$status,'
                    '"bytes":$body_bytes_sent,"duration":$request_time,'
                    '"upstream_connect":"$upstream_connect_time",'
                    '"upstream_header":"$upstream_header_time",'
                    '"upstream_duration":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # CORS origin validation — only allow configured domains
    # Set CHRONICLE_DOMAIN in the nginx environment (e.g., via docker compose)
    map $http_origin $cors_origin {
        default "";
        "~^https?://${CHRONICLE_DOMAIN}$" $http_origin;
        "~^https?://${CHRONICLE_EXT_DOMAIN}$" $http_origin;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=mobile_api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=web_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Backend upstream
    upstream chronicle_backend {
        server backend:40320;
        keepalive 32;
    }

    # Frontend upstream
    upstream chronicle_frontend {
        server frontend:8080;
    }

    # Redirect HTTP to HTTPS
    # Unprivileged ports: the container runs as the nginx user; compose maps host 80/443 here.
    server {
        listen 8080;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 8443 ssl;
        # Relative Location headers, so a redirect never leaks the internal 8443.
        absolute_redirect off;
        server_name _;

        # SSL certificates
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        # Content Security Policy
        # - 'self' for same-origin resources
        # - rsms.me for Inter font
        # - style hashes are preferred and configured below
        # - data: for inline images (base64)
        set $csp_default "default-src 'self'";
        set $csp_script "script-src 'self'";
        set $csp_style "style-src 'self' 'unsafe-inline' https://rsms.me";
        set $csp_img "img-src 'self' data:";
        set $csp_font "font-src 'self' https://rsms.me";
        set $csp_connect "connect-src 'self'";
        set $csp_frame "frame-src 'none'";
        set $csp_frame_ancestors "frame-ancestors 'none'";
        set $csp_form "form-action 'self'";
        set $csp_worker "worker-src 'self'";
        set $csp_base "base-uri 'self'";
        set $csp_object "object-src 'none'";
        # report-uri for CSP violation monitoring
        set $csp_report "report-uri /api/web/chronicle/v3/csp-report";
        add_header Content-Security-Policy "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_frame}; ${csp_frame_ancestors}; ${csp_form}; ${csp_worker}; ${csp_base}; ${csp_object}; ${csp_report}" always;

        # Connection limits
        limit_conn conn_limit 20;
        client_max_body_size 67108864;
        server_tokens off;

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ==============================================================
        # MOBILE API: /api/mobile/*
        # - Limited to specific endpoints (enrollment, upload, status)
        # - Requires X-Chronicle-App-Key header
        # - Strict rate limiting
        # - Only POST/GET allowed
        # ==============================================================
        location ~ ^/api/mobile/chronicle/(v[12]|study)(/|$) {
            return 404;
        }

        location /api/mobile/ {
            # Validate app key header (set this in .env and pass to nginx)
            # Reject requests without valid app key
            if ($http_x_chronicle_app_key = "") {
                return 403 '{"error": "Missing app key"}';
            }

            # Only allow specific methods
            limit_except GET POST {
                deny all;
            }

            # Strict rate limiting for mobile
            limit_req zone=mobile_api burst=10 nodelay;

            # CORS for mobile: no wildcard (mobile apps don't use CORS)
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'X-Chronicle-App-Key, Content-Type, Accept, X-Chronicle-Signature, X-Chronicle-Timestamp, X-Chronicle-Nonce' always;
            add_header 'Access-Control-Max-Age' '86400' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'X-Chronicle-App-Key, Content-Type, Accept, X-Chronicle-Signature, X-Chronicle-Timestamp, X-Chronicle-Nonce';
                add_header 'Content-Length' '0';
                return 204;
            }

            # Strip /api/mobile prefix and forward to backend
            rewrite ^/api/mobile/(.*) /$1 break;
            proxy_pass http://chronicle_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Chronicle-Client-Type "mobile";
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ==============================================================
        # WEB API: /api/web/*
        # - For authenticated frontend users
        # - Requires Authorization header with JWT
        # - More endpoints available
        # - Higher rate limits
        # ==============================================================
        location /api/web/ {
            # Require Authorization header
            if ($http_authorization = "") {
                return 401 '{"error": "Authentication required"}';
            }

            # Rate limiting for web API
            limit_req zone=web_api burst=30 nodelay;

            # CORS for web frontend
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' '86400' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Length' '0';
                return 204;
            }

            # Strip /api/web prefix and forward to backend
            rewrite ^/api/web/(.*) /$1 break;
            proxy_pass http://chronicle_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Chronicle-Client-Type "web";
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ==============================================================
        # BLOCK direct backend access
        # These routes are internal only - return 404
        # ==============================================================
        location /chronicle/ {
            return 404 '{"error": "Not found"}';
        }

        location /datastore/ {
            return 404 '{"error": "Not found"}';
        }

        location /principal/ {
            return 404 '{"error": "Not found"}';
        }

        location /compliance/ {
            return 404 '{"error": "Not found"}';
        }

        location /import/ {
            return 404 '{"error": "Not found"}';
        }

        # ==============================================================
        # FRONTEND: Serve static files
        # ==============================================================
        location / {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://chronicle_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://chronicle_frontend;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Block hidden files
        location ~ /\. {
            deny all;
        }
    }
}
