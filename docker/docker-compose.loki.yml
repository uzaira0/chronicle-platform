# Chronicle + Grafana Loki Stack
#
# Self-hosted log aggregation with Grafana dashboards.
# Usage:
#   docker-compose -f docker-compose.prod.yml -f docker-compose.loki.yml up -d
#
# Access Grafana at http://localhost:3000 (admin/admin)

services:
  health-probe:
    extends:
      file: ../selfhost/config/health-probe.yml
      service: health-probe

  # Loki - Log aggregation
  loki:
    image: grafana/loki:3.6.7@sha256:${LOKI_IMAGE_DIGEST:?Set LOKI_IMAGE_DIGEST to the owner-approved SHA-256 digest}
    container_name: chronicle-loki
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - health_probe:/probe:ro
      - ./siem/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - chronicle-internal
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

  # Promtail - Log shipper
    depends_on:
      health-probe: {condition: service_completed_successfully}
  promtail:
    # Ubuntu provides Bash; its built-ins probe readiness without curl or wget.
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9080; printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 30s
      timeout: 5s
      retries: 3
    image: grafana/promtail:3.6.7@sha256:${PROMTAIL_IMAGE_DIGEST:?Set PROMTAIL_IMAGE_DIGEST to the owner-approved SHA-256 digest}
    container_name: chronicle-promtail
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=16M
    volumes:
      - ./siem/promtail-config.yml:/etc/promtail/config.yml:ro
      - audit_logs:/var/log/chronicle:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - chronicle-internal
    depends_on:
      loki: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256

  # Grafana - Visualization & Alerting
  grafana:
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: chronicle-grafana
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
      - /var/log/grafana:noexec,nosuid,size=64M
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./siem/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./siem/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./siem/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - chronicle-internal
    depends_on:
      loki: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

networks:
  chronicle-internal:
    external: true

volumes:
  health_probe:
  loki_data:
  grafana_data:
  audit_logs:
    external: true
    name: chronicle_audit_logs
