name: chronicle

# Chronicle deployment behind an upstream reverse proxy and Traefik
#
# The operator-managed proxy terminates client TLS and forwards plaintext HTTP
# to Traefik on port 80. Traefik does not own
# public TLS here; it only routes the explicit Chronicle endpoints.
# Non-Chronicle apps are local intranet HTTP only.
#
# API Routes:
#   - Mobile API: https://${DOMAIN}/chronicle/v3/...
#     (one-time enrollment followed by a per-device API key)
#   - Web API: https://${DOMAIN}/chronicle/api/web/...
#     (requires Authorization header)
#   - Frontend: internal-only at intranet hosts only via
#     Host-gated local route in local-apps.yml
#
# Direct backend routes (/chronicle/datastore/*, /chronicle/principal/*) are blocked.
#
# Usage:
#   1. Configure .env (set DOMAIN, TRAEFIK_NETWORK, deployment secrets, etc.)
#   2. docker compose -f docker-compose.traefik.yml up -d

services:
  health-probe:
    extends:
      file: ../selfhost/config/health-probe.yml
      service: health-probe


  # =========================================
  # Traefik Reverse Proxy
  # =========================================
  # Replaces Dokploy-managed Traefik for Chronicle only. The Docker provider
  # is constrained to the Chronicle compose project; local intranet HTTP apps
  # are defined explicitly in traefik/dynamic/local-apps.yml.
  # Docker Socket Proxy — limits Traefik's access to the Docker API
  # Only allows read-only container and network queries; blocks write operations
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: chronicle-docker-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint renders /tmp/haproxy.cfg and HAProxy writes /run/haproxy.pid; nothing
    # else is written (same image and tmpfs pair as selfhost/overlays/monitoring.yml).
    read_only: true
    tmpfs: ["/run:size=4m,mode=0755", "/tmp:size=4m,mode=1777"]
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # chronicle-private edge net: only chronicle-traefik can reach the socket proxy.
      # Not on the shared traefik-apps bridge, where any sibling app container
      # could query the docker API by IP.
      - chronicle-edge
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:2375/version || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 64

  traefik:
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: edge-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Listens on unprivileged :8080 (traefik/traefik.yml), so no NET_BIND_SERVICE; the host
    # still publishes port 80. Writes go only to the dynamic/ bind mount, the access-log
    # volume and /tmp (same layout as docker/hetzner/compose.yml).
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    environment:
      CROWDSEC_BOUNCER_API_KEY: ${CROWDSEC_BOUNCER_API_KEY:?Set CROWDSEC_BOUNCER_API_KEY in the untracked production env file}
      # Same secret the backend expects for the internal-web signing bypass.
      # Injected below on the /chronicle/api/web file-provider middleware.
      CHRONICLE_INTERNAL_WEB_SECRET: ${CHRONICLE_INTERNAL_WEB_SECRET:?Set CHRONICLE_INTERNAL_WEB_SECRET in the untracked production env file}
    ports:
      - "${TRAEFIK_BIND_IP:-127.0.0.1}:80:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro,z
      - ./traefik/dynamic/crowdsec-waf.yml.template:/etc/traefik/crowdsec-waf.yml.template:ro,z
      - ./traefik/internal-web-header.yml.template:/etc/traefik/internal-web-header.yml.template:ro,z
      - ./traefik/dynamic:/etc/traefik/dynamic:z
      - ./traefik/plugins-local:/plugins-local:ro,z
      - traefik_access_logs:/var/log/traefik
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$$CROWDSEC_BOUNCER_API_KEY" ]; then
          echo "CROWDSEC_BOUNCER_API_KEY is required; refusing to start without CrowdSec WAF credentials" >&2
          exit 1
        fi
        if [ ! -s /etc/traefik/crowdsec-waf.yml.template ]; then
          echo "Missing /etc/traefik/crowdsec-waf.yml.template; refusing to start without CrowdSec WAF middleware" >&2
          exit 1
        fi
        umask 077
        # Clear any stale render temps left in the watched dir by a crash between
        # mktemp and mv on a prior start. Traefik keys the file provider on the
        # final extension so it never loads a *.yml.XXXXXX temp, but an orphan would
        # otherwise linger on the bind-mount carrying a stale plaintext secret.
        #
        # Match the mktemp suffix width EXACTLY (?????? == the 6 chars of XXXXXX).
        # Do NOT widen this back to `.yml.*`: crowdsec-waf.yml.template lives INSIDE
        # this same dynamic/ dir (unlike internal-web-header.yml.template, which sits
        # in the parent), and dynamic/ is a read-write bind mount — so a `.yml.*` glob
        # deletes the tracked template off the HOST, and the next start then fails the
        # "Missing ... refusing to start" guard and takes down all routing.
        rm -f /etc/traefik/dynamic/crowdsec-waf.yml.?????? /etc/traefik/dynamic/internal-web-header.yml.??????
        tmp="$$(mktemp /etc/traefik/dynamic/crowdsec-waf.yml.XXXXXX)"
        sed "s|\$${CROWDSEC_BOUNCER_API_KEY}|$$CROWDSEC_BOUNCER_API_KEY|g" \
          /etc/traefik/crowdsec-waf.yml.template > "$$tmp"
        mv "$$tmp" /etc/traefik/dynamic/crowdsec-waf.yml
        # Render the file-provider internal-web signing-bypass middleware with the
        # proxy-injected secret (CWE-290 hardening). Empty secret => legacy "true"
        # so existing deployments keep working until the operator sets it.
        if [ ! -s /etc/traefik/internal-web-header.yml.template ]; then
          echo "Missing /etc/traefik/internal-web-header.yml.template; refusing to start" >&2
          exit 1
        fi
        if [ -z "$${CHRONICLE_INTERNAL_WEB_SECRET}" ]; then
          echo "CHRONICLE_INTERNAL_WEB_SECRET is required; refusing to enable a guessable browser signing bypass" >&2
          exit 1
        fi
        internal_web_value="$${CHRONICLE_INTERNAL_WEB_SECRET}"
        tmpiw="$$(mktemp /etc/traefik/dynamic/internal-web-header.yml.XXXXXX)"
        sed "s|__CHRONICLE_INTERNAL_WEB_SECRET__|$$internal_web_value|g" \
          /etc/traefik/internal-web-header.yml.template > "$$tmpiw"
        mv "$$tmpiw" /etc/traefik/dynamic/internal-web-header.yml
        exec traefik
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      chronicle-crowdsec:
        condition: service_healthy
    networks:
      # Stays on the operator-provided shared edge network to route sibling services.
      # chronicle-edge is the private net to reach Chronicle's own services
      # (frontend, Grafana, CrowdSec, socket proxy)
      # now that they've left the shared bridge. chronicle-traefik is the only
      # chronicle container still on traefik-apps — the controlled choke point.
      - traefik
      - chronicle-edge
      - chronicle-backend-bridge
      - chronicle-sso-edge
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # =========================================
  # CrowdSec — WAF + IP reputation engine
  # =========================================
  # Reads Traefik access logs, detects attack patterns, issues ban/captcha
  # decisions. The Traefik bouncer plugin queries LAPI (:8080) for IP decisions
  # and AppSec (:7422) for request-body inspection.
  chronicle-crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: chronicle-crowdsec
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # docker_start.sh and the hub/database write only under /etc/crowdsec and
    # /var/lib/crowdsec/data (both volumes); logs go to stdout. /tmp covers Go temp files.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
      BOUNCER_KEY_traefik: ${CROWDSEC_BOUNCER_API_KEY}
      DISABLE_ONLINE_API: "true"
    volumes:
      - traefik_access_logs:/var/log/traefik:ro
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro,z
      - ./crowdsec/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro,z
      - ./crowdsec/scenarios/geo-block.yaml:/etc/crowdsec/postoverflows/s01-whitelist/geo-block.yaml:ro,z
    healthcheck:
      test: ["CMD-SHELL", "cscli lapi status && nc -z localhost 7422"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      # chronicle-private edge net (was the shared traefik-apps bridge). Only
      # chronicle-traefik queries LAPI:8080 / AppSec:7422 — no sibling app needs it.
      - chronicle-edge
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256

  # PostgreSQL Database with Transparent Data Encryption (TDE) and SSL/TLS
  # Uses Percona Distribution for PostgreSQL with the pg_tde extension (encryption at rest)
  # SSL/TLS encryption in transit protects data between application and database
  postgres:
    image: percona/percona-distribution-postgresql:18.6.1-4@sha256:27a1dba816fcc4cec88f216d54e3ec86db4c1d4b16799f49800055c41606e11e
    container_name: chronicle-postgres
    # The wrapper prepares root-owned named volumes and TLS material, then the
    # upstream Percona entrypoint drops to postgres before starting the server.
    user: "0:0"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Writable paths: the data, WAL-archive and keyring volumes plus the tmpfs mounts below.
    # ssl-run holds the runtime key copy and the Vault token, so they no longer persist in
    # the container layer.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=8m,mode=3775,uid=26,gid=26
      - /var/lib/postgresql/ssl-run:size=4m,mode=0700
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Enable pg_tde extension for Transparent Data Encryption
      ENABLE_PG_TDE: "1"
      # TDE Key Provider Configuration
      # Options: "file" (development), "vault" (production), "none" (disabled)
      PG_TDE_KEY_PROVIDER: ${PG_TDE_KEY_PROVIDER:-file}
      # HashiCorp Vault settings (required when PG_TDE_KEY_PROVIDER=vault)
      PG_TDE_VAULT_URL: ${PG_TDE_VAULT_URL:-}
      PG_TDE_VAULT_TOKEN: ${PG_TDE_VAULT_TOKEN:-}
      PG_TDE_VAULT_TOKEN_PATH: /var/lib/postgresql/ssl-run/pg-tde-vault-token
      PG_TDE_VAULT_MOUNT_PATH: ${PG_TDE_VAULT_MOUNT_PATH:-secret}
      PG_TDE_VAULT_CA_PATH: ${PG_TDE_VAULT_CA_PATH:-}
      PG_TDE_ALLOW_INSECURE_VAULT: ${PG_TDE_ALLOW_INSECURE_VAULT:-false}
    volumes:
      - postgres_data:/data/db
      # TDE keyring storage (for file-based provider - development only)
      - postgres_tde_keyring:/var/lib/postgresql/tde-keyring
      # RLS roles (chronicle_app / chronicle_admin) — MUST run first: the backend's
      # request-path RLS wrapper does SET ROLE chronicle_app on every authenticated
      # request, and init-audit-immutability references the roles.
      - ./init-db-roles.sql:/docker-entrypoint-initdb.d/10-init-db-roles.sql:ro
      - ./hetzner/postgres/set-app-role-password.sh:/docker-entrypoint-initdb.d/15-set-app-role-password.sh:ro
      - ../selfhost/database-app-role.sql:/etc/chronicle/database-app-role.sql:ro
      # Initialization script for TDE setup
      - ./init-db-encryption.sh:/docker-entrypoint-initdb.d/20-init-db-encryption.sh:ro
      - ./init-replication.sh:/docker-entrypoint-initdb.d/25-init-replication.sh:ro
      - ./init-audit-immutability.sh:/docker-entrypoint-initdb.d/30-init-audit-immutability.sh:ro
      # SSL/TLS certificates — mounted read-only from host. The entrypoint below
      # copies them to /var/lib/postgresql/ssl-run/ and chowns to UID 26 so
      # PostgreSQL can read the key (which requires owner == database user).
      - ./postgres-ssl/server/server.crt:/etc/postgres-ssl-src/server.crt:ro,z
      - ./postgres-ssl/server/server.key:/etc/postgres-ssl-src/server.key:ro,z
      - ./postgres-ssl/ca/ca.crt:/etc/postgres-ssl-src/ca.crt:ro,z
      # Mount custom pg_hba.conf to enforce SSL for external connections
      # Percona 17.5 uses PGDATA=/data/db by default (confirmed via SHOW hba_file)
      - ./postgres-ssl/pg_hba-ssl.conf:/data/db/pg_hba.conf:ro,z
    networks:
      - chronicle-internal
    healthcheck:
      # Must use -h 127.0.0.1 (TCP), not the default local unix socket: the socket
      # matches pg_hba "local all all peer", and the healthcheck's OS user != the
      # DB role, so socket checks log a FATAL "Peer authentication failed" every
      # interval (~8.5k/day of log spam) even though pg_isready still reports up.
      # The replica healthcheck already does this correctly.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Copy SSL certs to a postgres-owned directory before starting.
    # The bind-mount source may be owned by a host UID that differs from
    # the container's postgres UID (26); PostgreSQL rejects a server.key
    # it does not own. The container has CAP_CHOWN so this is safe.
    entrypoint:
      - sh
      - -eu
      - -c
      - |
        mkdir -p /var/lib/postgresql/ssl-run /var/lib/postgresql/tde-keyring /data/db/wal_archive
        # Named volumes are initially root-owned. The upstream entrypoint drops to
        # postgres before sourcing initdb scripts, so prepare the keyring here while
        # this wrapper still has the narrowly granted CHOWN/FOWNER capabilities.
        chown -R 26:26 /var/lib/postgresql/tde-keyring
        chmod 700 /var/lib/postgresql/tde-keyring
        chown 26:26 /data/db/wal_archive
        chmod 700 /data/db/wal_archive
        cp /etc/postgres-ssl-src/server.crt /var/lib/postgresql/ssl-run/
        cp /etc/postgres-ssl-src/server.key /var/lib/postgresql/ssl-run/
        cp /etc/postgres-ssl-src/ca.crt     /var/lib/postgresql/ssl-run/
        if [ "$${PG_TDE_KEY_PROVIDER:-file}" = vault ]; then
          [ -n "$${PG_TDE_VAULT_TOKEN:-}" ] || { echo "FATAL: PG_TDE_VAULT_TOKEN is required for Vault-backed TDE" >&2; exit 1; }
          printf '%s' "$$PG_TDE_VAULT_TOKEN" > "$$PG_TDE_VAULT_TOKEN_PATH"
        fi
        chown -R 26:26 /var/lib/postgresql/ssl-run
        chmod 600 /var/lib/postgresql/ssl-run/server.key
        [ ! -f "$$PG_TDE_VAULT_TOKEN_PATH" ] || chmod 600 "$$PG_TDE_VAULT_TOKEN_PATH"
        chmod 644 /var/lib/postgresql/ssl-run/server.crt /var/lib/postgresql/ssl-run/ca.crt
        exec /entrypoint.sh "$@"
      - --
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/ssl-run/server.crt
      -c ssl_key_file=/var/lib/postgresql/ssl-run/server.key
      -c ssl_ca_file=/var/lib/postgresql/ssl-run/ca.crt
      -c ssl_min_protocol_version=TLSv1.2
      -c ssl_prefer_server_ciphers=on
      -c password_encryption=scram-sha-256
      -c default_table_access_method=tde_heap
      -c statement_timeout=300000
      -c idle_in_transaction_session_timeout=60000
      -c lock_timeout=30000
      -c shared_preload_libraries=pg_tde,pgaudit,pg_stat_statements
      -c pg_stat_statements.track=all
      -c pgaudit.log=ddl,role,write
      -c pgaudit.log_catalog=off
      -c pgaudit.log_client=on
      -c pgaudit.log_level=log
      -c pgaudit.log_statement_once=on
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /data/db/wal_archive/%f && cp %p /data/db/wal_archive/%f'
      -c max_wal_senders=3
      -c max_parallel_workers_per_gather=0
      -c shared_buffers=512MB
    deploy:
      resources:
        limits:
          # Raised from 1G: 128MB default shared_buffers + a big sort/hash on the
          # ~1GB encrypted sensor table could OOM-kill a backend (same blast radius
          # as a crash). 2G limit pairs with shared_buffers=512MB above.
          memory: 2G
          pids: 512

  postgres-replica:
    image: percona/percona-distribution-postgresql:18.6.1-4@sha256:27a1dba816fcc4cec88f216d54e3ec86db4c1d4b16799f49800055c41606e11e
    container_name: chronicle-postgres-replica
    user: "0:0"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Same tmpfs layout as the primary; the cluster lives on the /pgdata volume.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=8m,mode=3775,uid=26,gid=26
      - /var/lib/postgresql/ssl-run:size=4m,mode=0700
    environment:
      PGDATA: /pgdata/data
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PRIMARY_HOST: postgres
      POSTGRES_PRIMARY_PORT: 5432
      ENABLE_PG_TDE: "1"
      PG_TDE_KEY_PROVIDER: ${PG_TDE_KEY_PROVIDER:-file}
      PG_TDE_VAULT_URL: ${PG_TDE_VAULT_URL:-}
      PG_TDE_VAULT_TOKEN: ${PG_TDE_VAULT_TOKEN:-}
      PG_TDE_VAULT_TOKEN_PATH: /var/lib/postgresql/ssl-run/pg-tde-vault-token
      PG_TDE_VAULT_MOUNT_PATH: ${PG_TDE_VAULT_MOUNT_PATH:-secret}
      PG_TDE_VAULT_CA_PATH: ${PG_TDE_VAULT_CA_PATH:-}
      PG_TDE_ALLOW_INSECURE_VAULT: ${PG_TDE_ALLOW_INSECURE_VAULT:-false}
    volumes:
      - postgres_replica_data:/pgdata
      - postgres_tde_keyring:/var/lib/postgresql/tde-keyring
      - ./postgres-ssl/server/server.crt:/etc/postgres-ssl-src/server.crt:ro,z
      - ./postgres-ssl/server/server.key:/etc/postgres-ssl-src/server.key:ro,z
      - ./postgres-ssl/ca/ca.crt:/etc/postgres-ssl-src/ca.crt:ro,z
    networks:
      - chronicle-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Raised from 512M to match a heavier primary; a standby replays the
          # primary's workload and must not OOM mid-replay (would break HA).
          memory: 1G
          pids: 512
    # Start as standby using pg_basebackup from primary
    command: |
      bash -c '
      set -e
      mkdir -p /var/lib/postgresql/ssl-run
      cp /etc/postgres-ssl-src/server.crt /var/lib/postgresql/ssl-run/
      cp /etc/postgres-ssl-src/server.key /var/lib/postgresql/ssl-run/
      cp /etc/postgres-ssl-src/ca.crt     /var/lib/postgresql/ssl-run/
      if [ "$${PG_TDE_KEY_PROVIDER:-file}" = vault ]; then
        [ -n "$${PG_TDE_VAULT_TOKEN:-}" ] || { echo "FATAL: PG_TDE_VAULT_TOKEN is required for Vault-backed TDE" >&2; exit 1; }
        printf "%s" "$$PG_TDE_VAULT_TOKEN" > "$$PG_TDE_VAULT_TOKEN_PATH"
      fi
      chown -R 26:26 /var/lib/postgresql/ssl-run
      chmod 600 /var/lib/postgresql/ssl-run/server.key
      [ ! -f "$$PG_TDE_VAULT_TOKEN_PATH" ] || chmod 600 "$$PG_TDE_VAULT_TOKEN_PATH"
      chmod 644 /var/lib/postgresql/ssl-run/server.crt /var/lib/postgresql/ssl-run/ca.crt
      mkdir -p /pgdata/data
      chown -R postgres:postgres /pgdata
      chmod 700 /pgdata/data
      if [ ! -f /pgdata/data/PG_VERSION ]; then
        echo "Initializing replica from primary..."
        rm -rf /pgdata/data/*
        until pg_isready -h postgres -p 5432 -U "${POSTGRES_USER}"; do sleep 2; done
        echo "Ensuring primary has REPLICATION privilege and slot..."
        gosu postgres psql -h postgres -p 5432 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "ALTER ROLE ${POSTGRES_USER} WITH REPLICATION;"
        gosu postgres psql -h postgres -p 5432 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = '"'"'chronicle_replica_1'"'"') THEN pg_create_physical_replication_slot('"'"'chronicle_replica_1'"'"') ELSE NULL END;"
        if ! gosu postgres pg_basebackup -h postgres -p 5432 -U "${POSTGRES_USER}" -D /pgdata/data -Fp -Xs -P -R --slot=chronicle_replica_1; then
          echo "pg_basebackup failed — cleaning up partial data directory"
          rm -rf /pgdata/data/*
          exit 1
        fi
        chown -R postgres:postgres /pgdata/data
        chmod 700 /pgdata/data
      fi
      exec gosu postgres postgres -D /pgdata/data \
        -c hot_standby=on \
        -c ssl=on \
        -c ssl_cert_file=/var/lib/postgresql/ssl-run/server.crt \
        -c ssl_key_file=/var/lib/postgresql/ssl-run/server.key \
        -c ssl_ca_file=/var/lib/postgresql/ssl-run/ca.crt \
        -c ssl_min_protocol_version=TLSv1.2 \
        -c ssl_prefer_server_ciphers=on \
        -c password_encryption=scram-sha-256 \
        -c default_table_access_method=tde_heap \
        -c statement_timeout=300000 \
        -c idle_in_transaction_session_timeout=60000 \
        -c lock_timeout=30000 \
        -c shared_preload_libraries=pg_tde,pgaudit,pg_stat_statements \
        -c pg_stat_statements.track=all \
        -c pgaudit.log=ddl,role,write \
        -c pgaudit.log_catalog=off \
        -c pgaudit.log_client=on \
        -c pgaudit.log_level=log \
        -c pgaudit.log_statement_once=on \
        -c max_parallel_workers_per_gather=0
      '

  keycloak-postgres:
    build:
      context: .
      dockerfile: Dockerfile.keycloak-postgres
    image: chronicle-keycloak-postgres:18.6-local
    container_name: chronicle-keycloak-postgres
    profiles: ["sso"]
    restart: unless-stopped
    user: "70:70"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The cluster lives on the volume; the socket/lock dir and /tmp are tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=8m,mode=3775,uid=70,gid=70
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-keycloak-db-password}
      POSTGRES_DB: ${KEYCLOAK_DB:-chronicle_keycloak}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # Setting PGDATA explicitly is what makes this survive the 17 -> 18 image bump.
      # postgres:18-alpine moved its OWN default PGDATA to /var/lib/postgresql/18/docker and
      # its VOLUME from /var/lib/postgresql/data to /var/lib/postgresql. A service that
      # relied on the image default while mounting /var/lib/postgresql/data writes into an
      # anonymous volume and loses everything on the next recreate (verified, not theorised).
      # Because this line names the path, the mount below still holds the cluster.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - chronicle-sso-db
    healthcheck:
      # -h 127.0.0.1 to avoid peer-auth FATAL spam over the local socket (see primary).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        if [ "$$POSTGRES_PASSWORD" = "change-me-keycloak-db-password" ]; then
          echo "FATAL: set KEYCLOAK_DB_PASSWORD before enabling the sso profile" >&2
          exit 1
        fi
        case "$$POSTGRES_DB" in (*[!A-Za-z0-9_]*|'') echo "FATAL: KEYCLOAK_DB must contain only letters, numbers, and underscores" >&2; exit 1 ;; esac
        case "$$POSTGRES_USER" in (*[!A-Za-z0-9_]*|'') echo "FATAL: KEYCLOAK_DB_USER must contain only letters, numbers, and underscores" >&2; exit 1 ;; esac
        exec docker-entrypoint.sh postgres \
          -c listen_addresses='*' \
          -c password_encryption=scram-sha-256 \
          -c log_connections=on \
          -c log_disconnections=on \
          -c log_statement=ddl
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 512

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    image: chronicle-keycloak:26.7.3-local
    container_name: chronicle-keycloak
    profiles: ["sso"]
    restart: unless-stopped
    user: "1000:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB:-chronicle_keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-keycloak-db-password}
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-keycloak-admin-password}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-https://${DOMAIN}/keycloak}
      KEYCLOAK_REALM: ${OIDC_REALM:-chronicle}
      KEYCLOAK_CHRONICLE_CLIENT_ID: ${OIDC_CLIENT_ID:-chronicle-web}
      KEYCLOAK_CHRONICLE_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me-local-oidc-secret}
      # Operator-supplied upstream OIDC provider (preferred over the disabled
      # SAML placeholder). Confirm endpoint values against the provider's
      # published discovery document before enabling the broker.
      # Client credentials are issued when Chronicle is registered as an OIDC
      # relying party; production rejects placeholder credentials.
      # OIDC relying party. Production remains blocked if the upstream identity provider has not provisioned
      # OIDC because the SAML broker lacks proved current-session MFA assurance.
      UPSTREAM_OIDC_CLIENT_ID: ${UPSTREAM_OIDC_CLIENT_ID:-change-me-upstream-oidc-client-id}
      UPSTREAM_OIDC_CLIENT_SECRET: ${UPSTREAM_OIDC_CLIENT_SECRET:-change-me-upstream-oidc-client-secret}
      UPSTREAM_OIDC_ISSUER: ${UPSTREAM_OIDC_ISSUER:-https://idp.example.org}
      UPSTREAM_OIDC_AUTH_URL: ${UPSTREAM_OIDC_AUTH_URL:-https://idp.example.org/authorize}
      UPSTREAM_OIDC_TOKEN_URL: ${UPSTREAM_OIDC_TOKEN_URL:-https://idp.example.org/token}
      UPSTREAM_OIDC_USERINFO_URL: ${UPSTREAM_OIDC_USERINFO_URL:-https://idp.example.org/userinfo}
      UPSTREAM_OIDC_JWKS_URL: ${UPSTREAM_OIDC_JWKS_URL:-https://idp.example.org/jwks}
      # Which broker the browser flow auto-redirects to: upstream-oidc (preferred) or
      # disabled SAML example (fallback). Both examples are imported; this picks the default.
      KEYCLOAK_DEFAULT_IDP: ${KEYCLOAK_DEFAULT_IDP:-upstream-oidc}
      CHRONICLE_SECURITY_REQUIRE_MFA: ${CHRONICLE_SECURITY_REQUIRE_MFA:?Set CHRONICLE_SECURITY_REQUIRE_MFA=true for production}
      CHRONICLE_SECURITY_MFA_IDP_PROOF_VERIFIED: ${CHRONICLE_SECURITY_MFA_IDP_PROOF_VERIFIED:-false}
      DOMAIN: ${DOMAIN}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-chronicle.json.template:/opt/keycloak/import-template/realm-chronicle.json.template:ro,z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      - chronicle-sso-edge
      - chronicle-sso-broker
      - chronicle-sso-db
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /keycloak/health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        for value in "$$KC_DB_PASSWORD" "$$KC_BOOTSTRAP_ADMIN_PASSWORD" "$$KEYCLOAK_CHRONICLE_CLIENT_SECRET"; do
          case "$$value" in change-me-*) echo "FATAL: replace default Keycloak secrets before enabling the sso profile" >&2; exit 1 ;; esac
        done
        if [ "$$CHRONICLE_SECURITY_REQUIRE_MFA" = "true" ] && [ "$$KEYCLOAK_DEFAULT_IDP" = "upstream-saml" ]; then
          echo "FATAL: MFA enforcement cannot use the disabled upstream SAML example until current-session AuthnContext is mapped to approved amr/acr assurance" >&2
          exit 1
        fi
        if [ "$$CHRONICLE_SECURITY_MFA_IDP_PROOF_VERIFIED" != "true" ]; then
          echo "FATAL: production requires verified live current-session MFA IdP proof" >&2
          exit 1
        fi
        if [ "$$KEYCLOAK_DEFAULT_IDP" = "upstream-oidc" ]; then
          for value in "$$UPSTREAM_OIDC_CLIENT_ID" "$$UPSTREAM_OIDC_CLIENT_SECRET"; do
            case "$$value" in ''|change-me-*|CHANGE_ME*|disabled*) echo "FATAL: replace Upstream OIDC client credentials before using KEYCLOAK_DEFAULT_IDP=upstream-oidc" >&2; exit 1 ;; esac
          done
        fi
        mkdir -p /opt/keycloak/data/import
        sed \
          -e "s|__REALM__|$$KEYCLOAK_REALM|g" \
          -e "s|__CLIENT_ID__|$$KEYCLOAK_CHRONICLE_CLIENT_ID|g" \
          -e "s|__CLIENT_SECRET__|$$KEYCLOAK_CHRONICLE_CLIENT_SECRET|g" \
          -e "s|__DOMAIN__|$$DOMAIN|g" \
          -e "s|__UPSTREAM_OIDC_CLIENT_ID__|$$UPSTREAM_OIDC_CLIENT_ID|g" \
          -e "s|__UPSTREAM_OIDC_CLIENT_SECRET__|$$UPSTREAM_OIDC_CLIENT_SECRET|g" \
          -e "s|__UPSTREAM_OIDC_ISSUER__|$$UPSTREAM_OIDC_ISSUER|g" \
          -e "s|__UPSTREAM_OIDC_AUTH_URL__|$$UPSTREAM_OIDC_AUTH_URL|g" \
          -e "s|__UPSTREAM_OIDC_TOKEN_URL__|$$UPSTREAM_OIDC_TOKEN_URL|g" \
          -e "s|__UPSTREAM_OIDC_USERINFO_URL__|$$UPSTREAM_OIDC_USERINFO_URL|g" \
          -e "s|__UPSTREAM_OIDC_JWKS_URL__|$$UPSTREAM_OIDC_JWKS_URL|g" \
          /opt/keycloak/import-template/realm-chronicle.json.template > /opt/keycloak/data/import/realm-chronicle.json
        /opt/keycloak/bin/kc.sh start --optimized --import-realm --http-enabled=true --hostname="$$KEYCLOAK_PUBLIC_URL" --proxy-headers=xforwarded &
        kc_pid="$$!"
        trap 'kill -TERM "$$kc_pid" 2>/dev/null || true; wait "$$kc_pid"' TERM INT
        for _ in $$(seq 1 60); do
          if timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /keycloak/health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "'; then
            break
          fi
          sleep 2
        done
        /opt/keycloak/bin/kcadm.sh config credentials --config /tmp/kcadm.config --server http://127.0.0.1:8080/keycloak --realm master --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null
        executions="$$(/opt/keycloak/bin/kcadm.sh get authentication/flows/browser/executions -r "$$KEYCLOAK_REALM" --config /tmp/kcadm.config --fields id,providerId,authenticationConfig | tr -d '\n')"
        redirector_id="$$(printf '%s' "$$executions" | sed -n 's/.*{[^}]*"id" : "\([^"]*\)"[^}]*"providerId" : "identity-provider-redirector"[^}]*}.*/\1/p')"
        redirector_config_id="$$(printf '%s' "$$executions" | sed -n 's/.*{[^}]*"providerId" : "identity-provider-redirector"[^}]*"authenticationConfig" : "\([^"]*\)"[^}]*}.*/\1/p')"
        if [ -z "$$redirector_id" ]; then
          echo "FATAL: Keycloak browser flow is missing identity-provider-redirector" >&2
          kill -TERM "$$kc_pid" 2>/dev/null || true
          wait "$$kc_pid"
          exit 1
        fi
        if [ -n "$$redirector_config_id" ]; then
          /opt/keycloak/bin/kcadm.sh update "authentication/config/$$redirector_config_id" -r "$$KEYCLOAK_REALM" --config /tmp/kcadm.config \
            -s alias=chronicle-upstream-idp-redirector \
            -s config.defaultProvider="$$KEYCLOAK_DEFAULT_IDP" \
            -s config.hideOnLoginPage=true
        else
          /opt/keycloak/bin/kcadm.sh create "authentication/executions/$$redirector_id/config" -r "$$KEYCLOAK_REALM" --config /tmp/kcadm.config \
            -s alias=chronicle-upstream-idp-redirector \
            -s config.defaultProvider="$$KEYCLOAK_DEFAULT_IDP" \
            -s config.hideOnLoginPage=true >/dev/null
        fi
        wait "$$kc_pid"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=chronicle-sso-edge"
      - "traefik.http.services.chronicle-keycloak.loadbalancer.server.port=8080"
      - "traefik.http.routers.chronicle-keycloak-admin-block.rule=Host(`${DOMAIN}`) && (Path(`/keycloak`) || Path(`/keycloak/`) || PathPrefix(`/keycloak/admin`) || PathPrefix(`/keycloak/health`) || PathPrefix(`/keycloak/metrics`))"
      - "traefik.http.routers.chronicle-keycloak-admin-block.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-keycloak-admin-block.priority=99"
      - "traefik.http.routers.chronicle-keycloak-admin-block.service=chronicle-keycloak"
      - "traefik.http.routers.chronicle-keycloak-admin-block.middlewares=crowdsec-waf@file,chronicle-keycloak-ratelimit,chronicle-keycloak-block-response,chronicle-keycloak-headers"
      - "traefik.http.routers.chronicle-keycloak.rule=Host(`${DOMAIN}`) && PathPrefix(`/keycloak`)"
      - "traefik.http.routers.chronicle-keycloak.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-keycloak.priority=30"
      - "traefik.http.routers.chronicle-keycloak.service=chronicle-keycloak"
      - "traefik.http.routers.chronicle-keycloak.middlewares=crowdsec-waf@file,chronicle-keycloak-forwarded-https,chronicle-keycloak-ratelimit,chronicle-keycloak-headers"
      - "traefik.http.routers.chronicle-keycloak-semicolon-block.rule=Host(`${DOMAIN}`) && PathPrefix(`/keycloak`) && PathRegexp(`.*;.*`)"
      - "traefik.http.routers.chronicle-keycloak-semicolon-block.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-keycloak-semicolon-block.priority=100"
      - "traefik.http.routers.chronicle-keycloak-semicolon-block.service=chronicle-keycloak"
      - "traefik.http.routers.chronicle-keycloak-semicolon-block.middlewares=crowdsec-waf@file,chronicle-keycloak-ratelimit,chronicle-keycloak-block-response,chronicle-keycloak-headers"
      - "traefik.http.middlewares.chronicle-keycloak-block-response.replacepathregex.regex=.*"
      - "traefik.http.middlewares.chronicle-keycloak-block-response.replacepathregex.replacement=/keycloak/blocked-route-not-found"
      - "traefik.http.middlewares.chronicle-keycloak-forwarded-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.chronicle-keycloak-forwarded-https.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.middlewares.chronicle-keycloak-forwarded-https.headers.customrequestheaders.X-Forwarded-Host=${DOMAIN}"
      - "traefik.http.middlewares.chronicle-keycloak-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.chronicle-keycloak-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.chronicle-keycloak-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      - "traefik.http.middlewares.chronicle-keycloak-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.chronicle-keycloak-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.chronicle-keycloak-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.chronicle-keycloak-headers.headers.referrerPolicy=no-referrer"
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 512

  migrate:
    build: &backend-build
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: &backend-image chronicle-backend:latest
    restart: "no"
    # Runs as the image user, like selfhost's migrate. The superuser password comes from the
    # copy backend-secrets-init stages for it; the operator-owned 0600 secret file itself is
    # unreadable here.
    entrypoint: ["/bin/sh", "/server/backend-entrypoint.sh", "--migrate"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_password
      CHRONICLE_EXPORT_DIR: /var/lib/chronicle/exports
    volumes:
      # Mounted where compose secrets live; migrate takes no compose secrets of its own.
      - migrate_secrets:/run/secrets:ro
      - audit_logs:/var/log/chronicle
      - export_artifacts:/var/lib/chronicle/exports
      - ./postgres-ssl/ca/ca.crt:/app/ssl/ca.crt:ro,z
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=256M,mode=0700,uid=100,gid=101"]
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      backend-secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [chronicle-internal]

  # chronicle-backend and migrate run as the image's unprivileged `chronicle` user (100:101).
  # Compose bind-mounts file secrets with their host owner and mode and ignores uid/gid/mode
  # for them, and scripts/rotate-secrets.sh keeps those files 0600 and operator-owned, so
  # neither can read them itself. This one-shot is the only root step: it copies them, owned
  # by chronicle (100:101) and 0400, into one volume per consumer, so the backend never sees the
  # superuser password and migrate sees nothing else. It runs before every backend or
  # migrate start, so a rotated secret file reaches the next start.
  backend-secrets-init:
    # A pinned base image rather than the backend image, so docker-compose.production.yml
    # (which swaps the backend for a registry digest) needs no local build for this step.
    # 100:101 is the backend image's `chronicle` user, as in selfhost/docker-compose.yml.
    image: alpine:3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        umask 077
        stage() {
          dir=$$1; shift
          chown 100:101 "$$dir"
          chmod 0700 "$$dir"
          for name in "$$@"; do
            install -o 100 -g 101 -m 0400 "/run/secrets/$$name" "$$dir/.$$name.new"
            mv -f "$$dir/.$$name.new" "$$dir/$$name"
          done
        }
        stage /staged jwt_secret hazelcast_server_password hazelcast_client_password
        stage /staged-migrate postgres_password
    secrets: [jwt_secret, hazelcast_server_password, hazelcast_client_password, postgres_password]
    volumes:
      - backend_secrets:/staged
      - migrate_secrets:/staged-migrate
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Root without these cannot read the operator-owned 0600 files or hand them to uid 100.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    read_only: true
    mem_limit: 64m
    pids_limit: 32

  chronicle-backend:
    build: *backend-build
    image: *backend-image
    container_name: chronicle-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256M
    environment:
      CHRONICLE_SERVER_XMS: ${BACKEND_XMS:--Xms512m}
      CHRONICLE_SERVER_XMX: ${BACKEND_XMX:--Xmx2g}
      # On OutOfMemoryError, EXIT the JVM so the container restart policy restarts it.
      # Without this the JVM hangs half-dead and, since there is no autoheal for
      # 'unhealthy' (only 'exited') containers, it would stay down silently. The JVM
      # reads JAVA_TOOL_OPTIONS automatically, independent of the start script.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:+ExitOnOutOfMemoryError}
      CHRONICLE_SERVER_ARGS: "local postgres medialocal"
      # Domain name for CORS configuration (used by envsubst in cors.yaml.template)
      DOMAIN: ${DOMAIN}
      CHRONICLE_PUBLIC_BASE_URL: ${CHRONICLE_PUBLIC_BASE_URL:-https://${DOMAIN}}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      # PostgreSQL SSL/TLS configuration for encryption in transit
      # Options: disable, allow, prefer, require, verify-ca, verify-full
      # Default verify-full (validates server certificate AND hostname). The backend JDBC URL
      # (rhizome-docker.yaml.template) also hardcodes sslmode=verify-full; this requires the
      # postgres server cert SAN to cover the 'postgres' hostname and be signed by the mounted
      # CA (/app/ssl/ca.crt).
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-verify-full}
      # Path to CA certificate for server certificate verification
      POSTGRES_SSL_ROOT_CERT: /app/ssl/ca.crt
      JWT_SECRET: ${JWT_SECRET}
      # JWT algorithm and key configuration (RS256 opt-in, HS256 default)
      CHRONICLE_SECURITY_JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CHRONICLE_SECURITY_JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-}
      CHRONICLE_SECURITY_JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-}
      CHRONICLE_SECURITY_JWT_KEY_ID: ${JWT_KEY_ID:-}
      # OIDC broker integration. Keycloak is the local broker; institutional providers attach there.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_PROVIDER_LABEL: ${OIDC_PROVIDER_LABEL:-Institution SSO}
      OIDC_PUBLIC_BASE_URL: ${OIDC_PUBLIC_BASE_URL:-https://${DOMAIN}}
      OIDC_REALM: ${OIDC_REALM:-chronicle}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://${DOMAIN}/keycloak/realms/${OIDC_REALM:-chronicle}}
      OIDC_AUTHORIZATION_URI: ${OIDC_AUTHORIZATION_URI:-https://${DOMAIN}/keycloak/realms/${OIDC_REALM:-chronicle}/protocol/openid-connect/auth}
      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI:-http://keycloak:8080/keycloak/realms/${OIDC_REALM:-chronicle}/protocol/openid-connect/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/keycloak/realms/${OIDC_REALM:-chronicle}/protocol/openid-connect/certs}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-chronicle-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me-local-oidc-secret}
      # `-` not `:-` so an explicitly-blank OIDC_IDP_HINT stays blank (no kc_idp_hint →
      # Keycloak's own login form) instead of falling back to the upstream-oidc broker.
      OIDC_IDP_HINT: ${OIDC_IDP_HINT-upstream-oidc}
      OIDC_COOKIE_TOKEN_CLAIM: ${OIDC_COOKIE_TOKEN_CLAIM:-id_token}
      TESTING_LOGIN_ENABLED: ${TESTING_LOGIN_ENABLED:-false}
      ALLOW_PRODUCTION_TESTING_LOGIN: ${ALLOW_PRODUCTION_TESTING_LOGIN:-false}
      # Keyed fingerprint of staff IPs in audit rows and logs; participants' never recorded.
      CHRONICLE_RECORD_STAFF_IP: ${CHRONICLE_RECORD_STAFF_IP:-false}
      CHRONICLE_SECURITY_COOKIE_SECURE: ${CHRONICLE_SECURITY_COOKIE_SECURE:?Set CHRONICLE_SECURITY_COOKIE_SECURE=true for production auth cookies}
      # MFA enforcement via RFC 8176 amr/acr claims. Production requires true.
      # Confirm explicit mfa, pwd+possession, or an approved current-session acr.
      CHRONICLE_SECURITY_REQUIRE_MFA: ${CHRONICLE_SECURITY_REQUIRE_MFA:?Set CHRONICLE_SECURITY_REQUIRE_MFA=true for production}
      CHRONICLE_SECURITY_APPROVED_MFA_ACR_VALUES: ${CHRONICLE_SECURITY_APPROVED_MFA_ACR_VALUES:-}
      CHRONICLE_SECURITY_MFA_IDP_PROOF_VERIFIED: ${CHRONICLE_SECURITY_MFA_IDP_PROOF_VERIFIED:-false}
      CHRONICLE_SECURITY_METRICS_USERNAME: chronicle-metrics
      CHRONICLE_SECURITY_METRICS_PASSWORD_FILES: /run/secrets/chronicle_security_metrics_password
      # Token expiry configuration
      CHRONICLE_SECURITY_JWT_ACCESS_TOKEN_EXPIRY_MINUTES: ${ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      CHRONICLE_SECURITY_JWT_REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-7}
      # SMTP/Email settings (optional — set SMTP_ENABLED=true in .env to activate)
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      # Public clients use enrollment-issued per-device API keys. The shared HMAC is an
      # atomic, controlled-legacy opt-in and therefore defaults false/false/blank.
      # Proxy-injected secret authenticating the X-Chronicle-Internal-Web signing
      # bypass (CWE-290 hardening). Must match the value Traefik injects on
      # /chronicle/api/web (see the traefik service + web router below).
      CHRONICLE_INTERNAL_WEB_SECRET: ${CHRONICLE_INTERNAL_WEB_SECRET:?Set CHRONICLE_INTERNAL_WEB_SECRET in the untracked production env file}
      # Hazelcast cluster authentication
      HAZELCAST_SERVER_PASSWORD: ${HAZELCAST_SERVER_PASSWORD:?Set HAZELCAST_SERVER_PASSWORD in .env}
      HAZELCAST_CLIENT_PASSWORD: ${HAZELCAST_CLIENT_PASSWORD:?Set HAZELCAST_CLIENT_PASSWORD in .env}
      # HashiCorp Vault integration (optional — set VAULT_ENABLED=true to activate)
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_ENABLED: ${VAULT_ENABLED:-false}
      # AppRole auth (preferred for production — set VAULT_AUTH_METHOD=approle)
      VAULT_AUTH_METHOD: ${VAULT_AUTH_METHOD:-token}
      VAULT_APP_ROLE_ID: ${VAULT_APP_ROLE_ID:-}
      VAULT_APP_ROLE_SECRET_ID: ${VAULT_APP_ROLE_SECRET_ID:-}
      # Structured JSON logging for Loki/SIEM ingestion
      # Set to "json" for structured output, omit or set to "text" for traditional PatternLayout
      LOG_FORMAT: json
      # Audit log directory
      # Logs are written in JSON format for SIEM integration
      AUDIT_LOG_DIR: /var/log/chronicle
      LOG_DIR: /var/log/chronicle
      CHRONICLE_EXPORT_DIR: /var/lib/chronicle/exports
      CHRONICLE_EXPORT_MAX_ROWS: "1000000"
      CHRONICLE_EXPORT_MAX_BYTES: "536870912"
      CHRONICLE_EXPORT_MAX_RUNTIME_SECONDS: "1800"
      CHRONICLE_EXPORT_MAX_TOTAL_BYTES: "8589934592"
      CHRONICLE_EXPORT_MIN_FREE_BYTES: "1073741824"
    volumes:
      # Persistent volume for audit logs
      # Rotated daily, kept 2190 days (6 years)
      # Format: JSON (NDJSON) compatible with Splunk, ELK, DataDog, etc.
      - audit_logs:/var/log/chronicle
      - export_artifacts:/var/lib/chronicle/exports
      # Copies of the jwt/hazelcast secrets readable by uid 100 (see backend-secrets-init).
      - backend_secrets:/run/chronicle-secrets:ro
      # SSL/TLS CA certificate for PostgreSQL connection verification
      - ./postgres-ssl/ca/ca.crt:/app/ssl/ca.crt:ro,z
      # Config templates — rendered by envsubst at container startup
      - ./rhizome-docker.yaml.template:/server/config/rhizome.yaml.template:ro,z
      - ./chronicle-auth.yaml.template:/server/config/chronicle-auth.yaml.template:ro,z
      - ./mail.yaml.template:/server/config/mail.yaml.template:ro,z
      - ./mobile-security.yaml.template:/server/config/mobile-security.yaml.template:ro,z
      - ./vault.yaml.template:/server/config/vault.yaml.template:ro,z
      - ./cors.yaml.template:/server/config/cors.yaml.template:ro,z
    secrets:
      # Read by the JVM directly; the host file is 0644 (docs/DEMO-2026-09-RUNBOOK.md).
      - chronicle_security_metrics_password
    # Render config templates from env vars, then start Java with /server/config on classpath
    command:
      - sh
      - -c
      - |
        umask 077
        for secret in POSTGRES_APP_PASSWORD JWT_SECRET HAZELCAST_SERVER_PASSWORD HAZELCAST_CLIENT_PASSWORD; do
          lower=$$(echo "$$secret" | tr "[:upper:]" "[:lower:]")
          file="/run/chronicle-secrets/$$lower"
          [ -f "$$file" ] && export $$secret=$$(cat "$$file")
        done
        metrics_file=/run/secrets/chronicle_security_metrics_password
        if [ ! -r "$$metrics_file" ]; then
          echo "FATAL: metrics scraper password file is missing or unreadable" >&2; exit 1
        fi
        metrics_length=$$(tr -d '\r\n' < "$$metrics_file" | wc -c | tr -d ' ')
        if [ "$$metrics_length" -lt 32 ] || [ "$$metrics_length" -gt 1024 ]; then
          echo "FATAL: metrics scraper password must be between 32 and 1024 characters" >&2; exit 1
        fi
        if [ "$$VAULT_ENABLED" = "true" ] && [ -z "$$VAULT_TOKEN" ]; then
          echo "FATAL: VAULT_ENABLED=true but VAULT_TOKEN is not set" >&2; exit 1
        fi
        if [ "$$OIDC_ENABLED" = "true" ]; then
          case "$$OIDC_CLIENT_SECRET" in
            ''|change-me-*|CHANGE_ME*) echo "FATAL: OIDC_ENABLED=true but OIDC_CLIENT_SECRET is missing or still a placeholder" >&2; exit 1 ;;
          esac
        fi

        if [ "$$CHRONICLE_SECURITY_COOKIE_SECURE" != "true" ]; then
          echo "FATAL: production requires CHRONICLE_SECURITY_COOKIE_SECURE=true" >&2; exit 1
        fi
        if [ "$$CHRONICLE_SECURITY_REQUIRE_MFA" != "true" ]; then
          echo "FATAL: production requires CHRONICLE_SECURITY_REQUIRE_MFA=true" >&2; exit 1
        fi
        if [ "$$OIDC_IDP_HINT" = "upstream-saml" ]; then
          echo "FATAL: MFA enforcement cannot use the disabled upstream SAML example until current-session AuthnContext is mapped to approved amr/acr assurance" >&2
          exit 1
        fi
        if [ "$$CHRONICLE_SECURITY_MFA_IDP_PROOF_VERIFIED" != "true" ]; then
          echo "FATAL: production requires verified live current-session MFA IdP proof" >&2
          exit 1
        fi
        mkdir -p /tmp/chronicle-config
        envsubst < /server/config/rhizome.yaml.template > /tmp/chronicle-config/rhizome.yaml
        envsubst < /server/config/chronicle-auth.yaml.template > /tmp/chronicle-config/chronicle-auth.yaml
        envsubst < /server/config/mail.yaml.template > /tmp/chronicle-config/mail.yaml
        envsubst < /server/config/mobile-security.yaml.template > /tmp/chronicle-config/mobile-security.yaml
        envsubst < /server/config/vault.yaml.template > /tmp/chronicle-config/vault.yaml
        envsubst < /server/config/cors.yaml.template > /tmp/chronicle-config/cors.yaml
        for f in rhizome.yaml chronicle-auth.yaml mail.yaml mobile-security.yaml vault.yaml cors.yaml; do
          [ -s "/tmp/chronicle-config/$$f" ] || { echo "FATAL: /tmp/chronicle-config/$$f is empty or missing after envsubst" >&2; exit 1; }
          ! grep -qF "$$(printf '%b' '\044\173')" "/tmp/chronicle-config/$$f" || { echo "FATAL: /tmp/chronicle-config/$$f contains unresolved template variables" >&2; exit 1; }
        done
        ! grep -Eq '^[[:space:]]*-[[:space:]]*"http://' /tmp/chronicle-config/cors.yaml || { echo "FATAL: production CORS must not allow plain HTTP origins" >&2; exit 1; }
        ! grep -Eq '^[[:space:]]*-[[:space:]]*"\*"' /tmp/chronicle-config/cors.yaml || { echo "FATAL: production CORS must not allow wildcard origins" >&2; exit 1; }
        ! grep -Eq '^[[:space:]]*development-mode:[[:space:]]*true' /tmp/chronicle-config/cors.yaml || { echo "FATAL: production CORS development-mode must be false" >&2; exit 1; }
        [ -d /var/log/chronicle ] || { echo "FATAL: /var/log/chronicle not mounted (audit logs required)" >&2; exit 1; }
        [ -d /var/lib/chronicle/exports ] || { echo "FATAL: /var/lib/chronicle/exports not mounted (durable exports required)" >&2; exit 1; }
        # No root step repairs ownership any more; refuse to start rather than lose audit files.
        for dir in /var/log/chronicle /var/lib/chronicle/exports; do
          { touch "$$dir/.write-probe" && rm -f "$$dir/.write-probe"; } 2>/dev/null || { echo "FATAL: $$dir is not writable by $$(id -un)" >&2; exit 1; }
        done
        exec java $$CHRONICLE_SERVER_XMS $$CHRONICLE_SERVER_XMX \
          -Xss512k -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=256m \
          -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 \
          -cp "/tmp/chronicle-config:/server/lib/*" \
          com.openlattice.chronicle.ChronicleServer local postgres medialocal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:40320/chronicle/internal/health/ready > /dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3G
          pids: 512
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend-secrets-init:
        condition: service_completed_successfully
    networks:
      - chronicle-internal
      - chronicle-sso-broker
      - chronicle-backend-bridge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=chronicle-backend-bridge"
      - "traefik.http.services.chronicle-backend.loadbalancer.server.port=40320"

      # Backend transport uses HTTP on the private chronicle-backend-bridge, port 40320.
      # A TLS cutover requires backend listener and proxy certificate configuration together.

      # ===========================================
      # MOBILE API: current v3 researcher/settings and v4 device routes
      # The Android app's Retrofit client uses absolute paths from the
      # shared StudyApi interface (e.g., /chronicle/v3/study/{id}/...),
      # so no strip-prefix is needed — the backend expects these paths.
      # ===========================================
      - "traefik.http.routers.chronicle-mobile.rule=Host(`${DOMAIN}`) && (PathPrefix(`/chronicle/v4/`) || PathPrefix(`/chronicle/v3/`) || PathPrefix(`/chronicle/limits/`))"
      - "traefik.http.routers.chronicle-mobile.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-mobile.priority=20"
      - "traefik.http.routers.chronicle-mobile.service=chronicle-backend"
      - "traefik.http.routers.chronicle-mobile.middlewares=crowdsec-waf@file,chronicle-compress,chronicle-mobile-ratelimit,chronicle-mobile-headers,chronicle-mobile-cors,chronicle-body-limit"
      # TLS terminates at the trusted upstream proxy. This Traefik entrypoint is
      # plaintext HTTP; X-Forwarded-Proto preserves the public scheme for the app.

      # Upstream TLS termination may forward to Traefik without preserving the public
      # Host header. Keep mobile API paths routed to the backend even when Host
      # is rewritten to the pool member/IP; otherwise these requests fall through
      # to the local frontend router and enrollment/upload fail at the edge.
      - "traefik.http.routers.chronicle-mobile-proxy-fallback.rule=PathPrefix(`/chronicle/v4/`) || PathPrefix(`/chronicle/v3/`) || PathPrefix(`/chronicle/limits/`)"
      - "traefik.http.routers.chronicle-mobile-proxy-fallback.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-mobile-proxy-fallback.priority=19"
      - "traefik.http.routers.chronicle-mobile-proxy-fallback.service=chronicle-backend"
      - "traefik.http.routers.chronicle-mobile-proxy-fallback.middlewares=crowdsec-waf@file,chronicle-compress,chronicle-mobile-ratelimit,chronicle-mobile-headers,chronicle-mobile-cors,chronicle-body-limit"

      # Strict rate limiting for mobile (5 req/s average, burst of 10)
      - "traefik.http.middlewares.chronicle-mobile-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.chronicle-mobile-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.chronicle-mobile-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"

      # CORS for mobile: no wildcard origin (mobile apps don't use CORS)
      # Native mobile apps make direct HTTP requests, not browser cross-origin requests.
      # Only allow the app's own domain to prevent browser-based CSRF attacks.
      - "traefik.http.middlewares.chronicle-mobile-cors.headers.accessControlAllowMethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.chronicle-mobile-cors.headers.accessControlAllowHeaders=X-Chronicle-App-Key,X-Api-Key,X-Chronicle-Device-Id,Content-Type,Accept,X-Chronicle-Signature,X-Chronicle-Timestamp,X-Chronicle-Nonce"
      - "traefik.http.middlewares.chronicle-mobile-cors.headers.accessControlAllowOriginList=https://${DOMAIN}"
      - "traefik.http.middlewares.chronicle-mobile-cors.headers.accessControlMaxAge=86400"

      # Security headers for mobile
      - "traefik.http.middlewares.chronicle-mobile-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.chronicle-mobile-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.chronicle-mobile-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.chronicle-mobile-headers.headers.permissionsPolicy=accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      - "traefik.http.middlewares.chronicle-mobile-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.chronicle-mobile-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.chronicle-mobile-headers.headers.stsPreload=true"
      # Strip the internal-web HMAC-bypass header from ALL participant-device traffic.
      # X-Chronicle-Internal-Web is legitimately stamped only by the intranet web->backend
      # router (local-apps.yml); a participant device must never carry it. Without this an
      # on-path/intranet attacker could send it on /chronicle/v4/study/... and bypass mobile
      # request signing. Empty value => Traefik removes the inbound header before forwarding.
      - "traefik.http.middlewares.chronicle-mobile-headers.headers.customRequestHeaders.X-Chronicle-Internal-Web="

      # ===========================================
      # WEB API: /chronicle/api/web/*
      # - For authenticated frontend users
      # - Requires Authorization header (validated by backend)
      # - Higher rate limits
      # ===========================================
      - "traefik.http.routers.chronicle-web.rule=Host(`${DOMAIN}`) && PathPrefix(`/chronicle/api/web/`)"
      - "traefik.http.routers.chronicle-web.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-web.priority=20"
      - "traefik.http.routers.chronicle-web.service=chronicle-backend"
      - "traefik.http.routers.chronicle-web.middlewares=crowdsec-waf@file,chronicle-compress,chronicle-web-strip,chronicle-web-internal-header,chronicle-web-ratelimit,chronicle-web-headers,chronicle-web-cors,chronicle-body-limit"

      # Request body size generated from ontology/chronicle.linkml.yaml for API endpoints
      - "traefik.http.middlewares.chronicle-body-limit.buffering.maxRequestBodyBytes=67108864"
      - "traefik.http.middlewares.chronicle-compress.compress=true"

      # Keep the browser-facing API unversioned while routing it to the v3 server contract.
      # Compose must escape '$' so Traefik receives the ${1} capture reference.
      - "traefik.http.middlewares.chronicle-web-strip.replacepathregex.regex=^/chronicle/api/web/?(.*)"
      - "traefik.http.middlewares.chronicle-web-strip.replacepathregex.replacement=/chronicle/v3/$${1}"
      # Authenticate the internal-web signing bypass with a proxy-injected secret
      # instead of the guessable literal "true" (CWE-290).
      - "traefik.http.middlewares.chronicle-web-internal-header.headers.customrequestheaders.X-Chronicle-Internal-Web=${CHRONICLE_INTERNAL_WEB_SECRET:?Set CHRONICLE_INTERNAL_WEB_SECRET in the untracked production env file}"

      # Rate limiting for web (20 req/s average, burst of 30)
      - "traefik.http.middlewares.chronicle-web-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.chronicle-web-ratelimit.ratelimit.burst=30"
      - "traefik.http.middlewares.chronicle-web-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"

      # CORS for web frontend (credentials allowed)
      - "traefik.http.middlewares.chronicle-web-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS"
      - "traefik.http.middlewares.chronicle-web-cors.headers.accessControlAllowHeaders=Authorization,Content-Type,X-Requested-With,Accept,Origin"
      - "traefik.http.middlewares.chronicle-web-cors.headers.accessControlAllowOriginList=https://${DOMAIN}"
      - "traefik.http.middlewares.chronicle-web-cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.chronicle-web-cors.headers.accessControlMaxAge=86400"

      # Security headers for web
      - "traefik.http.middlewares.chronicle-web-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.chronicle-web-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.chronicle-web-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.chronicle-web-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.chronicle-web-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.chronicle-web-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.chronicle-web-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.chronicle-web-headers.headers.contentSecurityPolicy=default-src 'none'; frame-ancestors 'none'"

      # Retired mobile prefixes terminate before the frontend, including encoded separators.
      - "traefik.http.routers.chronicle-retired.rule=PathRegexp(`^/chronicle(/|%2[Ff])(v[12]|study)(/|%2[Ff]|$$)`)"
      - "traefik.http.routers.chronicle-retired.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-retired.priority=30"
      - "traefik.http.routers.chronicle-retired.service=noop@internal"
      - "traefik.http.routers.chronicle-retired.middlewares=crowdsec-waf@file,chronicle-web-headers"

      # ===========================================
      # BLOCK direct backend access
      # Returns 404 for the retired top-level /datastore/* alias and direct admin routes.
      # ===========================================
      - "traefik.http.routers.chronicle-block.rule=Host(`${DOMAIN}`) && PathRegexp(`^/(datastore|prometheus|chronicle(/|%2[Ff])(datastore|principal|compliance|import))(/|%2[Ff]|$$)`)"
      - "traefik.http.routers.chronicle-block.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-block.priority=15"
      - "traefik.http.routers.chronicle-block.service=chronicle-backend"
      - "traefik.http.routers.chronicle-block.middlewares=crowdsec-waf@file,chronicle-web-headers,chronicle-block-response"

      # Return empty response (Traefik doesn't have a built-in 404 middleware, so we use replacepathregex to a non-existent path)
      - "traefik.http.middlewares.chronicle-block-response.replacepathregex.regex=.*"
      - "traefik.http.middlewares.chronicle-block-response.replacepathregex.replacement=/blocked-route-not-found"

  # ===========================================
  # HashiCorp Vault — secret management
  # ===========================================
  # Dev mode: runs unsealed with a deterministic root token.
  # Production: use an external Vault cluster with auto-unseal.
  # Enable with: docker compose --profile vault up -d
  vault:
    image: hashicorp/vault:1.21@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
    container_name: chronicle-vault
    restart: unless-stopped
    user: "100:1000"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777", "/vault/logs:size=8m,uid=100,gid=1000"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No IPC_LOCK: `vault server -dev` already sets disable_mlock = true (DevConfig in
    # command/server/config.go), and a non-root user under no-new-privileges could not use
    # the capability anyway.
    environment:
      CHRONICLE_ENV: ${CHRONICLE_ENV:-development}
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-chronicle-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_LOG_LEVEL: info
    volumes:
      - ./vault/init-dev-secrets.sh:/vault/scripts/init-dev-secrets.sh:ro,z
      - ./vault/chronicle-server-policy.hcl:/vault/policies/chronicle-server-policy.hcl:ro,z
    # After Vault starts in dev mode, run the init script to seed secrets
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$CHRONICLE_ENV" = "production" ] && [ -n "$$VAULT_DEV_ROOT_TOKEN_ID" ]; then
          echo "FATAL: Vault dev mode is not allowed in production. Unset VAULT_DEV_ROOT_TOKEN_ID."
          exit 1
        fi
        vault server -dev -dev-root-token-id="$$VAULT_DEV_ROOT_TOKEN_ID" &
        VAULT_PID=$$!
        # Wait for Vault to be ready
        until vault status >/dev/null 2>&1; do sleep 0.5; done
        # Seed development secrets and create AppRole
        sh /vault/scripts/init-dev-secrets.sh
        # Keep container running
        wait $$VAULT_PID
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - chronicle-internal
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256
    profiles:
      - vault

  chronicle-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.prod
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: chronicle-frontend:latest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/lib/nginx/tmp:noexec,nosuid,uid=100,gid=101
      - /var/lib/nginx/logs:noexec,nosuid,uid=100,gid=101
      - /run/nginx:noexec,nosuid,uid=100,gid=101
      - /tmp:noexec,nosuid
    container_name: chronicle-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 512
    networks:
      # Off the shared traefik-apps bridge → chronicle-private edge net, so sibling
      # app containers can no longer reach the SPA by IP. Reached only via chronicle-traefik.
      - chronicle-internal
      - chronicle-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=chronicle-edge"
      # Frontend routing is local-only in traefik/dynamic/local-apps.yml (host-gated
      # to intranet hostnames). Public exposure is API-only.
      - "traefik.http.services.chronicle-frontend.loadbalancer.server.port=8080"
      # SPA on the VIP host, IP-gated to intranet ranges (local-only@file), so the OIDC
      # dashboard login can complete over TLS (auth cookies are force-Secure — see
      # OIDC_PUBLIC_BASE_URL). priority=1 keeps it strictly below the mobile/web API
      # routers (15/20), so /chronicle/v3,v4 ingest and /chronicle/api/web are untouched;
      # this router only catches the SPA's own /chronicle assets. TLS terminates at
      # the trusted upstream proxy before this plaintext Traefik entrypoint.
      - "traefik.http.routers.chronicle-frontend-vip.rule=Host(`${DOMAIN}`) && PathPrefix(`/chronicle`)"
      - "traefik.http.routers.chronicle-frontend-vip.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-frontend-vip.priority=1"
      - "traefik.http.routers.chronicle-frontend-vip.service=chronicle-frontend"
      - "traefik.http.routers.chronicle-frontend-vip.middlewares=crowdsec-waf@file,local-only@file,chronicle-fe-strip@file,chronicle-frontend-headers@file"

  chronicle-preprocessing-frontend:
    image: chronicle-frontend:latest
    container_name: chronicle-preprocessing-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/lib/nginx/tmp:noexec,nosuid,uid=100,gid=101
      - /var/lib/nginx/logs:noexec,nosuid,uid=100,gid=101
      - /run/nginx:noexec,nosuid,uid=100,gid=101
      - /tmp:noexec,nosuid
    volumes:
      - ${PREPROCESSING_WEB_DIST:-../preprocessing-web/dist}:/usr/share/nginx/html:ro,z
      - ./nginx.preprocessing.conf:/etc/nginx/http.d/default.conf:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 512
    networks:
      - chronicle-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=chronicle-edge"
      - "traefik.http.services.chronicle-preprocessing-frontend.loadbalancer.server.port=8080"

  chronicle-apk-download:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    container_name: chronicle-apk-download
    restart: unless-stopped
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,uid=101,gid=101
      - /var/run:noexec,nosuid,uid=101,gid=101
      - /tmp:noexec,nosuid
    volumes:
      - ../dist:/srv/downloads:ro,z
      - ./nginx.apk-download.conf:/etc/nginx/conf.d/default.conf:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 128
    networks:
      - chronicle-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=chronicle-edge"
      - "traefik.http.services.chronicle-apk-download.loadbalancer.server.port=8080"
      - "traefik.http.routers.chronicle-apk-download.rule=Host(`${DOMAIN}`) && (Path(`/chronicle/downloads/Chronicle-2026-06-10-beta.1.apk`) || Path(`/chronicle/downloads/Chronicle-2026-06-10-beta.1.apk.sha256`))"
      - "traefik.http.routers.chronicle-apk-download.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-apk-download.priority=90"
      - "traefik.http.routers.chronicle-apk-download.service=chronicle-apk-download"
      - "traefik.http.routers.chronicle-apk-download.middlewares=crowdsec-waf@file,chronicle-apk-download-ratelimit,chronicle-apk-download-headers"
      - "traefik.http.routers.chronicle-apk-download-proxy-fallback.rule=Path(`/chronicle/downloads/Chronicle-2026-06-10-beta.1.apk`) || Path(`/chronicle/downloads/Chronicle-2026-06-10-beta.1.apk.sha256`)"
      - "traefik.http.routers.chronicle-apk-download-proxy-fallback.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.chronicle-apk-download-proxy-fallback.priority=89"
      - "traefik.http.routers.chronicle-apk-download-proxy-fallback.service=chronicle-apk-download"
      - "traefik.http.routers.chronicle-apk-download-proxy-fallback.middlewares=crowdsec-waf@file,chronicle-apk-download-ratelimit,chronicle-apk-download-headers"
      - "traefik.http.middlewares.chronicle-apk-download-ratelimit.ratelimit.average=2"
      - "traefik.http.middlewares.chronicle-apk-download-ratelimit.ratelimit.burst=4"
      - "traefik.http.middlewares.chronicle-apk-download-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      - "traefik.http.middlewares.chronicle-apk-download-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.chronicle-apk-download-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.chronicle-apk-download-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.chronicle-apk-download-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.chronicle-apk-download-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.chronicle-apk-download-headers.headers.stsPreload=true"

  # ===========================================
  # MONITORING: VictoriaMetrics + VictoriaLogs
  # ===========================================
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    container_name: chronicle-victoria-metrics
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    volumes:
      - health_probe:/probe:ro
      - ./monitoring/victoriametrics-scrape.yml:/etc/victoriametrics/scrape.yml:ro,z
      - victoria_metrics_data:/victoria-metrics-data
    secrets:
      - chronicle_security_metrics_password
    command:
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=30d'
      - '-promscrape.config=/etc/victoriametrics/scrape.yml'
      - '-httpListenAddr=:8428'
    networks:
      - chronicle-internal
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
    depends_on:
      health-probe: {condition: service_completed_successfully}
  victoria-metrics-credential-reloader:
    image: alpine:3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    container_name: chronicle-victoria-metrics-credential-reloader
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          sleep 15
          until wget -qO- -T 5 http://victoria-metrics:8428/-/reload >/dev/null; do
            sleep 2
          done
        done
    depends_on:
      victoria-metrics: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 5 http://victoria-metrics:8428/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chronicle-internal
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 32

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    container_name: chronicle-victoria-logs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    volumes:
      - health_probe:/probe:ro
      - victoria_logs_data:/victoria-logs-data
    command:
      - '-storageDataPath=/victoria-logs-data'
      - '-retentionPeriod=30d'
      - '-httpListenAddr=:9428'
    networks:
      - chronicle-internal
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

  # Fluent Bit ships local audit and access logs to VictoriaLogs.
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:9428/health"]
    depends_on:
      health-probe: {condition: service_completed_successfully}
  fluent-bit:
    image: fluent/fluent-bit:5.1.3@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
    container_name: chronicle-fluent-bit
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16M
      - /run:noexec,nosuid,size=1M
    volumes:
      - health_probe:/probe:ro
      - ./siem/victorialogs-fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro,z
      - ./siem/parsers.conf:/fluent-bit/etc/parsers.conf:ro,z
      - audit_logs:/var/log/chronicle:ro
      - traefik_access_logs:/var/log/traefik:ro
      - fluentbit_state:/fluent-bit/state
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:2020/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      health-probe: {condition: service_completed_successfully}
      victoria-logs: {condition: service_healthy}
    networks:
      - chronicle-internal
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: chronicle-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=512M
    environment:
      GF_SERVER_ROOT_URL: /grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: ${GF_SECURITY_COOKIE_SECURE:-true}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro,z
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro,z
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      victoria-metrics: {condition: service_healthy}
      victoria-logs: {condition: service_healthy}
    networks:
      # Off the shared traefik-apps bridge → chronicle-private edge net. Closes the
      # contradiction where Grafana was local-only at the router but reachable by IP
      # from every sibling on the flat bridge. Reached only via chronicle-traefik.
      - chronicle-internal
      - chronicle-edge
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=chronicle-edge"
      # Grafana routing is handled by the file provider (local-apps.yml)
      # to enforce internal-only access without XFF spoofing risk.
      - "traefik.http.services.chronicle-grafana.loadbalancer.server.port=3000"

networks:
  chronicle-internal:
    driver: bridge
    # internal: true blocks outbound internet access for containers on this network.
    # Database, backend, and monitoring communicate only with each other.
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
  chronicle-backend-bridge:
    # Dedicated internal bridge between Traefik and chronicle-backend.
    # Isolates the backend from the shared traefik-apps network so sibling
    # sibling application containers cannot bypass
    # CrowdSec WAF and rate-limiting by hitting chronicle-backend:40320 directly.
    name: chronicle-backend-bridge
    driver: bridge
    internal: true
  chronicle-sso-edge:
    # Narrow edge path: Traefik can reach only the Keycloak broker on this network.
    name: chronicle-sso-edge
    driver: bridge
    internal: true
  chronicle-sso-broker:
    # Narrow service path: Chronicle backend can reach only Keycloak OIDC/JWKS.
    name: chronicle-sso-broker
    driver: bridge
    internal: true
  chronicle-sso-db:
    # Narrow persistence path: Keycloak can reach only its dedicated Postgres.
    name: chronicle-sso-db
    driver: bridge
    internal: true
  chronicle-edge:
    # Chronicle-private edge net. Carries chronicle-traefik <-> chronicle's own
    # routed/infra services (frontend, grafana, crowdsec, docker-socket-proxy).
    # These were on the shared traefik-apps bridge, where any sibling project's
    # container could reach them by IP and bypass the proxy/WAF. Now only
    # chronicle-traefik bridges this net and traefik-apps.
    name: chronicle-edge
    driver: bridge
  traefik:
    # Shared bridge that operator-managed sibling services attach to via
    # `external: true` + `name: traefik-apps`.
    # chronicle-traefik joins it ONLY to route those apps; no other chronicle service
    # is on it anymore (see chronicle-edge above).
    external: true
    name: traefik-apps
volumes:
  health_probe:
  traefik_access_logs:
  postgres_data:
  postgres_replica_data:
  # Separate volume for TDE keyring to ensure key persistence
  # IMPORTANT: Back up this volume securely - loss of keys means loss of encrypted data
  postgres_tde_keyring:
  # Audit logs volume
  # Contains JSON-formatted audit entries for compliance and SIEM integration
  # Retention: 2190 days (6 years)
  # IMPORTANT: Include in backup strategy for compliance requirements
  audit_logs:
  export_artifacts:
  # Backend-readable copies of file secrets, rewritten by backend-secrets-init on every start.
  backend_secrets:
  migrate_secrets:
  # CrowdSec WAF data
  crowdsec_config:
  crowdsec_data:
  # Monitoring data
  victoria_metrics_data:
  grafana_data:
  victoria_logs_data:
  fluentbit_state:
  keycloak_data:
  keycloak_postgres_data:

# Docker secrets — source from local secret files so read-only services can mount them.
# Populate docker/secrets/* from a secret manager or a local .env bootstrap; never commit them.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_secret:
    file: ./secrets/jwt_secret
  hazelcast_server_password:
    file: ./secrets/hazelcast_server_password
  hazelcast_client_password:
    file: ./secrets/hazelcast_client_password
  chronicle_security_metrics_password:
    file: ./secrets/chronicle_security_metrics_password
