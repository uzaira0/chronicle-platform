# Accepted findings for scripts/publish-images.sh. Each entry: one advisory, the exact artifact,
# why it is not reachable, and an expiry that forces a re-check.
vulnerabilities:
  - id: CVE-2026-89407
    paths:
      - "server/lib/hazelcast-5.7.0.jar"
    expired_at: 2026-12-31
    statement: >-
      jackson-core 2.21.2 and 3.1.2 shaded (relocated to com.hazelcast.shaded) inside Hazelcast
      5.7.0, the newest Hazelcast OSS release (regular-expression backtracking, denial of service
      only). Reachable only through JSON that Hazelcast itself parses: Chronicle stores no
      HazelcastJsonValue, the Hazelcast REST API is off, and the member port is not published
      outside the compose network. Chronicle's own jackson-core is 2.22.3. Drop when Hazelcast
      ships a patched shade.
  - id: CVE-2026-89425
    paths:
      - "server/lib/hazelcast-5.7.0.jar"
    expired_at: 2026-12-31
    statement: >-
      Same shaded jackson-core in Hazelcast 5.7.0 (unbounded buffer growth on a malformed token,
      denial of service only); same reachability as CVE-2026-89407.
  - id: CVE-2026-68494
    paths:
      - "server/lib/hazelcast-5.7.0.jar"
    expired_at: 2026-12-31
    statement: >-
      Same shaded jackson-core in Hazelcast 5.7.0 (incomplete fix in the async JSON parser, denial
      of service only). Bytecode scan of the 5.7.0 jar: no class outside the shaded jackson
      packages calls createNonBlocking*.
  - id: CVE-2026-54512
    paths:
      - "server/lib/hazelcast-5.7.0.jar"
    expired_at: 2026-11-30
    statement: >-
      jackson-databind 2.21.2 and 3.1.2 shaded inside Hazelcast 5.7.0 (deserialization). Bytecode scan
      of the 5.7.0 jar: no class outside the shaded jackson packages references the shaded
      databind; Hazelcast metadata uses jackson-core and Jet JSON uses jackson-jr. Chronicle's
      own databind is 2.22.3. Drop when Hazelcast ships a patched shade.
  - id: CVE-2026-54513
    paths:
      - "server/lib/hazelcast-5.7.0.jar"
    expired_at: 2026-11-30
    statement: >-
