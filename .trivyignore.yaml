    owner: uzaira0
    rechecked: 2026-11-12
    statement: >-
      MIT krb5 in four images: krb5-libs 1.21.1 in the postgres and backup images (pinned Percona 18.6.1-4
      base), Debian 13.7's four krb5 library packages in the fluentbit image (fluent/fluent-bit 5.1.3) and
      krb5-libs 1.22.1 in ghcr.io/google/cadvisor v0.60.6 (monitoring overlay). No distribution lists a fixed
      build. The advisory is a read overrun in the ASN.1 decoder when a KDC reads an unauthenticated request; no
      image has krb5kdc or kadmind (file listing of the linux/amd64 images, 2026-11-12). The decoder is libkrb5
      code that a GSS-API acceptor or initiator also runs on Kerberos messages, so those callers were checked
      the same day. Acceptor: PostgreSQL in the postgres image. A peer on the internal Compose networks database
      (backend, migrate, db-init, restore, db-backup) or database-probe (operational-probe), or the Docker host,
      can send a GSSENCRequest before authentication; the server answers G and hands the peer's token to
      gss_accept_sec_context (secure_open_gssapi, src/backend/libpq/be-secure-gssapi.c). Probe of the built
      image with synthetic tokens: a Kerberos-mechanism token fails with "Key table entry not found", a SPNEGO
      token with "SPNEGO cannot find mechanisms to negotiate", three IAKERB tokens (well-formed and malformed)
      with "No credentials were supplied"; each connection closes, the server log has no terminated-process line
      and the server keeps answering. Source (tag krb5-1.21.1-final): kg_accept_krb5 acquires the acceptor
      credential (accept_sec_context.c:717-727) before g_verify_token_header (752) and decode_krb5_ap_req (813);
      SPNEGO stops at get_negotiable_mechs (spnego_mech.c:1321); the mechglue refuses IAKERB without an acceptor
      credential (g_accept_sec_context.c:253-256). The image has no keytab and selfhost/config/postgres-hba.conf
      has only scram-sha-256 lines, so such a peer reaches PostgreSQL's packet framing, the GSS token header and
      SPNEGO's NegTokenInit parser, and not libkrb5's ASN.1 decoder. Initiators: libpq drops GSS when
      gss_acquire_cred finds no credential cache (src/interfaces/libpq/fe-connect.c:4819-4840 at REL_18_6); no
      image has kinit, a keytab or a ticket cache; no Chronicle script passes curl --negotiate; the fluent-bit
      binary imports no gss_ or krb5_ symbol, and its libcurl and libpq import only initiator functions.
      cAdvisor: /usr/bin/cadvisor needs only libpfm and musl; only the ZFS tools load the Kerberos libraries
      (through libtirpc), and the service (selfhost/overlays/monitoring.yml) runs cadvisor and a busybox wget
      health check. Drop when the distributions ship a fixed build.
