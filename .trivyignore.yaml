  - id: CVE-2026-114406
    purls:
      - "pkg:rpm/redhat/ca-certificates@2025.2.80_v9.0.305-91.el9?arch=noarch&distro=redhat-9.8"
    expired_at: 2026-11-30
    statement: >-
      Red Hat has not shipped the ca-certificates update that distrusts the compromised eMudhra
      intermediates. selfhost/Dockerfile.backup adds all 16 of them (8 intermediates and their AAA
      cross-signs, fingerprints checked against crt.sh) to the system trust blocklist, and
      tests/container/selfhost-backup.yaml fails the build if they are not distrusted. Drop with the
      blocklist once Red Hat's package lands.
