      postgres, libpq, libcurl and libsasl2 (postgres and backup), libcurl and libpq under fluent-bit, and
      libtirpc under the ZFS tools (cAdvisor) need libgssapi_krb5.so.2. Drop when the distributions ship a fixed
      build.
