    statement: >-
      An authenticated Kerberos user can get past an authentication-indicator requirement with an unkeyed
      checksum in the CAMMAC authorization-data container. That data is read by a KDC, or by an acceptor after
      it has decrypted a service ticket with its keytab key. Same four images and same check as CVE-2026-107364:
      no image has a KDC or a keytab, PostgreSQL's GSS acceptor fails at credential acquisition before it reads
      a ticket, and no Chronicle service authenticates with Kerberos (selfhost/config/postgres-hba.conf has only
      scram-sha-256 lines), so no authentication-indicator requirement exists to get past. Drop when the
      distributions ship a fixed build.
