      and digest rechecked 2026-10-06). HAProxy uses fixed image-supplied ACL regular
      expressions, not client-supplied patterns; the affected PCRE2 compiler/JIT cannot receive
      attacker-chosen regexes. selfhost/overlays/monitoring.yml publishes no proxy port, isolates
      it on internal network docker-api with cAdvisor, permits only GET containers/info/version
      and sets POST=0.
