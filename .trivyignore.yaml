# Accepted findings for scripts/publish-images.sh. Each entry: one advisory, the exact artifact,
# why it is not reachable (statement), who rechecks it (owner), when it was last rechecked (rechecked) and
# an expiry at most 62 days after that recheck (expired_at). Trivy ignores the extra keys.
# tests/security/check-trivy-waivers.py enforces the fields and staggers the expiries (at most a quarter
# of the entries share a date); with the release scans' JSON reports (publish-images.sh, local-ci.sh
# image-gate) it also fails on an entry that suppressed nothing in any shipped image.
vulnerabilities:
  - id: CVE-2026-89407
    paths:
      - "server/lib/hazelcast-5.7.0.jar"
    expired_at: 2026-12-04
    owner: uzaira0
    rechecked: 2026-11-06
    statement: >-
      jackson-core 2.21.2 and 3.1.2 shaded (relocated to com.hazelcast.shaded) inside Hazelcast
      5.7.0, the newest Hazelcast OSS release (regular-expression backtracking, denial of service
      only). Reachable only through JSON that Hazelcast itself parses: Chronicle stores no
      HazelcastJsonValue, the Hazelcast REST API is off, and the member port is not published
      outside the compose network. Chronicle's own jackson-core is 2.22.3. Drop when Hazelcast
