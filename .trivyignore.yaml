#     the one binary package of that source in the fluent-bit image (38 entries). Four went on 2026-11-14, when
#     Debian marked postgresql-17 as not affected by them. The other 34 went on 2026-11-20: Debian's fixed build
#     (DSA-6625-1, libpq5 17.12-0+deb13u1, first seen 2026-11-13 09:59 UTC) had passed its 7 days as a new
