  - id: CVE-2026-53613
    purls:
      - "pkg:rpm/redhat/libblkid@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/libfdisk@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/libmount@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/libsmartcols@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/libuuid@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/util-linux-core@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/util-linux@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
    expired_at: 2026-12-11
    owner: uzaira0
    rechecked: 2026-11-06
    statement: >-
      Postgres and backup images (pinned Percona 18.6.1-4 base; Red Hat lists no fixed util-linux). dnf
      cannot remove util-linux or its libraries: systemd (protected) requires util-linux, libblkid and
      libfdisk, and dnf itself requires libsmartcols. The flaw is a TOCTOU in the setuid mount program for
      user/users fstab entries. Every service and one-shot run of these images (docker-compose.yml,
      overlays/backups.yml, chronicle_ops docker run) drops all capabilities and adds back only CHOWN,
      FOWNER and DAC_OVERRIDE, so mount(2) has no CAP_SYS_ADMIN; Compose services also set
      no-new-privileges, so the setuid bit grants nothing, and run read-only with Compose-supplied mounts
      and no local login. Drop when RHEL ships a fixed util-linux.
      Rechecked 2026-11-06: percona-distribution-postgresql 18.6.1-4 is still the newest image.
  - id: CVE-2026-57585
    purls:
      - "pkg:rpm/redhat/python3-pip-wheel@21.3.1-2.el9_8?arch=noarch&distro=redhat-9.8"
    expired_at: 2026-12-11
    owner: uzaira0
    rechecked: 2026-11-06
    statement: >-
      percona/percona-distribution-postgresql:18.6.1-4: no upstream fix is available for the RHEL package
      in this image (Trivy FixedVersion is empty). The PostgreSQL runtime and Bash/psql/OpenSSL helpers do
      not install packages with pip or deserialize attacker-supplied MessagePack with its vendored
      Unpacker. The wheel is only ensurepip's bundled copy; dnf cannot remove it because python3-libs
      requires it.
      Rechecked 2026-11-06: percona-distribution-postgresql 18.6.1-4 is still the newest image.
  - id: CVE-2026-76641
    purls:
      - "pkg:rpm/redhat/expat@2.5.0-9.el9_9.4?arch=x86_64&distro=redhat-9.8"
    expired_at: 2026-12-11
    owner: uzaira0
    rechecked: 2026-11-06
    statement: >-
      Postgres and backup images (pinned Percona 18.6.1-4 base, expat upgraded to 2.5.0-9.el9_9.4, the
      only build UBI 9 serves since 2.5.0-6.el9_8.7 left it; pin moved 2026-11-12, and Trivy reports this
      advisory on the new build too, status affected; Red Hat lists no fix). The flaw is an out-of-bounds
      read in parsers created with XML_ExternalEntityParserCreate.
      dnf cannot remove expat: dbus-broker (required by systemd) and
      python3-libs need it. In these images libexpat is linked only by xmlwf, dbus-broker-launch, libcomps
      and the Python 3.9 pyexpat module; none of those programs is an entrypoint. selfcheck.py and the
      dump verifier run without loading pyexpat. restore.sh imports chronicle_ops.verify for one constant,
      which loads plistlib and so pyexpat, but creates no parser there (sentence corrected 2026-11-12; the
      import probe is described under CVE-2026-115506). PostgreSQL's XML functions use libxml2. No untrusted
      XML reaches libexpat. Drop when RHEL ships a fixed expat.
      Rechecked 2026-11-06: percona-distribution-postgresql 18.6.1-4 is still the newest image.


# Newest-vendor-image findings reviewed 2026-10-06; exact package/binary scopes.
  - id: CVE-2026-14456
    purls:
      - "pkg:apk/alpine/libcrypto3@3.5.7-r0?arch=x86_64&distro=3.24.1"
      - "pkg:apk/alpine/libssl3@3.5.7-r0?arch=x86_64&distro=3.24.1"
    expired_at: 2026-11-25
    owner: uzaira0
    rechecked: 2026-11-12
    statement: >-
      tecnativa/docker-socket-proxy:v0.5.0: newest vendor image still ships it (stable releases
      and digest rechecked 2026-10-06). OpenSSL is linked into HAProxy, but
      selfhost/overlays/monitoring.yml uses plain HTTP on port 2375, publishes no host port and
      attaches the proxy only to internal network docker-api with cAdvisor. No TLS or QUIC
      listener is configured, so the vulnerable QUIC-server allocation path is not used.
      Rechecked 2026-11-12: v0.5.0 (2026-07-27) is still the newest release (GitHub API) and Docker Hub's
      v0.5.0 tag still holds the pinned digest. selfhost/monitoring/docker-api.cfg, the only configuration
      this HAProxy reads, has one bind (:2375, no ssl, no quic4/quic6). The flaw is in OpenSSL's own QUIC
      server (a Listener SSL object): in the linux/amd64 image haproxy does not import SSL_new_listener, and
      HAProxy 3.4.2's sources never call it; its QUIC imports are the three SSL_set_quic_tls_* callbacks of
      HAProxy's own QUIC stack, unused without a quic bind. Alpine v3.24 now has libssl3 and libcrypto3
      3.5.9-r0 (built 2026-09-30, past the 7-day wait); the image is not built in this repository, so taking
      them means deriving it through selfhost/os-packages/apk-install-aged.sh (open decision).
  - id: CVE-2026-103111
    purls:
      - "pkg:apk/alpine/pcre2@10.47-r1?arch=x86_64&distro=3.24.1"
    expired_at: 2026-11-26
    owner: uzaira0
    rechecked: 2026-11-12
    statement: >-
      tecnativa/docker-socket-proxy:v0.5.0 (Alpine 3.24.1, pcre2 10.47-r1): newest vendor image still ships it.
      HAProxy compiles only the patterns in its configuration, and the only configuration this HAProxy reads is
      selfhost/monitoring/docker-api.cfg (selfhost/overlays/monitoring.yml replaces the image's entrypoint): two
      fixed path_reg expressions, neither recursive. A client supplies request paths, never a pattern. The
      service publishes no host port, joins only the internal network docker-api with cAdvisor, and the
      configuration answers 403 to everything but GET on version, info and the container list, inspect and stats
      paths. The flaw is an out-of-bounds write that needs an attacker-controlled regular expression together
      with certain JIT calls; no client-chosen pattern reaches pcre2_compile here.
      Rechecked 2026-11-12: v0.5.0 (2026-07-27) is still the newest release (GitHub API) and Docker Hub's v0.5.0
      tag still holds the pinned digest; docker-api.cfg and the imports of haproxy in the linux/amd64 image
      reread. The haproxy binary imports pcre2_compile, pcre2_jit_compile, pcre2_match and pcre2_jit_match, and
      both patterns come from the mounted configuration. Alpine v3.24 now has pcre2 10.49-r0 (built 2026-10-01,
      past the 7-day wait); the image is not built in this repository, so taking it means deriving it through
      selfhost/os-packages/apk-install-aged.sh (open decision). The earlier wording (image-supplied expressions,
      POST=0) described the image's own entrypoint, which the overlay does not run.
