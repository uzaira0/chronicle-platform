# Findings in the pinned Percona 18.6.1-4 image (also the backup image base) reviewed 2026-10-21.
  - id: CVE-2026-53615
    purls:
      - "pkg:rpm/redhat/libblkid@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/libfdisk@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/libmount@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/libsmartcols@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/libuuid@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/util-linux-core@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
      - "pkg:rpm/redhat/util-linux@2.37.4-25.el9?arch=x86_64&distro=redhat-9.8"
    expired_at: 2026-12-11
    owner: uzaira0
    rechecked: 2026-11-06
    statement: >-
      Postgres and backup images (pinned Percona 18.6.1-4 base; Red Hat lists no fixed util-linux). dnf
      cannot remove util-linux or its libraries (systemd and dnf require them). The DOS partition parser
      runs only when blkid, fdisk, lsblk or mount probe a block device. No service or one-shot run of
      these images is given a device (no devices: in docker-compose.yml or overlays/backups.yml, no
      --device in chronicle_ops), all capabilities are dropped except CHOWN, FOWNER and DAC_OVERRIDE, and
      no entrypoint or script runs those tools. Drop when RHEL ships a fixed util-linux.
      Rechecked 2026-11-06: percona-distribution-postgresql 18.6.1-4 is still the newest image.
  - id: CVE-2026-111943
    purls:
      - "pkg:golang/stdlib@v1.26.9"
    paths:
      - "usr/sbin/gosu"
    expired_at: 2026-12-23
    owner: uzaira0
    rechecked: 2026-11-06
    statement: >-
      percona/percona-distribution-postgresql:18.6.1-4 ships gosu built with Go 1.26.9. crypto/x509
      intermediate-certificate verification: gosu only switches user and execs postgres; it makes no TLS
      connection and verifies no certificate.
      Rechecked 2026-11-06: percona-distribution-postgresql 18.6.1-4 is still the newest image.
