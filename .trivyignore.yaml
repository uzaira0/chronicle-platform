      overlay only (opt-in); both talk only to internal victorialogs/victoriametrics. The Grafana server
      binary, which does link x/net/html, is rebuilt with x/net 0.62.0 (Dockerfile.grafana). Rechecked
      2026-11-07: 0.33.1 is still the newest victoriametrics-logs-datasource release. Drop when either
      plugin ships with x/net 0.62.0 or newer.
