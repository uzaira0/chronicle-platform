  - id: CVE-2026-85091
    purls:
      - "pkg:apk/alpine/zlib@1.3.2-r0?arch=x86_64&distro=3.23.6"
      - "pkg:apk/alpine/zlib@1.3.2-r0?arch=x86_64&distro=3.24.1"
    expired_at: 2026-11-24
    owner: uzaira0
    rechecked: 2026-11-12
    statement: >-
      Alpine zlib 1.3.2-r0 in the newest cadvisor (v0.60.6) and docker-socket-proxy (v0.5.0) images;
      Alpine's fix (1.3.2-r1) is in neither. The overflow is in
      gz_vacate(), reached only through gzprintf()/gzvprintf() writes. The service binaries (cadvisor,
      haproxy) do not link libz and carry no static zlib (neither zlib's deflate nor its inflate version
      string is in the file). The files that need libz import no gz write function: apk and libapk import
      inflate, deflate and uncompress; in cadvisor, kmod and libkmod import only gzdopen, gzread, gzerror
      and gzclose to read compressed kernel modules, and libzfs and libzpool import only compress2 and
      uncompress. Monitoring overlay only, on internal networks.
      Drop when the vendor images carry zlib 1.3.2-r1 or newer.
      Rechecked 2026-11-12: cadvisor v0.60.6 and docker-socket-proxy v0.5.0 are still the newest releases
      (GitHub API), and Docker Hub's v0.5.0 tag still holds the pinned digest. NEEDED and import lists reread
      from the linux/amd64 root filesystem of both pinned digests: no file imports gzprintf or gzvprintf
      (libzfs and libzpool were missing from the earlier list of libz users). Alpine's fix is now zlib 1.4-r0,
      built 2026-11-06 18:22 UTC (v3.24) and 18:26 UTC (v3.23). OS packages have no 3-day path
      (docs/SUPPLY-CHAIN.md), so its wait ends 2026-11-13 18:26 UTC, not 2026-11-09 as the last recheck said.
      Neither image is built in this repository, so installing 1.4-r0 means deriving both images through
      selfhost/os-packages/apk-install-aged.sh; this short end date keeps that decision in view.
