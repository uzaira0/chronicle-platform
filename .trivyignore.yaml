# Reviewed 2026-11-12 for release 2026.11.12 (image gate at 70a693b7): MIT krb5 in the postgres, backup,
# fluentbit and cAdvisor images, and expat. Short expiries on purpose: the entries end within 21 days of that
# review.
# 2026-11-16, the postgres and backup images moved to the percona 18.7.1-1 base (RHEL 9.9 packages). Entries
# removed because Trivy reports nothing for them in the images built from it (database of 2026-11-15): util-linux
# and its libraries (2.37.4-28.el9_9.1 now), Python 3.9 (3.9.25-16.el9_9 now), gosu (built with Go 1.26.10 now)
# and zlib. Entries re-keyed to the RHEL 9.9 package: python3-pip-wheel and expat (same builds), and krb5-libs
# (1.21.1-10.el9_8.1 now, same 14 advisories; Red Hat's fixed build is 1.21.1-10.el9_9.2, and the UBI 9
# repositories did not serve it on that day).
  - id: CVE-2026-107364
    purls:
      - "pkg:rpm/redhat/krb5-libs@1.21.1-10.el9_8.1?arch=x86_64&distro=redhat-9.9"
      - "pkg:deb/debian/libgssapi-krb5-2@1.21.3-5%2Bdeb13u1?arch=amd64&distro=debian-13.7"
      - "pkg:deb/debian/libk5crypto3@1.21.3-5%2Bdeb13u1?arch=amd64&distro=debian-13.7"
      - "pkg:deb/debian/libkrb5-3@1.21.3-5%2Bdeb13u1?arch=amd64&distro=debian-13.7"
      - "pkg:deb/debian/libkrb5support0@1.21.3-5%2Bdeb13u1?arch=amd64&distro=debian-13.7"
      - "pkg:apk/alpine/krb5-libs@1.22.1-r0?arch=x86_64&distro=3.23.6"
    expired_at: 2026-12-01
    owner: uzaira0
    rechecked: 2026-11-16
    statement: >-
      MIT krb5 in four images: krb5-libs 1.21.1 in the postgres and backup images (1.21.1-10.el9_8.1 in the
      pinned Percona 18.7.1-1 base), Debian 13.7's four krb5 library packages in the fluentbit image
      (fluent/fluent-bit 5.1.3) and krb5-libs 1.22.1 in ghcr.io/google/cadvisor v0.60.6 (monitoring overlay).
      No distribution listed a fixed build on 2026-11-12. Red Hat's is 1.21.1-10.el9_9.2 now (Trivy database
      of 2026-11-15), and the UBI 9 repositories, the only ones the base is configured for, served
      1.21.1-10.el9_8.1 on 2026-11-16 (baseos primary.xml), so there was nothing to install. The advisory is a read overrun in the ASN.1 decoder when a KDC reads an unauthenticated request; no
      image has krb5kdc or kadmind (file listing of the linux/amd64 images, 2026-11-12). The decoder is libkrb5
      code that a GSS-API acceptor or initiator also runs on Kerberos messages, so those callers were checked
      the same day. Acceptor: PostgreSQL in the postgres image. A peer on the internal Compose networks database
      (backend, migrate, db-init, restore, db-backup) or database-probe (operational-probe), or the Docker host,
      can send a GSSENCRequest before authentication; the server answers G and hands the peer's token to
      gss_accept_sec_context (secure_open_gssapi, src/backend/libpq/be-secure-gssapi.c). Probe of the built
      image with synthetic tokens: a Kerberos-mechanism token fails with "Key table entry not found", a SPNEGO
      token with "SPNEGO cannot find mechanisms to negotiate", three IAKERB tokens (well-formed and malformed)
      with "No credentials were supplied"; each connection closes, the server log has no terminated-process line
      and the server keeps answering. Source (tag krb5-1.21.1-final): kg_accept_krb5 acquires the acceptor
      credential (accept_sec_context.c:717-727) before g_verify_token_header (752) and decode_krb5_ap_req (813);
      SPNEGO stops at get_negotiable_mechs (spnego_mech.c:1321); the mechglue refuses IAKERB without an acceptor
      credential (g_accept_sec_context.c:253-256). The image has no keytab and selfhost/config/postgres-hba.conf
      has only scram-sha-256 lines, so such a peer reaches PostgreSQL's packet framing, the GSS token header and
      SPNEGO's NegTokenInit parser, and not libkrb5's ASN.1 decoder. Initiators: libpq drops GSS when
      it finds no credential cache (src/interfaces/libpq/fe-connect.c:4821-4845 at REL_18_7); no
      image has kinit, a keytab or a ticket cache; no Chronicle script passes curl --negotiate; the fluent-bit
      binary imports no gss_ or krb5_ symbol, and its libcurl and libpq import only initiator functions.
      cAdvisor: /usr/bin/cadvisor needs only libpfm and musl; only the ZFS tools load the Kerberos libraries
      (through libtirpc), and the service (selfhost/overlays/monitoring.yml) runs cadvisor and a busybox wget
      health check. Drop when the distributions ship a fixed build; for the postgres and backup images that is
      a pinned upgrade once UBI serves the fixed krb5-libs and it has passed the dependency wait, or a Percona
      base that carries it.
      Rechecked 2026-11-16 on the postgres and backup images built from the 18.7.1-1 base, not on the other
      two: the file listing has no krb5kdc, kadmind, kinit or keytab; the same five synthetic tokens get the
      same refusals from PostgreSQL 18.7 and the server keeps answering; libcurl (Percona's 8.23.0 build) and
      libssh are new importers of libgssapi_krb5 there, initiators only, and no script under selfhost/ passes
      curl --negotiate or an scp or sftp address.
