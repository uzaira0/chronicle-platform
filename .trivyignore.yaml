    rechecked: 2026-11-12
    statement: >-
      decode_sequence_of() in libkrb5's ASN.1 decoder (lib/krb5/asn.1/asn1_encode.c) grows its array one element
      at a time; the advisory's case is a KDC reading an AS-REQ or TGS-REQ over TCP, and no image has a KDC. The
      function is library code, so the other callers were checked. Same four images and same reachability as
