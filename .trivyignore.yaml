      - "pkg:apk/alpine/krb5-libs@1.22.1-r0?arch=x86_64&distro=3.23.6"
    expired_at: 2026-12-01
    owner: uzaira0
    rechecked: 2026-11-12
    statement: >-
      decode_sequence_of() in libkrb5's ASN.1 decoder (lib/krb5/asn.1/asn1_encode.c) grows its array one element
      at a time; the advisory's case is a KDC reading an AS-REQ or TGS-REQ over TCP, and no image has a KDC. The
      function is library code, so the other callers were checked. Same four images and same reachability as
      CVE-2026-107364: PostgreSQL's GSS acceptor has no keytab and refuses a peer's Kerberos, SPNEGO or IAKERB
      token before libkrb5 decodes a Kerberos message (probe of the built image and krb5-1.21.1 source,
      2026-11-12); no initiator has a ticket; cadvisor loads no Kerberos library. Drop when the distributions
      ship a fixed build.
