# Chronicle development tool versions
# Install mise: https://mise.jdx.dev/getting-started.html
# Then run: mise install

[tools]
bun = "latest"
node = "lts"
# Gradle refuses to run on a JDK older than 21; 25 is the project standard (chronicle-server/build.gradle).
java = "temurin-25"

[env]
# Gradle JVM args for development
GRADLE_OPTS = "-Xmx2g -Dorg.gradle.daemon=true"
