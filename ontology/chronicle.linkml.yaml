id: https://chronicle.internal/ontology/chronicle
name: chronicle
title: Chronicle Production Contract Ontology
version: 0.1.0
description: Seed LinkML source of truth for Chronicle's cross-platform contracts,
  deployment profiles, collection modules, audit actions, and observability backend
  choices. This schema is intentionally limited to stable shared concepts while the
  repo migrates away from duplicated constants.
license: GPL-3.0-or-later
prefixes:
  linkml: https://w3id.org/linkml/
  chronicle: https://chronicle.internal/ontology/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: chronicle
default_range: string
imports:
- linkml:types
# Chronicle generator extension: byte contracts shared by server, mobile and edge.
constants:
  PARTICIPANT_PROCESSING_BLOCKED_CODE:
    value: PARTICIPANT_PROCESSING_BLOCKED
    description: A valid participant session cannot process data until the researcher removes the block.
  BROWSER_ERROR_REPORT_PATH:
    value: /chronicle/v3/observability/browser-errors
    description: Same-origin endpoint for finite browser failure counters.
  RESEARCHER_CSRF_HEADER:
    value: X-CSRF-Token
    description: Cookie-bound researcher request CSRF token header.
  EDIT_PRECONDITION_HEADER:
    value: If-Match
    description: HTTP precondition carrying the revision used to edit a resource.
  EDIT_REVISION_HEADER:
    value: ETag
    description: HTTP response header publishing the resource revision.
  USER_ACTIVITY_HEADER:
    value: X-Chronicle-User-Activity
    description: Explicit interactive researcher action age in nonnegative elapsed milliseconds.
  USER_ACTIVITY_HEADER_VALUE:
    value: "0"
    description: Header value denoting a fresh interactive researcher action.
  SESSION_IDLE_WINDOW_MS_FIELD:
    value: idleWindowMs
    description: Session metadata field carrying the configured inactivity window in milliseconds.
  PARTICIPANT_FORM_DATE_HEADER:
    value: X-Chronicle-Form-Date
    description: Calendar resource selected for a daily participant form submission.
  RANDOM_DEVICE_ID_HEADER:
    value: X-Chronicle-Random-Device-Id
    description: Enrolled source random device id sent with every mobile request.
  API_KEY_HEADER:
    value: X-Api-Key
    description: Per-device mobile API key.
  ENROLLMENT_CODE_HEADER:
    value: X-Chronicle-Enrollment-Code
    description: Study enrollment code presented while enrolling.
  MANIFEST_DIGEST_HEADER:
    value: X-Chronicle-Manifest-Digest
    description: Digest of the enrollment manifest the participant accepted.
  ENROLLMENT_ATTEMPT_ID_HEADER:
    value: X-Chronicle-Enrollment-Attempt-Id
    description: Client id that makes an enrollment retry replay the first result.
  PROPOSED_API_KEY_HEADER:
    value: X-Chronicle-Proposed-Api-Key
    description: Device-generated API key proposed during enrollment.
  WITHDRAWAL_REQUEST_ID_HEADER:
    value: X-Chronicle-Withdrawal-Request-Id
    description: Client id that makes a withdrawal retry replay the first result.
  REVIEWER_SECRET_HEADER:
    value: X-Chronicle-Reviewer-Secret
    description: Store-reviewer enrollment credential.
  SIGNATURE_HEADER:
    value: X-Chronicle-Signature
    description: HMAC signature of a mobile request.
  SIGNATURE_TIMESTAMP_HEADER:
    value: X-Chronicle-Timestamp
    description: Signing time of a mobile request.
  SIGNATURE_NONCE_HEADER:
    value: X-Chronicle-Nonce
    description: Single-use nonce of a signed mobile request.
  COLLECTION_VERSION_HEADER:
    value: X-Chronicle-Collection-Version
    description: Immutable settings revision recorded when an upload batch was captured.
  COLLECTION_DECISION_HEADER:
    value: X-Chronicle-Collection-Decision
    description: Sequence number of the phone's latest collection decision when an upload batch was captured.
  IDEMPOTENCY_KEY_HEADER:
    value: Idempotency-Key
    description: Client key that makes a create retry replay the first response.
  PARTICIPANT_FORM_CSRF_HEADER:
    value: X-Chronicle-Form-CSRF
    description: Participant form session CSRF token header.
  COLLECTION_DEFAULT_SENSOR_RATE_HZ:
    value: 5
    description: Sampling rate in Hz for a sensor module that names none.
  COLLECTION_DEFAULT_SENSOR_DUTY_ACTIVE_SECONDS:
    value: 30
    description: Seconds of sampling in each duty cycle for a sensor module that names none.
  COLLECTION_DEFAULT_SENSOR_DUTY_PERIOD_SECONDS:
    value: 300
    description: Length of one duty cycle, in seconds, for a sensor module that names none.
  COLLECTION_DEFAULT_INTERVAL_SECONDS:
    value: 900
    description: Collection interval for an interval-gated module that names none; WorkManager's 15-minute floor.
  STUDY_DEFAULT_WITHDRAWAL_MODE:
    value: KEEP_PRIOR_DATA
    description: Withdrawal mode of a study that names none; data collected before withdrawal stays available.
  MAX_REQUEST_SIZE_BYTES:
    value: 67108864
    description: Maximum wire and transport-decoded HTTP request body, in bytes. The 64 MiB ceiling is the owner's 2026-10 decision.
  REQUEST_HEADER_HEADROOM_BYTES:
    value: 16384
    description: Header allowance reserved from the Android collected request byte budget.
  UPLOAD_ROW_REJECTED_CODE:
    value: UPLOAD_ROW_REJECTED
    description: ApiError code of an upload 400 caused by a row's own content. The phone splits the batch and quarantines a single row only when refused with this code; any other 400 keeps the rows queued.
  COLLECTION_ACK_REJECTED_CODE:
    value: COLLECTION_ACK_REJECTED
    description: ApiError code of a collection-acknowledgment 400 for an acknowledgment the server can never accept (its
      evidence contradicts the enrollment receipt, the issued settings ledger or the decision already recorded under
      its sequence). The phone drops the queued acknowledgment only when refused with this code; any other refusal keeps
      it queued and retried.
  ENROLLMENT_CANCELLED_CODE:
    value: ENROLLMENT_CANCELLED
    description: ApiError code of the 410 that answers an enroll whose attempt a cancel (dashboard or phone) ended. The phone ends that attempt as cancelled (D4); the participant is never withdrawn.
  ENROLLMENT_STUDY_CHANGED_CODE:
    value: ENROLLMENT_STUDY_CHANGED
    description: ApiError code of the 409 that answers an enroll whose reviewed study changed before it bound (RS-3). The phone ends that attempt and asks the participant to open the same link again.
  UPLOAD_BODY_TIMEOUT_SECONDS:
    value: 300
    description: Fixed whole-body proxy deadline. Android adapts its byte target on slow links.
  BROWSER_DOWNLOAD_CSRF_FIELD:
    value: _csrf
    description: Hidden form field carrying the cookie-bound CSRF token for native file downloads.
  BROWSER_DOWNLOAD_REAUTHENTICATION_PATH:
    value: /login
    description: Dashboard router path of the sign-in page a native download with an expired session goes to; the
      server prefixes the dashboard's base path.
  PARTICIPANT_ID_PATTERN:
    value: '(?![.]{1,2}$)[A-Za-z0-9_.-]{1,255}'
    description: The one participant-id rule (whole-string match), shared by server writes, enrollment links and the
      dashboard's register form.
  SYNC_EXPORT_MAX_FILENAME_CHARS:
    value: 64
    description: Maximum requested filename length in a synchronous export.
# Chronicle generator extension: the one-shot migration pool, shared by deployment targets.
bootstrap_pool:
  maximumPoolSize: 2
  minimumIdle: 0
  idleTimeout: 600000
  maxLifetime: 1800000
  leakDetectionThreshold: 300000
  connectionTimeout:
    default: 5000
    selfhost: 30000
enums:
  ApiKeyScope:
    description: Researcher API key permission scopes, ordered from read to owner authority.
    permissible_values:
      READ_ONLY: {}
      WRITE: {}
      ADMIN: {}
  ParticipantFormKind:
    description: Participant capabilities bound into a form-access code and session.
    permissible_values:
      ENROLLMENT: {}
      APP_USAGE: {}
      QUESTIONNAIRE: {}
      TIME_USE_DIARY: {}
      PORTAL: {}
  UploadType:
    description: Upload buffer payload kinds, including quarantined sensor payloads.
    permissible_values:
      Android:
        annotations:
          countsAsResearchReceipt: true
      AndroidSensor:
        annotations:
          countsAsResearchReceipt: true
      AndroidSensorRejected:
        annotations:
          countsAsResearchReceipt: false
  BrowserErrorKind:
    description: Browser failure categories; no messages, URLs or stacks cross this boundary.
    permissible_values:
      ERROR: {}
      UNHANDLED_REJECTION: {}
  StudySettingType:
    description: Study settings keys; each entry owns a separate policy.
    permissible_values:
      DataCollection: {}
      Notifications: {}
      TimeUseDiary: {}
      Survey: {}
      ParticipantPolicy:
        annotations:
          lockedAfterEnrollment: true
          formField: participantPolicy
      Withdrawal:
        annotations:
          lockedAfterEnrollment: true
          formField: withdrawalMode
      AppUsageSurvey: {}
  AndroidUploadIssueCode:
    description: Closed, redacted Android upload-diagnostic issue codes; the category groups them for researchers.
    permissible_values:
      DESTINATION_MISSING:
        annotations:
          category:
            value: upload_failures
      DESTINATION_IDENTITY_MISMATCH:
        annotations:
          category:
            value: upload_failures
      DESTINATION_SOURCE_DEVICE_MISSING:
        annotations:
          category:
            value: upload_failures
      DESTINATION_SETUP_INCOMPLETE:
        annotations:
          category:
            value: upload_failures
      DESTINATION_DISABLED:
        annotations:
          category:
            value: upload_failures
      DESTINATION_NONCANONICAL:
        annotations:
          category:
            value: upload_failures
      DESTINATION_CREDENTIAL_INCOMPLETE:
        annotations:
          category:
            value: upload_failures
      HTTP_SERVER_ERROR:
        annotations:
          category:
            value: upload_failures
      HTTP_CLIENT_ERROR:
        annotations:
          category:
            value: upload_failures
      TIMEOUT:
        annotations:
          category:
            value: upload_failures
      DNS_FAILURE:
        annotations:
          category:
            value: upload_failures
      TLS_FAILURE:
        annotations:
          category:
            value: upload_failures
      CONNECTION_FAILURE:
        annotations:
          category:
            value: upload_failures
      UPLOAD_FAILURE:
        annotations:
          category:
            value: upload_failures
      APP_CRASH:
        annotations:
          category:
            value: app_crashes
      APP_CRASH_NATIVE:
        annotations:
          category:
            value: app_crashes
      APP_ANR:
        annotations:
          category:
            value: app_crashes
      SAMPLE_QUARANTINED:
        annotations:
          category:
            value: quarantined
      LOCAL_BUFFER_OVERFLOW:
        annotations:
          category:
            value: data_loss
      LOCAL_REQUEUE_OVERFLOW:
        annotations:
          category:
            value: data_loss
      LOCAL_WRITE_FAILED:
        annotations:
          category:
            value: data_loss
      LOCAL_SHUTDOWN_DROPPED:
        annotations:
          category:
            value: data_loss
      COLLECTION_GATE_DROPPED:
        annotations:
          category:
            value: data_loss
      MODULE_POLICY_ERASED:
        annotations:
          category:
            value: data_loss
      DIRECT_BOOT_CAPACITY_DROPPED:
        annotations:
          category:
            value: data_loss
      DIRECT_BOOT_CORRUPT_RECORD:
        annotations:
          category:
            value: quarantined
      COLLECTION_PAUSED_STORAGE:
        annotations:
          category:
            value: collection_paused
      COLLECTION_ACCESS_MISSING:
        annotations:
          category:
            value: collection_paused
      UNRECOGNIZED_ISSUE:
        description: >-
          Assigned by the server, never sent by a phone: a code from a newer app that this server does not
          know is stored as this value instead of refusing the batch.
        annotations:
          category:
            value: data_loss
          serverAssigned:
            value: true
  WithdrawalMode:
    description: What happens to a participant's prior data when they withdraw, chosen per study.
    permissible_values:
      KEEP_PRIOR_DATA:
        description: Data collected before withdrawal stays available to the study team.
      ERASE:
        description: Withdrawal requests erasure of the participant's prior data.
  AppUsageFrequency:
    description: App usage survey reporting frequency, chosen per study.
    permissible_values:
      DAILY: {}
      HOURLY: {}
  AppUsageDayState:
    description: Answer state of one ended survey day, a calendar day in the study time zone.
    permissible_values:
      UNANSWERED:
        description: Nothing has been answered for the day.
      ANSWERED:
        description: Every app listed for the day has an answer, or the participant confirmed a day with no apps.
      NEW_APPS:
        description: The day was answered, and uploads since then list apps that still need an answer.
  AppUsageDayConflict:
    description: Why a survey day submission was refused; the participant page shows the day again.
    permissible_values:
      ALREADY_ANSWERED:
        description: An app in the submission already has an answer for that day.
      APPS_CHANGED:
        description: The submission answers an app the day no longer lists.
      DAY_UNAVAILABLE:
        description: The day has not ended yet, or the participant was not enrolled on it.
  DeploymentProfile:
    description: Supported production deployment profiles.
    permissible_values:
      compose_transition:
        description: Current Docker Compose production-compatible path.
      k8s_production:
        description: Normal Kubernetes production overlay.
      k8s_rhel9_small:
        description: Constrained single-node RHEL 9 overlay for 4 vCPU / 8 GB.
      k8s_rhel9_standard:
        description: Preferred single-node RHEL 9 profile for 8 vCPU / 16 GB.
      k8s_rhel9_observability_colocated:
        description: Comfortable single-node profile for 8 vCPU / 32 GB with local
          observability.
  ObservabilityBackend:
    description: Approved metrics/logging backends for production Chronicle.
    permissible_values:
      victoria_metrics:
        description: VictoriaMetrics-compatible metrics store and scraper path.
      victoria_logs:
        description: VictoriaLogs-compatible log store.
      external_institutional:
        description: Institution-owned observability plane outside the dedicated host.
  SourceDeviceType:
    description: Source device platform values mirrored from chronicle-models.
    permissible_values:
      None:
        description: Participant has not enrolled a device.
      Android:
        description: Android or Android-derived source device.
      Ios:
        description: iOS source device.
  ParticipantDataType:
    description: Participant data export/download categories mirrored from chronicle-models.
    permissible_values:
      UsageEvents: {}
      AppUsageSurvey: {}
      IOSScreenTime:
        description: iOS Screen Time (DeviceActivity App & Web Usage) rows.
      AndroidSensor: {}
      SensorAvailability: {}
      BatteryTelemetry: {}
      InteractionEvents: {}
      AudioActivity: {}
      AudioContent: {}
      NotificationActivity: {}
      SleepEvents: {}
      ActivityRecognition: {}
      HealthMetrics: {}
      ConnectivityState: {}
      AppNetworkUsage: {}
      DeviceSettings: {}
      UploadDiagnostics: {}
  ParticipationStatus:
    description: Participant enrollment/collection status values mirrored from chronicle-models.
    permissible_values:
      ENROLLED:
        description: Participant is enrolled and may collect/upload enabled data.
      NOT_ENROLLED:
        description: Participant is known but not enrolled.
      PAUSED:
        description: Participant collection is temporarily paused.
      COLLECTION_COMPLETED:
        description: Participant completed collection for the study.
      UNKNOWN:
        description: Client fallback when status cannot be resolved.
      ERASED:
        description: A researcher erased this participant or device; the phone stops and wipes its local data and credentials.
  StudyLifecycleStatus:
    description: Study lifecycle values mirrored from chronicle-models.
    permissible_values:
      ACTIVE: {}
      ARCHIVED: {}
      SCHEDULED_FOR_DELETION: {}
  ConsentTrigger:
    description: What caused a participant collection-module consent decision.
    permissible_values:
      ENROLLMENT:
        description: Decisions made during enrollment orientation.
      PARTICIPANT_TOGGLE:
        description: Participant changed an optional module after enrollment.
      SETTINGS_CHANGE:
        description: Participant re-decided after a study-setting change.
      WITHDRAWAL:
        description: Participant chose to leave rather than accept a newly required
          module.
  CollectionPrivacyClass:
    description: Privacy tiers for mobile collection modules.
    permissible_values:
      BEHAVIORAL_METADATA:
        annotations:
