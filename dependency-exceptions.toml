[[exception]]
ecosystem = "oci"
name = "docker.io/percona/percona-distribution-postgresql"
version = "18.7.1-1@sha256:25b6ee7e12e0fb6eb57001b6a89023168b03ae33827e834beb69139b3c092ce7"
reviewer = "uzaira0 (owner; yes of 2026-11-14 for this image once it is three days old)"
note = "PostgreSQL 18.7, the security release of 2026-11-12, as Percona's image pushed 2026-11-13T05:09Z. It fixes flaws in the server the Chronicle database runs (among them CVE-2026-116304, CVE-2026-116315 and CVE-2026-6460; .trivyignore.yaml lists the release's 34 advisories under libpq5). They need a session that sends its own SQL; the database publishes no port and only the stack's own containers reach it (backend, db-init, restore, db-backup, operational-probe), and none of the flaws is known to be exploited. Trivy has no data for Percona's builds, so no scan reported them on 18.6.1-4. A security fix waits 3 days, which ended 2026-11-16T05:09Z; the gate has no advisory data for an image pin and applies 7, so this row stands for the 3-day rule. Checked 2026-11-16 on linux/amd64 (manifest sha256:ae8a9401c6e5d6960320dc9bcc5e475dc4e3b502f029dfc1404ba19f8b8d78d7): index, manifest and config hashes; Docker Hub's tag record unchanged since the push. 18 of the 39 packages that are not Red Hat's (the six percona-postgresql18 packages at 18.7.1-1.1.el9, pgbackrest, pg_repack, pgvector, wal2json, pg_cron, credcheck, set_user, curl and libcurl among them) are the exact builds in Percona's release repository ppg-18.7, signed with Percona's published key 9334A25F8507EFA5; 1945 of their 2348 regular files are byte-identical on the image's disk, 399 are left out of the image (398 locale catalogs and /etc/pgbackrest.conf), and 4 differ (three static ecpg archives and postgresql.conf.sample, which is identical to the 18.6.1-4 image's). pg_tde 2.2.2-7.7, pg_stat_monitor, pgaudit and pg_oidc_validator are other builds of the same source revision than the repository serves (same source hash in DISTURL), built on obs.pg.labs.percona.com and signed with key 98e7eb0c5da7c146, which repo.percona.com does not publish; rpm -V of them is clean; what differs between those builds was not compared. gosu was built on that host in 18.6.1-4 already. /entrypoint.sh equals the 18.6.1-4 one except a final newline; user, entrypoint, command and volumes are unchanged. Trivy (database of 2026-11-15) on the two images built from it reports expat, krb5-libs and python3-pip-wheel only. The 7-day wait ends 2026-11-20T05:09Z; remove this entry then."
expires = 2026-11-21
