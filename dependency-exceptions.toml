note = "CVE-2026-97054 / GO-2026-6859: an HTTP/1 server that limits the request body with MaxBytesReader panics when the limit is hit while the handler writes response headers. Reachable on the public listener: chronicle_body_limit in selfhost/caddy/snippets.caddy puts request_body max_size in front of reverse_proxy, and Caddy v2.11.9 implements it with http.MaxBytesReader (modules/caddyhttp/requestbody/requestbody.go:73); the fix's own message names this reverse-proxy case. Grafana 13.2.5 calls MaxBytesReader at 19 sites. Read: golang/go 4c1752a0 (net/http/server.go: requestTooLarge no longer writes closeAfterReply and the header map from the goroutine that reads the body; requestBodyLimitHit is an atomic.Bool that chunkWriter.writeHeader and shouldReuseConnection read) and the titles of the other 25 commits between go1.27.3 and go1.27.4. Checked 2026-11-12: all 15659 files under /usr/local/go in this image are byte-identical to go1.27.4.linux-amd64.tar.gz from go.dev (sha256 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840). The 7-day wait ends 2026-11-17T18:34Z; remove this entry then."
expires = 2026-11-20

