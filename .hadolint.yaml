# Hadolint configuration for Chronicle Dockerfiles
# https://github.com/hadolint/hadolint#configure

# Fail on warning and above
failure-threshold: warning

ignored:
  # DL3008/DL3018: Pin versions in apt-get / apk add. Release Dockerfiles install OS packages only
  # through selfhost/os-packages/ at exact, aged versions (tests/quality/test_os_package_pins.py holds
  # them to it; docs/SUPPLY-CHAIN.md "OS packages in images"). The rules stay off for the dependency
  # sandbox images under scripts/sandbox/, which are not release images.
  - DL3008
  - DL3018

trustedRegistries:
  - docker.io
  - quay.io
