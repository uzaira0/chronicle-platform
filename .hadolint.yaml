# Hadolint configuration for Chronicle Dockerfiles
# https://github.com/hadolint/hadolint#configure

# Fail on warning and above
failure-threshold: warning

ignored:
  # DL3008/DL3018: Pin versions in apt-get / apk add. Release Dockerfiles and the dependency sandbox
  # images under scripts/sandbox/ install OS packages only through selfhost/os-packages/ at exact, aged
  # versions (tests/quality/test_os_package_pins.py holds them to it; docs/SUPPLY-CHAIN.md "OS packages
  # in images"). The rules stay off for docker/Dockerfile.frontend.prod and
  # docker/hetzner/crowdsec/Dockerfile.hardened, which no self-host release builds.
  - DL3008
  - DL3018

trustedRegistries:
  - docker.io
  - quay.io
